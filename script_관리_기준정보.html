    입력예시: '예: 초진'

/* ================================================================
   비고 메타 파싱 / 조립

   14_기준정보의 비고는 구분마다 다른 메타를 담는 만능 칸이다.
     시술명 → "분류=리쥬란; 종류=스킨부스터; 단위=cc"
     세부   → "경로=국내"  /  "경로=국내,직원"
   저장 형식은 그대로 두고(서버 PROC_분류맵_ · PROC_세부경로맵_ 가 이 형식을
   그대로 읽는다), 화면에서만 키별 컬럼·입력칸으로 분해한다.
   → 사용자는 "분류=" 같은 형식을 직접 칠 일이 없다 (2026-08-21)
   ================================================================ */

function 기준정보_메타파싱(비고) {


  const 결과 = {};
  const s = String(비고 || '');

  s.split(';').forEach(function(조각) {

    const i = 조각.indexOf('=');

    if (i === -1) {
      return;
    }

    const 키 = 조각.slice(0, i).trim();
    const 값 = 조각.slice(i + 1).trim();

    if (키) {
      결과[키] = 값;
    }
  });

  return 결과;
}


/* 메타 정의 순서대로 "키=값; 키=값" 문자열을 만든다. 빈 값은 뺀다.
   메타에 없는 기존 키(과거에 다른 이름으로 들어간 것)는 뒤에 보존한다 */
function 기준정보_메타조립(메타정의, 값들, 원본비고) {

  const 조각들 = [];
  const 사용한키 = {};

  (메타정의 || []).forEach(function(m) {

    사용한키[m.키] = true;

    const v = String(값들[m.키] || '').trim();

    if (v !== '') {
      조각들.push(m.키 + '=' + v);
    }
  });

  const 기존 = 기준정보_메타파싱(원본비고);

  Object.keys(기존).forEach(function(k) {
    if (!사용한키[k] && String(기존[k]).trim() !== '') {
      조각들.push(k + '=' + 기존[k]);
    }
  });

  return 조각들.join('; ');
}


function 기준정보_escape(value) {

  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}


/* ================================================================
   화면 (구분 고정 — 탭 없음)
   ================================================================ */

function 기준정보_화면(구분) {

  const 설정 = 기준정보_구분설정[구분];
  const 메타 = 설정.메타 || [];

  return `
    <div class="기준정보카드">

      <div class="카드제목">` + 기준정보_escape(설정.카드제목) + `</div>
      <div class="카드설명">` + 기준정보_escape(설정.안내) + ` 삭제는 없으며 사용중지하면 드롭다운에서만 빠집니다.</div>

      <div class="기준정보추가줄">
        <div class="필드">
          <label>새 항목</label>
          <input type="text" id="기준정보_새값" placeholder="` + 기준정보_escape(설정.입력예시) + `">
        </div>
        ` + 메타.map(function(m) {
            return '<div class="필드">' +
              '<label>' + 기준정보_escape(m.이름) + '</label>' +
              '<input type="text" id="기준정보_새메타_' + 기준정보_escape(m.키) + '"' +
              ' placeholder="' + 기준정보_escape(m.예시 || '') + '">' +
            '</div>';
          }).join('') + `
        <button class="버튼 버튼주요" onclick="기준정보_추가()">추가</button>
        <button class="버튼 버튼보조" onclick="기준정보_불러오기()">새로고침</button>
        <div class="필드" style="margin-left:auto;">
          <label>&nbsp;</label>
          <span style="font-size:12px; color:#8b849d;" id="기준정보_건수"></span>
        </div>
      </div>

      <div class="기준정보표영역">
        <table class="기준정보표">
          <colgroup>
            <col data-key="기준ID" style="width:90px">
            <col data-key="값">
            ` + 메타.map(function(m) {
                return '<col data-key="' + 기준정보_escape(m.키) +
                  '" style="width:' + m.너비 + '">';
              }).join('') + `
            <col data-key="사용여부" style="width:80px">
            <col data-key="관리" style="width:150px">
          </colgroup>
          <thead>
            <tr>
              <th>기준ID</th><th>값</th>` +
              메타.map(function(m) {
                return '<th>' + 기준정보_escape(m.이름) + '</th>';
              }).join('') +
              `<th>사용여부</th><th>관리</th>
            </tr>
          </thead>
          <tbody id="기준정보표본문">
            <tr><td colspan="` + (4 + 메타.length) + `"><div class="기준정보안내">불러오는 중...</div></td></tr>
          </tbody>
        </table>
      </div>

      <div class="기준정보상태" id="기준정보_상태"></div>

    </div>
  `;
}


/* ================================================================
   초기화 (페이지렌더링에서 구분을 넘겨 호출)
   ================================================================ */

function 기준정보_초기화(구분) {

  기준정보_현재구분 = 구분;
  기준정보_편집중ID = null;

  /* 컬럼 너비 조절은 script_공통.html 의 표_자동리사이즈적용() 이
     페이지 렌더링 후 자동으로 붙인다. 여기서 따로 할 일 없음 */

  기준정보_불러오기();
}


/* ================================================================
   조회
   ================================================================ */

function 기준정보_불러오기() {

  기준정보_편집중ID = null;

  google.script.run

    .withSuccessHandler(function(목록) {

      기준정보_전체목록 = 목록 || [];
      기준정보_표렌더();
    })

    .withFailureHandler(function(error) {

      const tbody = document.getElementById('기준정보표본문');
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="5"><div class="기준정보안내">조회 실패</div></td></tr>';
      }
      alert('기준정보를 불러오지 못했습니다.\n' + (error && error.message ? error.message : error));
    })

    .BASE_getList(현재세션.token, { 구분: 기준정보_현재구분, 미사용포함: true });
}


/* ================================================================
   표 렌더
   ================================================================ */

function 기준정보_표렌더() {

  const tbody = document.getElementById('기준정보표본문');

  if (!tbody) {
    return;
  }

  const 현재설정 = 기준정보_구분설정[기준정보_현재구분] || {};
  const 메타 = 현재설정.메타 || [];
  const 열수 = 4 + 메타.length;

  const 목록 = 기준정보_전체목록.filter(function(r) {
    return r.구분 === 기준정보_현재구분;
  });

  const 건수 = document.getElementById('기준정보_건수');
  if (건수) {
    const 사용중 = 목록.filter(function(r) { return r.사용여부; }).length;
    건수.textContent = '사용중 ' + 사용중 + '건 / 전체 ' + 목록.length + '건';
  }

  if (목록.length === 0) {
    tbody.innerHTML = '<tr><td colspan="' + 열수 + '"><div class="기준정보안내">등록된 항목이 없습니다.</div></td></tr>';
    return;
  }

  tbody.innerHTML = 목록.map(function(r) {

    const 편집중 = r.기준ID === 기준정보_편집중ID;

    const 값칸 = 편집중
      ? '<input type="text" id="기준정보편집_' + 기준정보_escape(r.기준ID) + '" value="' + 기준정보_escape(r.값) + '">'
      : 기준정보_escape(r.값);

    /* 비고 문자열을 키별로 분해해 각 컬럼에 넣는다 */
    const 메타값 = 기준정보_메타파싱(r.비고);

    const 메타칸들 = 메타.map(function(m) {

      const v = 메타값[m.키] || '';

      const 내용 = 편집중
        ? '<input type="text" id="기준정보편집메타_' + 기준정보_escape(r.기준ID) + '_' +
          기준정보_escape(m.키) + '" value="' + 기준정보_escape(v) + '">'
        : (v === ''
            ? '<span class="기준정보빈값">-</span>'
            : 기준정보_escape(v));

      return '<td title="' + 기준정보_escape(v) + '">' + 내용 + '</td>';
    }).join('');

    const 관리칸 = 편집중
      ? '<span class="기준정보링크" onclick="기준정보_수정저장(\'' + 기준정보_escape(r.기준ID) + '\')">저장</span>' +
        '<span class="기준정보링크" onclick="기준정보_편집취소()">취소</span>'
      : '<span class="기준정보링크" onclick="기준정보_편집시작(\'' + 기준정보_escape(r.기준ID) + '\')">수정</span>' +
        (r.사용여부
          ? '<span class="기준정보링크" onclick="기준정보_사용여부(\'' + 기준정보_escape(r.기준ID) + '\', false)">사용중지</span>'
          : '<span class="기준정보링크" onclick="기준정보_사용여부(\'' + 기준정보_escape(r.기준ID) + '\', true)">사용재개</span>');

    return '<tr>' +
      '<td>' + 기준정보_escape(r.기준ID) + '</td>' +
      '<td title="' + 기준정보_escape(r.값) + '">' + 값칸 + '</td>' +
      메타칸들 +
      '<td>' + (r.사용여부 ? '사용' : '<span class="기준정보중지텍스트">중지</span>') + '</td>' +
      '<td>' + 관리칸 + '</td>' +
    '</tr>';
  }).join('');

  // 편집칸 포커스
  if (기준정보_편집중ID) {
    const input = document.getElementById('기준정보편집_' + 기준정보_편집중ID);
    if (input) {
      input.focus();
      input.select();
    }
  }
}


function 기준정보_상태표시(문구, 오류) {

  const el = document.getElementById('기준정보_상태');

  if (!el) {
    return;
  }

  el.className = '기준정보상태 ' + (오류 ? '오류' : '성공');
  el.textContent = 문구;
}


/* ================================================================
   추가
   ================================================================ */

function 기준정보_추가() {

  const input = document.getElementById('기준정보_새값');
  const 값 = input.value.trim();

  if (!값) {
    기준정보_상태표시('추가할 값을 입력해주세요.', true);
    return;
  }

  const 설정 = 기준정보_구분설정[기준정보_현재구분] || {};
  const 메타 = 설정.메타 || [];

  /* 메타 입력칸을 모아 "키=값; 키=값" 문자열로 조립한다 */
  const 메타값 = {};
  const 메타inputs = [];

  메타.forEach(function(m) {
    const el = document.getElementById('기준정보_새메타_' + m.키);
    메타inputs.push(el);
    메타값[m.키] = el ? el.value.trim() : '';
  });

  const 비고 = 기준정보_메타조립(메타, 메타값, '');

  /* 세부는 경로 메타로 내원경로에 종속된다. 비우면 전 경로 표시 + 종속 검증 생략 */
  if (기준정보_현재구분 === '세부' && !메타값['경로']) {
    const 계속 = confirm(
      '허용 내원경로를 비워두면 모든 내원경로에서 이 항목이 표시되고\n' +
      '경로 종속 검증이 생략됩니다.\n\n계속할까요?'
    );
    if (!계속) return;
  }

  google.script.run

    .withSuccessHandler(function(결과) {

      input.value = '';
      메타inputs.forEach(function(el) { if (el) el.value = ''; });
      기준정보_상태표시('"' + 결과.값 + '" 추가됨. 시술 등록 드롭다운에 바로 반영됩니다.');
      기준정보_불러오기();
    })

    .withFailureHandler(function(error) {
      기준정보_상태표시('추가 실패: ' + (error && error.message ? error.message : error), true);
    })

    .BASE_add(현재세션.token, { 구분: 기준정보_현재구분, 값: 값, 비고: 비고 });
}


/* ================================================================
   이름변경 (인라인 편집)
   ================================================================ */

function 기준정보_편집시작(기준ID) {

  기준정보_편집중ID = 기준ID;
  기준정보_표렌더();
}


function 기준정보_편집취소() {

  기준정보_편집중ID = null;
  기준정보_표렌더();
}


function 기준정보_수정저장(기준ID) {

  const input = document.getElementById('기준정보편집_' + 기준ID);
  const 새값 = input ? input.value.trim() : '';

  if (!새값) {
    기준정보_상태표시('값을 입력해주세요.', true);
    return;
  }

  const 설정 = 기준정보_구분설정[기준정보_현재구분] || {};
  const 메타 = 설정.메타 || [];

  const 원본 = 기준정보_전체목록.filter(function(r) {
    return r.기준ID === 기준ID;
  })[0];

  const 메타값 = {};

  메타.forEach(function(m) {
    const el = document.getElementById('기준정보편집메타_' + 기준ID + '_' + m.키);
    메타값[m.키] = el ? el.value.trim() : '';
  });

  const 비고 = 기준정보_메타조립(메타, 메타값, 원본 ? 원본.비고 : '');

  google.script.run

    .withSuccessHandler(function() {

      기준정보_편집중ID = null;
      기준정보_상태표시('수정되었습니다. 과거 시술 기록의 표기는 바뀌지 않습니다.');
      기준정보_불러오기();
    })

    .withFailureHandler(function(error) {
      기준정보_상태표시('변경 실패: ' + (error && error.message ? error.message : error), true);
    })

    .BASE_항목수정(현재세션.token, { 기준ID: 기준ID, 값: 새값, 비고: 비고 });
}


/* ================================================================
   사용중지 / 사용재개 (논리 삭제)
   ================================================================ */

function 기준정보_사용여부(기준ID, 사용여부) {

  const 문구 = 사용여부
    ? '이 항목을 사용재개할까요? 시술 등록 드롭다운에 다시 나타납니다.'
    : '이 항목을 사용중지할까요?\n드롭다운에서 빠지지만 과거 시술 기록은 유지됩니다.';

  if (!confirm(문구)) {
    return;
  }

  google.script.run

    .withSuccessHandler(function() {

      기준정보_상태표시(사용여부 ? '사용재개되었습니다.' : '사용중지되었습니다.');
      기준정보_불러오기();
    })

    .withFailureHandler(function(error) {
      기준정보_상태표시('처리 실패: ' + (error && error.message ? error.message : error), true);
    })

    .BASE_사용여부변경(현재세션.token, 기준ID, 사용여부);
}
</script>
