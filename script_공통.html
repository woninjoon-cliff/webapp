<script>
  /* ================================================================
     전역 상태
     ================================================================ */

  let 현재세션 = null;
  let 현재페이지 = 'dashboard';

  // 품목 관리 상태
  let 품목_원본목록 = [];
  let 품목_현재표시목록 = [];   // 검색 필터 적용 후 목록 (정렬 재적용용)
  let 품목_정렬 = { 필드: null, 방향: null };   // 방향: 'asc' | 'desc'


  /* ================================================================
     페이지 시작
     ================================================================ */

  document.addEventListener(
    'DOMContentLoaded',
    function() {

      병원목록불러오기();

    }
  );


  /* ================================================================
     병원 목록
     ================================================================ */

  function 병원목록불러오기() {

    google.script.run

      .withSuccessHandler(
        function(hospitals) {

          const select =
            document.getElementById('로그인병원');

          select.innerHTML =
            '<option value="" disabled selected hidden>병원을 선택해주세요</option>';


          hospitals.forEach(
            function(hospital) {

              const option =
                document.createElement('option');

              option.value =
                hospital.병원ID;

              option.textContent =
                hospital.병원명;

              select.appendChild(option);

            }
          );

        }
      )

      .withFailureHandler(
        function(error) {

          오류표시(
            '병원 목록을 불러오지 못했습니다.'
          );

          console.error(error);

        }
      )

      .AUTH_getHospitals();

  }


  /* ================================================================
     로그인
     ================================================================ */

  function 로그인() {

    const hospitalId =
      document.getElementById(
        '로그인병원'
      ).value;


    const username =
      document.getElementById(
        '로그인아이디'
      ).value.trim();


    const password =
      document.getElementById(
        '로그인비밀번호'
      ).value;


    오류표시('');


    if (!hospitalId) {

      오류표시(
        '병원을 선택해주세요.'
      );

      return;

    }


    if (!username) {

      오류표시(
        '아이디를 입력해주세요.'
      );

      return;

    }


    if (!password) {

      오류표시(
        '비밀번호를 입력해주세요.'
      );

      return;

    }


    const button =
      document.getElementById(
        '로그인버튼'
      );


    button.disabled = true;
    button.textContent = '로그인 중...';


    google.script.run

      .withSuccessHandler(
        function(result) {

          현재세션 = result;


          sessionStorage.setItem(
            'vivicell_session',
            result.token
          );


          sessionStorage.setItem(
            'vivicell_user',
            JSON.stringify(result.user)
          );


          앱화면표시();

        }
      )

      .withFailureHandler(
        function(error) {

          button.disabled = false;
          button.textContent = '로그인';

          오류표시(
            error.message ||
            '로그인에 실패했습니다.'
          );

        }
      )

      .AUTH_login(
        hospitalId,
        username,
        password
      );

  }


  /* ================================================================
     앱 화면 표시
     ================================================================ */

  function 앱화면표시() {

    document.getElementById(
      '인증화면'
    ).style.display = 'none';


    document.getElementById(
      '앱화면'
    ).style.display = 'flex';


    const user =
      현재세션.user;


    document.getElementById(
      '사이드바병원명'
    ).textContent =
      병원명표시(user.병원ID);


    document.getElementById(
      '상단병원명'
    ).textContent =
      병원명표시(user.병원ID);


    document.getElementById(
      '사이드바사용자명'
    ).textContent =
      user.이름;


    document.getElementById(
      '사이드바사용자권한'
    ).textContent =
      권한명표시(user.권한);


    document.getElementById(
      '상단사용자명'
    ).textContent =
      user.이름;


    페이지이동('dashboard');

  }


  /* ================================================================
     병원명
     ================================================================ */

  function 병원명표시(병원ID) {

    const select =
      document.getElementById(
        '로그인병원'
      );


    for (
      let i = 0;
      i < select.options.length;
      i++
    ) {

      if (
        select.options[i].value === 병원ID
      ) {

        return select.options[i].textContent;

      }

    }


    return 병원ID || '-';

  }


  /* ================================================================
     권한명
     ================================================================ */

  function 권한명표시(권한) {

    const map = {

    ADMIN: '관리자',

    STAFF: '직원'

  };


    return map[String(권한 || '').toUpperCase()] || 권한 || '-';

  }


  /* ================================================================
     페이지 이동
     ================================================================ */

  /* 페이지 → 소속 그룹 매핑 (하위 페이지가 어느 그룹에 속하는지) */
  const 페이지_그룹 = {
    procedure_main: 'procedure',
    procedure_register: 'procedure',
    procedure_history: 'procedure',
    procedure_multi: 'procedure',
    purchase_main: 'purchase',
    purchase_order: 'purchase',
    purchase_receive: 'purchase',
    purchase_history: 'purchase',
    purchase_vendor: 'purchase',
    purchase_unpaid: 'purchase',
    inventory_main: 'inventory',
    inventory_current: 'inventory',
    inventory_use: 'inventory',
    inventory_adjust: 'inventory',
    inventory_close: 'inventory',
    stats_sales: 'statistics',
    stats_cost: 'statistics',
    stats_profit: 'statistics',
    mgmt_hospital: 'management',
    mgmt_user: 'management',
    item: 'management',
    mgmt_cost: 'management',
    mgmt_vendor: 'management',
    mgmt_procedure: 'management',
    mgmt_manager: 'management',
    mgmt_doctor: 'management'
  };


  /* 페이지 정보 (제목/설명) */
  const 페이지정보 = {
    dashboard: { title: '대시보드', description: '통합관리 시스템 현황' },

    procedure_main: { title: '시술 메인', description: '시술 현황 요약' },
    procedure_register: { title: '시술 등록', description: '시술 일괄 등록 (전 구분)' },
    procedure_history: { title: '시술 내역', description: '시술 조회 및 수정, 취소' },
    procedure_multi: { title: '다회차 관리', description: '다회차 시술 관리' },

    purchase_main: { title: '구매 메인', description: '구매 현황 요약' },
    purchase_order: { title: '발주', description: '발주 등록 및 조회' },
    purchase_receive: { title: '입고', description: '입고 등록 및 조회' },
    purchase_history: { title: '발주/입고 이력', description: '발주 및 입고 이력' },
    purchase_vendor: { title: '거래처', description: '거래처 등록 및 관리' },
    purchase_unpaid: { title: '미지급 관리', description: '거래처 미지급금 관리' },

    inventory_main: { title: '재고 메인', description: '재고 현황 요약' },
    inventory_current: { title: '현재고', description: '품목별 현재 재고 조회 (품목 클릭 → 이력)' },
    inventory_use: { title: '사용등록', description: '재고 사용 등록' },
    inventory_adjust: { title: '재고 조정', description: '재고 조정 등록' },
    inventory_close: { title: '마감 관리', description: '기간별 재고 마감' },

    stats_sales: { title: '매출 통계', description: '매출 통계 (시술/품목/원장/지역 필터)' },
    stats_cost: { title: '원가 통계', description: '원가 통계 (시술/품목/원장/지역 필터)' },
    stats_profit: { title: '이익 통계', description: '이익 통계 (시술/품목/원장/지역 필터)' },

    mgmt_hospital: { title: '병원 관리', description: '병원 정보 관리' },
    mgmt_user: { title: '사용자 관리', description: '사용자 등록 및 권한 관리' },
    item: { title: '품목 관리', description: '품목 등록 및 조회' },
    mgmt_cost: { title: '원가 기준', description: '원가 계산 기준 설정' },
    mgmt_vendor: { title: '거래처 관리', description: '거래처 등록 및 관리' },
    mgmt_procedure: { title: '시술 관리', description: '시술명 목록 관리 (시술 등록 드롭다운)' },
    mgmt_manager: { title: '실장 관리', description: '담당실장 목록 관리' },
    mgmt_doctor: { title: '원장 관리', description: '담당원장 목록 관리' }
  };


  /* 그룹 아코디언 토글 (한 번에 한 그룹만 열림, 열 때 첫 하위 페이지 이동) */
  function 그룹토글(그룹키) {
    const 그룹요소 =
      document.querySelector(
        '.메뉴그룹[data-group="' + 그룹키 + '"]'
      );

    if (!그룹요소) return;

    const 이미열림 =
      그룹요소.classList.contains('열림');

    /* 모든 그룹 닫기 */
    document
      .querySelectorAll('.메뉴그룹')
      .forEach(function(g) {
        g.classList.remove('열림');
      });

    if (!이미열림) {
      그룹요소.classList.add('열림');

      const 첫하위 =
        그룹요소.querySelector('.하위버튼');

      if (첫하위 && 첫하위.dataset.page) {
        페이지이동(첫하위.dataset.page);
      }
    }
  }


  function 페이지이동(page) {

    현재페이지 = page;


    /* 모든 최상위/하위 버튼 active 초기화 후 해당 페이지만 active */
    document
      .querySelectorAll('.메뉴버튼, .하위버튼')
      .forEach(function(button) {
        button.classList.toggle(
          'active',
          button.dataset.page === page
        );
      });


    /* 소속 그룹만 열고 나머지 그룹 닫기 */
    const 소속그룹 = 페이지_그룹[page];

    document
      .querySelectorAll('.메뉴그룹')
      .forEach(function(g) {
        g.classList.toggle(
          '열림',
          g.dataset.group === 소속그룹
        );
      });


    const info =
      페이지정보[page] || { title: page, description: '' };


    document.getElementById(
      '페이지제목'
    ).textContent =
      info.title;


    document.getElementById(
      '페이지설명'
    ).textContent =
      info.description;


    페이지렌더링(page);

  }


  /* ================================================================
     페이지 렌더링
     ================================================================ */

  function 페이지렌더링(page) {

    const content =
      document.getElementById(
        '콘텐츠'
      );


    if (page === 'dashboard') {

      content.innerHTML =
        대시보드화면();

      return;

    }


    if (page === 'item') {

      content.innerHTML =
        품목관리화면();

      품목표_컬럼리사이즈초기화();

      품목_목록불러오기();

      return;

    }

    if (page === 'procedure_main') {
      content.innerHTML = 시술_메인화면();
      시술_메인초기화();
      return;
    }

    if (page === 'procedure_register') {
      content.innerHTML = 시술_등록화면();
      시술_등록초기화();
      return;
    }

    if (page === 'procedure_history') {
      content.innerHTML = 시술_내역화면();
      시술표_컬럼리사이즈초기화();
      시술_내역초기화();
      return;
    }

    if (page === 'mgmt_procedure') {
      content.innerHTML = 기준정보_화면('시술명');
      기준정보_초기화('시술명');
      return;
    }

    if (page === 'mgmt_manager') {
      content.innerHTML = 기준정보_화면('담당실장');
      기준정보_초기화('담당실장');
      return;
    }

    if (page === 'mgmt_doctor') {
      content.innerHTML = 기준정보_화면('담당원장');
      기준정보_초기화('담당원장');
      return;
    }


  if (page === 'mgmt_user') {

    content.innerHTML =
      사용자관리화면();

    사용자표_컬럼리사이즈초기화();

    사용자_목록불러오기();

    return;

  }


  if (page === 'mgmt_hospital') {

    content.innerHTML =
      병원관리화면();

    병원정보_불러오기();

    return;

  }


    /* 하위 페이지는 모두 준비화면 (기능 구현 순서대로 하나씩 교체) */
    const info =
      페이지정보[page] || { title: page, description: '' };

    content.innerHTML =
      준비화면(
        info.title,
        info.description + ' 화면을 준비하고 있습니다.'
      );

  }


  /* ================================================================
     대시보드
     ================================================================ */

  function 대시보드화면() {

    return `

      <div class="카드그리드">


        <div class="카드">

          <div class="카드라벨">
            오늘 시술
          </div>

          <div class="카드숫자">
            -
          </div>

          <div class="카드설명">
            시술 관리에서 확인
          </div>

        </div>


        <div class="카드">

          <div class="카드라벨">
            현재 재고 품목
          </div>

          <div class="카드숫자">
            -
          </div>

          <div class="카드설명">
            재고 관리에서 확인
          </div>

        </div>


        <div class="카드">

          <div class="카드라벨">
            진행 중 발주
          </div>

          <div class="카드숫자">
            -
          </div>

          <div class="카드설명">
            구매 관리에서 확인
          </div>

        </div>


        <div class="카드">

          <div class="카드라벨">
            재고 부족 품목
          </div>

          <div class="카드숫자">
            -
          </div>

          <div class="카드설명">
            재고 관리에서 확인
          </div>

        </div>


      </div>


      <div class="준비화면">

        <div class="준비제목">
          VIVICELLLAB ERP
        </div>

        <div class="준비설명">

          현재 로그인한 병원:
          <strong>
            ${현재세션.user.병원ID}
          </strong>

          <br>

          왼쪽 메뉴에서 관리할 업무를 선택해주세요.

        </div>

      </div>

    `;

  }


  /* ================================================================
     준비 화면
     ================================================================ */

  function 준비화면(
    title,
    description
  ) {

    return `

      <div class="준비화면">

        <div class="준비제목">
          ${title}
        </div>

        <div class="준비설명">
          ${description}
        </div>

      </div>

    `;

  }



  /* ================================================================
     로그아웃
     ================================================================ */

  function 로그아웃() {

    if (!현재세션) {
      로그인화면으로돌아가기();
      return;
    }


    google.script.run

      .withSuccessHandler(
        function() {

          로그인화면으로돌아가기();

        }
      )

      .withFailureHandler(
        function() {

          로그인화면으로돌아가기();

        }
      )

      .AUTH_logout(
        현재세션.token
      );

  }


  /* ================================================================
     로그인 화면으로
     ================================================================ */

  function 로그인화면으로돌아가기() {

    현재세션 = null;


    sessionStorage.removeItem(
      'vivicell_session'
    );

    sessionStorage.removeItem(
      'vivicell_user'
    );


    document.getElementById(
      '앱화면'
    ).style.display = 'none';


    document.getElementById(
      '인증화면'
    ).style.display = 'flex';


    document.getElementById(
      '로그인비밀번호'
    ).value = '';


    document.getElementById(
      '로그인버튼'
    ).disabled = false;


    document.getElementById(
      '로그인버튼'
    ).textContent = '로그인';

  }


  /* ================================================================
     오류
     ================================================================ */

  function 오류표시(message) {

    document.getElementById(
      '오류메시지'
    ).textContent =
      message || '';

  }


  /* ================================================================
     Enter 로그인
     ================================================================ */

  document.addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter' &&
        document.getElementById('인증화면').style.display !== 'none'
      ) {

        로그인();

      }

    }
  );

</script>
