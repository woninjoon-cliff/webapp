<script>
  /* ================================================================
     전역 상태
     ================================================================ */

  let 현재세션 = null;
  let 현재페이지 = 'dashboard';

  // 품목 관리 상태
  let 품목_원본목록 = [];
  let 품목_현재표시목록 = [];   // 검색 필터 적용 후 목록 (정렬 재적용용)
  let 품목_정렬 = { 필드: null, 방향: null };   // 방향: 'asc' | 'desc'


  /* ================================================================
     페이지 시작
     ================================================================ */

  document.addEventListener(
    'DOMContentLoaded',
    function() {

      병원목록불러오기();

    }
  );


  /* ================================================================
     병원 목록
     ================================================================ */

  function 병원목록불러오기() {

    google.script.run

      .withSuccessHandler(
        function(hospitals) {

          const select =
            document.getElementById('로그인병원');

          select.innerHTML =
            '<option value="" disabled selected hidden>병원을 선택해주세요</option>';


          hospitals.forEach(
            function(hospital) {

              const option =
                document.createElement('option');

              option.value =
                hospital.병원ID;

              option.textContent =
                hospital.병원명;

              select.appendChild(option);

            }
          );

        }
      )

      .withFailureHandler(
        function(error) {

          오류표시(
            '병원 목록을 불러오지 못했습니다.'
          );

          console.error(error);

        }
      )

      .AUTH_getHospitals();

  }


  /* ================================================================
     로그인
     ================================================================ */

  function 로그인() {

    const hospitalId =
      document.getElementById(
        '로그인병원'
      ).value;


    const username =
      document.getElementById(
        '로그인아이디'
      ).value.trim();


    const password =
      document.getElementById(
        '로그인비밀번호'
      ).value;


    오류표시('');


    if (!hospitalId) {

      오류표시(
        '병원을 선택해주세요.'
      );

      return;

    }


    if (!username) {

      오류표시(
        '아이디를 입력해주세요.'
      );

      return;

    }


    if (!password) {

      오류표시(
        '비밀번호를 입력해주세요.'
      );

      return;

    }


    const button =
      document.getElementById(
        '로그인버튼'
      );


    button.disabled = true;
    button.textContent = '로그인 중...';


    google.script.run

      .withSuccessHandler(
        function(result) {

          현재세션 = result;


          sessionStorage.setItem(
            'vivicell_session',
            result.token
          );


          sessionStorage.setItem(
            'vivicell_user',
            JSON.stringify(result.user)
          );


          앱화면표시();

        }
      )

      .withFailureHandler(
        function(error) {

          button.disabled = false;
          button.textContent = '로그인';

          오류표시(
            error.message ||
            '로그인에 실패했습니다.'
          );

        }
      )

      .AUTH_login(
        hospitalId,
        username,
        password
      );

  }


  /* ================================================================
     앱 화면 표시
     ================================================================ */

  function 앱화면표시() {

    document.getElementById(
      '인증화면'
    ).style.display = 'none';


    document.getElementById(
      '앱화면'
    ).style.display = 'flex';


    const user =
      현재세션.user;


    document.getElementById(
      '사이드바병원명'
    ).textContent =
      병원명표시(user.병원ID);


    document.getElementById(
      '상단병원명'
    ).textContent =
      병원명표시(user.병원ID);


    document.getElementById(
      '사이드바사용자명'
    ).textContent =
      user.이름;


    document.getElementById(
      '사이드바사용자권한'
    ).textContent =
      권한명표시(user.권한);


    document.getElementById(
      '상단사용자명'
    ).textContent =
      user.이름;


    페이지이동('dashboard');

  }


  /* ================================================================
     병원명
     ================================================================ */

  function 병원명표시(병원ID) {

    const select =
      document.getElementById(
        '로그인병원'
      );


    for (
      let i = 0;
      i < select.options.length;
      i++
    ) {

      if (
        select.options[i].value === 병원ID
      ) {

        return select.options[i].textContent;

      }

    }


    return 병원ID || '-';

  }


  /* ================================================================
     권한명
     ================================================================ */

  function 권한명표시(권한) {

    const map = {

    ADMIN: '관리자',

    STAFF: '직원'

  };


    return map[String(권한 || '').toUpperCase()] || 권한 || '-';

  }


  /* ================================================================
     페이지 이동
     ================================================================ */

    procedure_register: 'procedure',
    procedure_history: 'procedure',
    procedure_multi: 'procedure',
    purchase_main: 'purchase',
    purchase_order: 'purchase',
    purchase_receive: 'purchase',
    purchase_history: 'purchase',
    purchase_vendor: 'purchase',
    purchase_unpaid: 'purchase',
    inventory_main: 'inventory',
    inventory_current: 'inventory',
    inventory_use: 'inventory',
    inventory_adjust: 'inventory',
    inventory_close: 'inventory',
    stats_sales: 'statistics',
    stats_cost: 'statistics',
    stats_profit: 'statistics',
    mgmt_hospital: 'management',
    mgmt_user: 'management',
    item: 'management',
    mgmt_cost: 'management',
    mgmt_vendor: 'management',
    mgmt_procedure: 'management',
    mgmt_manager: 'management',
    mgmt_doctor: 'management',
    mgmt_visitroute: 'management',
    mgmt_visitdetail: 'management',
    mgmt_visittype: 'management'
  };


  /* 페이지 → 소속 하위그룹 매핑 (관리 > 기준정보 2단 메뉴) */
  const 페이지_하위그룹 = {
    mgmt_procedure: 'mgmt_base',
    mgmt_manager: 'mgmt_base',
    mgmt_doctor: 'mgmt_base',
    mgmt_visitroute: 'mgmt_base',
    mgmt_visitdetail: 'mgmt_base',
    mgmt_visittype: 'mgmt_base'
  };


  /* 페이지 정보 (제목/설명) */
  const 페이지정보 = {
    dashboard: { title: '대시보드', description: '통합관리 시스템 현황' },

    procedure_main: { title: '시술 메인', description: '시술 현황 요약' },
    procedure_register: { title: '시술 등록', description: '시술 일괄 등록 (전 구분)' },

    mgmt_cost: { title: '원가 기준', description: '원가 계산 기준 설정' },
    mgmt_vendor: { title: '거래처 관리', description: '거래처 등록 및 관리' },
    mgmt_procedure: { title: '시술 관리', description: '시술명 목록 관리 (시술 등록 드롭다운)' },
    mgmt_manager: { title: '실장 관리', description: '담당실장 목록 관리' },
    mgmt_doctor: { title: '원장 관리', description: '담당원장 목록 관리' },
    mgmt_visitroute: { title: '내원경로 관리', description: '내원경로 목록 관리 (시술 등록 드롭다운)' },
    mgmt_visitdetail: { title: '세부 관리', description: '내원 세부 채널 목록 관리 (비고의 경로= 메타로 내원경로 종속)' },
    mgmt_visittype: { title: '방문유형 관리', description: '방문유형 목록 관리' }
  };


  /* 그룹 아코디언 토글 (한 번에 한 그룹만 열림, 열 때 첫 하위 페이지 이동) */
  function 그룹토글(그룹키) {
    const 그룹요소 =
      document.querySelector(
        '.메뉴그룹[data-group="' + 그룹키 + '"]'
      );

    if (!그룹요소) return;

    const 이미열림 =
      그룹요소.classList.contains('열림');

    /* 모든 그룹 닫기 */
    document
      .querySelectorAll('.메뉴그룹')
      .forEach(function(g) {
        g.classList.remove('열림');
      });

    if (!이미열림) {
      그룹요소.classList.add('열림');

      const 첫하위 =
        그룹요소.querySelector('.하위버튼');

      if (첫하위 && 첫하위.dataset.page) {
        페이지이동(첫하위.dataset.page);
      }
    }
  }


  /* 하위그룹 아코디언 토글 (관리 > 기준정보, 열 때 첫 하위 페이지 이동) */
  function 하위그룹토글(하위그룹키) {
    const 요소 =
      document.querySelector(
        '.하위그룹[data-subgroup="' + 하위그룹키 + '"]'
      );

    if (!요소) return;

    if (요소.classList.contains('열림')) {
      요소.classList.remove('열림');
      return;
    }

    요소.classList.add('열림');

    const 첫하위 =
      요소.querySelector('.하위하위버튼');

    if (첫하위 && 첫하위.dataset.page) {
      페이지이동(첫하위.dataset.page);
    }
  }


  function 페이지이동(page) {

    현재페이지 = page;


    /* 모든 최상위/하위 버튼 active 초기화 후 해당 페이지만 active */
    document
      .querySelectorAll('.메뉴버튼, .하위버튼, .하위하위버튼')
      .forEach(function(button) {
        button.classList.toggle(
          'active',
          button.dataset.page === page
        );
      });


    /* 소속 그룹만 열고 나머지 그룹 닫기 */
    const 소속그룹 = 페이지_그룹[page];

    document
      .querySelectorAll('.메뉴그룹')
      .forEach(function(g) {
        g.classList.toggle(
          '열림',
          g.dataset.group === 소속그룹
        );
      });


    /* 소속 하위그룹만 열고 나머지 하위그룹 닫기 (관리 > 기준정보 2단) */
    const 소속하위그룹 = 페이지_하위그룹[page];

    document
      .querySelectorAll('.하위그룹')
      .forEach(function(g) {
        g.classList.toggle(
          '열림',
          g.dataset.subgroup === 소속하위그룹
        );
      });


    const info =
      페이지정보[page] || { title: page, description: '' };


    document.getElementById(
      '페이지제목'
    ).textContent =
      info.title;


    document.getElementById(
      '페이지설명'
    ).textContent =
      info.description;


    페이지렌더링(page);

    /* 렌더링된 표에 컬럼 너비 조절을 자동 부착.
       페이지렌더링은 분기마다 return 하므로 여기서 한 번에 처리한다 */
    표_자동리사이즈적용(page);

  }


  /* ================================================================
     페이지 렌더링
     ================================================================ */

  function 페이지렌더링(page) {

    const content =
      document.getElementById(
        '콘텐츠'
      );


    if (page === 'dashboard') {

      content.innerHTML =
        대시보드화면();

      return;

    }


    if (page === 'item') {

      content.innerHTML =
        품목관리화면();

      품목표_컬럼리사이즈초기화();

      품목_목록불러오기();

      return;

    }

    if (page === 'procedure_main') {
      content.innerHTML = 시술_메인화면();
      시술_메인초기화();
      return;
    }

    if (page === 'procedure_register') {
      content.innerHTML = 시술_등록화면();
      시술_등록초기화();
      return;
    }

    if (page === 'procedure_history') {
      content.innerHTML = 시술_내역화면();
      시술표_컬럼리사이즈초기화();
      시술_내역초기화();
      return;
    }

    if (page === 'mgmt_procedure') {
      content.innerHTML = 기준정보_화면('시술명');
      기준정보_초기화('시술명');
      return;
    }

    if (page === 'mgmt_manager') {
      content.innerHTML = 기준정보_화면('담당실장');
      기준정보_초기화('담당실장');
      return;
    }

    if (page === 'mgmt_doctor') {
      content.innerHTML = 기준정보_화면('담당원장');
      기준정보_초기화('담당원장');
      return;
    }

    if (page === 'mgmt_visitroute') {
      content.innerHTML = 기준정보_화면('내원경로');
      기준정보_초기화('내원경로');
      return;
    }

    if (page === 'mgmt_visitdetail') {
      content.innerHTML = 기준정보_화면('세부');
      기준정보_초기화('세부');
      return;
    }

    if (page === 'mgmt_visittype') {
      content.innerHTML = 기준정보_화면('방문유형');
      기준정보_초기화('방문유형');
      return;
    }

    if (page === 'mgmt_vendor') {
      content.innerHTML = 거래처_화면();
      거래처_초기화();
      return;
    }


  if (page === 'mgmt_user') {

    content.innerHTML =
      사용자관리화면();

    사용자표_컬럼리사이즈초기화();

    사용자_목록불러오기();

    return;

  }


  if (page === 'mgmt_hospital') {

    content.innerHTML =
      병원관리화면();

    병원정보_불러오기();

    return;

  }


    /* 하위 페이지는 모두 준비화면 (기능 구현 순서대로 하나씩 교체) */
    const info =
      페이지정보[page] || { title: page, description: '' };

    content.innerHTML =
      준비화면(
        info.title,
        info.description + ' 화면을 준비하고 있습니다.'
      );

  }


  /* ================================================================

     ================================================================ */

  /* ================================================================
     준비 화면
     ================================================================ */

  function 준비화면(
    title,
    description
  ) {

    return `

      <div class="준비화면">

        <div class="준비제목">
          ${title}
        </div>

        <div class="준비설명">
          ${description}
        </div>

      </div>

    `;

  }



  /* ================================================================
     로그아웃
     ================================================================ */

  function 로그아웃() {

    if (!현재세션) {
      로그인화면으로돌아가기();
      return;
    }


    google.script.run

      .withSuccessHandler(
        function() {

          로그인화면으로돌아가기();

        }
      )

      .withFailureHandler(
        function() {

          로그인화면으로돌아가기();

        }
      )

      .AUTH_logout(
        현재세션.token
      );

  }


  /* ================================================================
     로그인 화면으로
     ================================================================ */

  function 로그인화면으로돌아가기() {

    현재세션 = null;


    sessionStorage.removeItem(
      'vivicell_session'
    );

    sessionStorage.removeItem(
      'vivicell_user'
    );


    document.getElementById(
      '앱화면'
    ).style.display = 'none';


    document.getElementById(
      '인증화면'
    ).style.display = 'flex';


    document.getElementById(
      '로그인비밀번호'
    ).value = '';


    document.getElementById(
      '로그인버튼'
    ).disabled = false;


    document.getElementById(
      '로그인버튼'
    ).textContent = '로그인';

  }


  /* ================================================================
     오류
     ================================================================ */

  function 오류표시(message) {

    document.getElementById(
      '오류메시지'
    ).textContent =
      message || '';

  }


  /* ================================================================
     Enter 로그인
     ================================================================ */

  document.addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter' &&
        document.getElementById('인증화면').style.display !== 'none'
      ) {

        로그인();

      }

    }
  );


  /* ================================================================
     공용: 표 컬럼 너비 드래그 조절 — 자동 적용

     페이지 렌더링이 끝나면 표_자동리사이즈적용(page) 이 콘텐츠 영역의
     모든 <table> 을 훑어 컬럼 너비 조절을 붙인다.
     **새 화면에 표를 추가할 때 따로 할 일이 없다.** thead 만 있으면 된다.

     자동 처리 내용:
       - <colgroup> 이 없으면 컬럼 수만큼 만들어 넣는다
       - <col data-key> 가 없으면 헤더 텍스트로 채운다 (저장키가 됨)
       - 각 th 에 .리사이즈핸들 을 주입한다 (마지막 컬럼 제외)
       - th 가 static 이면 position: relative 를 준다 (핸들이 absolute)
       - 너비는 localStorage 에 페이지·표 단위로 저장·복원된다

     ★ 이미 마크업에 .리사이즈핸들 이 있는 표는 건너뛴다.
       품목표/사용자표/거래처표/시술표(내역)는 각자 전용 리사이즈 구현을
       갖고 있어서, 자동 적용까지 하면 리스너가 이중으로 붙는다.
       → 그 4개는 기존 구현이 계속 담당한다. 나머지·신규 표가 이 함수 담당.
       신규 표에는 핸들을 직접 넣지 말 것 (넣으면 자동 적용이 건너뛴다)
     ================================================================ */

  const 표너비_키접두 = '표너비_v1_';


  function 표_너비불러오기(저장키) {
    try {
      return JSON.parse(localStorage.getItem(저장키) || '{}');
    } catch (e) {
      return {};
    }
  }


  function 표_너비저장(table, 저장키) {

    const 결과 = {};

    table.querySelectorAll('colgroup col').forEach(function(col) {
      if (col.dataset.key && col.style.width) {
        결과[col.dataset.key] = col.style.width;
      }
    });

    try {
      localStorage.setItem(저장키, JSON.stringify(결과));
    } catch (e) {
      /* 저장 실패는 조용히 무시 (프라이빗 모드 등) */
    }
  }


  function 표_리사이즈부착(table, 저장키) {

    const thead = table.querySelector('thead');

    if (!thead) return;

    /* 헤더가 여러 줄이면 마지막 줄이 실제 컬럼 줄이다 */
    const 헤더행 = thead.querySelectorAll('tr');

    if (!헤더행.length) return;

    const ths = 헤더행[헤더행.length - 1].querySelectorAll('th');

    if (ths.length < 2) return;

    /* colspan 이 섞인 헤더는 컬럼 대응이 어긋나므로 건너뛴다 */
    for (let i = 0; i < ths.length; i++) {
      if (parseInt(ths[i].getAttribute('colspan') || '1', 10) !== 1) return;
    }

    /* colgroup 확보 */
    let colgroup = table.querySelector('colgroup');

    if (!colgroup) {
      colgroup = document.createElement('colgroup');
      for (let i = 0; i < ths.length; i++) {
        colgroup.appendChild(document.createElement('col'));
      }
      table.insertBefore(colgroup, table.firstChild);
    }

    const cols = colgroup.querySelectorAll('col');

    if (cols.length !== ths.length) return;

    /* 컬럼 경계선 공통 스타일 (style_공통.html .목록표) */
    table.classList.add('목록표');

    /* data-key 보정 — 헤더 텍스트를 키로 (없으면 인덱스) */
    cols.forEach(function(col, i) {
      if (!col.dataset.key) {
        col.dataset.key = (ths[i].textContent || '').trim() || ('열' + i);
      }
    });

    /* 저장된 너비 복원 */
    const 저장 = 표_너비불러오기(저장키);

    cols.forEach(function(col) {
      if (저장[col.dataset.key]) {
        col.style.width = 저장[col.dataset.key];
      }
    });

    /* 핸들 주입 + 리스너 (마지막 컬럼은 제외 — 끌 대상이 없다) */
    ths.forEach(function(th, i) {

      if (getComputedStyle(th).position === 'static') {
        th.style.position = 'relative';
      }

      if (i === ths.length - 1) return;

      const handle = document.createElement('span');
      handle.className = '리사이즈핸들';
      th.appendChild(handle);

      handle.addEventListener('mousedown', function(event) {

        event.preventDefault();
        event.stopPropagation();

        const 대상col = cols[i];
        const 시작X = event.pageX;
        const 시작너비 = 대상col.getBoundingClientRect().width;

        document.body.classList.add('리사이즈중');
        handle.classList.add('활성');

        function 드래그이동(ev) {
          대상col.style.width =
            Math.max(40, 시작너비 + (ev.pageX - 시작X)) + 'px';
        }

        function 드래그종료() {
          document.removeEventListener('mousemove', 드래그이동);
          document.removeEventListener('mouseup', 드래그종료);
          document.body.classList.remove('리사이즈중');
          handle.classList.remove('활성');
          표_너비저장(table, 저장키);
        }

        document.addEventListener('mousemove', 드래그이동);
        document.addEventListener('mouseup', 드래그종료);
      });
    });
  }


  function 표_자동리사이즈적용(page) {

    const content = document.getElementById('콘텐츠');

    if (!content) return;

    content.querySelectorAll('table').forEach(function(table, 표인덱스) {

      /* 전용 구현이 있는 표는 건너뛴다 (리스너 이중 부착 방지).
         거래처표는 핸들 클래스가 '거래처리사이즈핸들' 이라 클래스명이 정확히
         일치하지 않는다 → 부분 일치로 잡는다 */
      if (table.querySelector('[class*="리사이즈핸들"]')) return;

      const 표이름 =
        (table.className || '').trim().split(/\s+/)[0] || ('표' + 표인덱스);

      표_리사이즈부착(table, 표너비_키접두 + page + '_' + 표이름);
    });
  }

</script>
