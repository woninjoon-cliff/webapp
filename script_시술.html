/* 목록을 등록묶음ID + 환자번호 단위로 묶는다 (금일 시술 · 환자별 보기 공용) */
function 시술_묶음만들기(목록) {

  const 묶음들 = [];
  const 맵 = {};

  (목록 || []).forEach(function(r) {

    const 키 = r.등록묶음ID + '|' + r.환자번호;

    if (!맵[키]) {
      맵[키] = { 키: 키, 행들: [] };
      묶음들.push(맵[키]);
    }

    맵[키].행들.push(r);
  });

  return { 묶음들: 묶음들, 맵: 맵 };
}


/* 묶음 안에서 값이 모두 같으면 그 값, 다르면 "첫값 외" 로 표시 */
function 시술_묶음값(행들, 키) {

  const 값들 = [];

  행들.forEach(function(r) {
    const v = String(r[키] === null || r[키] === undefined ? '' : r[키]);
    if (값들.indexOf(v) === -1) {
      값들.push(v);
    }
  });

  if (값들.length === 0) return '';
  if (값들.length === 1) return 값들[0];

  return 값들[0] + ' 외';
}

    시술_숨김컬럼 = [];
  }
}


function 시술_숨김저장() {

  try {
    localStorage.setItem(시술_숨김저장키, JSON.stringify(시술_숨김컬럼));
  } catch (e) { /* 프라이빗 모드 등 — 조용히 무시 */ }

/* ================================================================
   공통 헬퍼
   ================================================================ */

function 시술_escape(value) {

  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}


function 시술_금액표시(n) {

  return (Number(n) || 0).toLocaleString('ko-KR');
}


function 시술_오늘문자열() {

  const d = new Date();

  return d.getFullYear() + '-' +
    ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
    ('0' + d.getDate()).slice(-2);
}


/* ================================================================
   기준정보 목록 로딩 (등록·내역 화면 진입 시 호출)
   완료 후 콜백 실행. 실패해도 콜백은 실행하되 안내를 남긴다.
   ================================================================ */

function 시술_기준목록불러오기(완료콜백) {

  google.script.run

    .withSuccessHandler(function(목록) {

      시술_기준목록 = { 시술명: [], 담당실장: [], 담당원장: [], 내원경로: [], 세부: [], 방문유형: [] };
      시술_시술명메타 = {};
      시술_세부경로 = {};

      (목록 || []).forEach(function(r) {

        if (시술_기준목록[r.구분]) {
          시술_기준목록[r.구분].push(r.값);
        }

        // 시술명 비고: "분류=울쎄라; 종류=레이저; 단위=샷"
        if (r.구분 === '시술명') {

          const 비고 = String(r.비고 || '');
          const 뽑기 = function(키) {
            const m = 비고.match(new RegExp(키 + '\\s*=\\s*([^;]*)'));
            return m ? m[1].trim() : '';
          };

          시술_시술명메타[r.값] = {
            분류: 뽑기('분류') || r.값,
            종류: 뽑기('종류'),
            단위: 뽑기('단위')
          };
        }

        // 세부 비고: "경로=국내" / "경로=해외" / "경로=국내,직원"
        if (r.구분 === '세부') {

          const m = String(r.비고 || '').match(/경로\s*=\s*([^;]*)/);

          if (m) {
            시술_세부경로[r.값] = m[1].split(',')
              .map(function(p) { return p.trim(); })
              .filter(function(p) { return p !== ''; });
          }
        }
      });

      if (완료콜백) 완료콜백();
    })

    .withFailureHandler(function(error) {

      console.error('기준정보 목록 조회 실패', error);
      alert('기준정보 목록을 불러오지 못했습니다.\n' + (error && error.message ? error.message : error));

      if (완료콜백) 완료콜백();
    })

    .BASE_getList(현재세션.token, {});
}


/* 단위가 기준정보와 다르면 오류 문구, 정상이면 '' (2026-08-21).
   기준정보 시술명 비고에 "단위=.." 가 없는 시술명은 자유 입력을 허용한다.
   서버(PROC_단위오류_)가 같은 규칙으로 재검증하므로 프론트는 안내용이다 */
function 시술_단위오류(시술명, 단위) {

  const 메타 = 시술_시술명메타[시술명];

  if (!메타 || !메타.단위) {
    return '';
  }

  const 입력 = String(단위 || '').trim();

  if (입력 === 메타.단위) {
    return '';
  }

  return '단위가 기준정보와 다릅니다. "' + 시술명 + '" 의 단위는 "' + 메타.단위 +
    '" 입니다' + (입력 ? ' (입력값 "' + 입력 + '")' : ' (비어 있음)') +

/* 멤버십 select 옵션. 환자번호로 걸러 그 환자의 사용 가능한 멤버십만 보여준다.
   잔액을 함께 표시해 어느 것을 쓸지 바로 판단할 수 있게 한다 */
/* 차감권(13) select 옵션.
   ★ 시술구분에 따라 내용이 완전히 달라진다:
     멤버십 → 그 환자의 멤버십 (잔액 표시)
     다회차 → 그 환자의 다회차 중 **이 행의 시술명과 같은 것만** (잔여 회수 표시)
     그 외   → 사용하지 않음
   시술명까지 보는 이유: 다회차는 특정 시술 전용이라 서버가 불일치를 차단한다.
   미리 걸러주지 않으면 저장 단계에서야 오류가 난다 */
function 시술_차감권옵션HTML(구분, 환자번호, 시술명) {

  const 번호 = String(환자번호 || '').trim();

  if (구분 !== '멤버십' && 구분 !== '다회차') {
    return '<option value="">해당없음</option>';
  }

  if (번호 === '') {
    return '<option value="">환자번호 입력</option>';
  }

  if (구분 === '멤버십') {

    const 목록 = 시술_멤버십목록.filter(function(m) {
      return String(m.환자번호) === 번호;
    });

    if (목록.length === 0) {
      return '<option value="">사용 가능 멤버십 없음</option>';
    }

    return '<option value="">선택</option>' +
      목록.map(function(m) {
        return '<option value="' + 시술_escape(m.멤버십ID) + '">' +
          시술_escape(m.등급 || m.멤버십ID) +
          ' (잔액 ' + 시술_금액표시(m.잔액) + ')</option>';
      }).join('');
  }

  const 이름 = String(시술명 || '').trim();

  const 목록 = 시술_다회차목록.filter(function(m) {
    return String(m.환자번호) === 번호 &&
      (이름 === '' || String(m.시술명) === 이름);
  });

  if (목록.length === 0) {
    return '<option value="">' +
      (이름 === '' ? '시술명 선택 필요' : '사용 가능 다회차 없음') + '</option>';
  }

  return '<option value="">선택</option>' +
    목록.map(function(m) {
      return '<option value="' + 시술_escape(m.다회차ID) + '">' +
        시술_escape(m.시술명) +
        ' (' + m.잔여회수 + '/' + m.총회수 + '회, 다음 ' +
        시술_금액표시(m.다음회차금액) + ')</option>';
    }).join('');
}


/* 해당 행의 시술구분·환자번호·시술명에 맞춰 차감권 select 를 다시 채운다.
   기존 선택값이 새 목록에 없으면 비운다 (환자·시술명·구분이 바뀐 경우) */
function 시술_행차감권갱신(tr) {

  sel.innerHTML = 시술_차감권옵션HTML(구분, 셀[0].value, 셀[4].value);

}

/* ================================================================
   시술명 datalist (타이핑 검색) — 2026-08-21 사용자 요청
   select 를 input + datalist 로 바꿔도 목록 강제는 유지한다:
   change/저장 시 아래 검사로 거르고, 서버가 최종 재검증한다
   ================================================================ */

/* 공유 datalist 를 확보하고 최신 기준목록으로 채운 뒤 id 를 돌려준다.
   body 에 두므로 화면 전환(#콘텐츠 교체)에도 살아남는다 */
function 시술_시술명목록확보() {

  let dl = document.getElementById('시술_시술명공용목록');

  if (!dl) {
    dl = document.createElement('datalist');
    dl.id = '시술_시술명공용목록';
    document.body.appendChild(dl);
  }

  dl.innerHTML = (시술_기준목록['시술명'] || []).map(function(v) {
    return '<option value="' + 시술_escape(v) + '">';
  }).join('');

  return dl.id;
}


/* input(datalist) 칸 목록 검사 — data-구분 목록에 없으면 오류 표시.
   select 의 "(목록없음)" 옵션과 같은 역할이다 */
function 시술_기준값검사(el) {

  const v = String(el.value || '').trim();
  const 목록 = 시술_기준목록[el.dataset.구분] || [];
  const 없음 = v !== '' && 목록.indexOf(v) === -1;

  el.classList.toggle('시술오류칸', 없음);

  if (없음) {
    el.dataset.목록없음 = '1';
  } else {
    delete el.dataset.목록없음;
  }

  return !없음;
}


/* select / input 공용: 현재 값이 "목록없음" 상태인가 (저장 차단 판정) */
function 시술_목록없음값(el) {

  if (el.tagName === 'INPUT') {
    시술_기준값검사(el);
    return el.dataset.목록없음 === '1';
  }

  const opt = el.options[el.selectedIndex];
  return !!(opt && opt.dataset.목록없음);
}


/* 세부 옵션 HTML — 내원경로 종속 필터
   내원경로가 비어 있으면 전체 목록, 선택돼 있으면 해당 경로 허용 값만.
   경로 메타가 없는 세부 값은 항상 표시한다 */
function 시술_세부옵션HTML(내원경로) {

  const 목록 = 시술_기준목록.세부.filter(function(v) {
    const 경로들 = 시술_세부경로[v];
    if (!내원경로 || !경로들 || 경로들.length === 0) {
      return true;
    }
    return 경로들.indexOf(내원경로) !== -1;
  });

  return '<option value="">선택</option>' +
    목록.map(function(v) {
      return '<option value="' + 시술_escape(v) + '">' + 시술_escape(v) + '</option>';
    }).join('');
}


/* 세부 select에 내원경로 필터를 적용한다.
   기존 선택값이 새 목록에 없으면 비운다 */
function 시술_세부필터적용(세부sel, 내원경로) {

  const 기존값 = 세부sel.value;

  세부sel.innerHTML = 시술_세부옵션HTML(내원경로);
  세부sel.value = 기존값;

  if (세부sel.value !== 기존값) {
    세부sel.value = '';
  }
}


/* select에 값 설정. 목록에 없으면 "(목록없음)" 임시 옵션으로 표시하고
   저장 시 차단된다. 빈값이면 미선택. */
function 시술_셀렉트값설정(sel, v) {

  v = String(v === null || v === undefined ? '' : v).trim();

  /* 시술명 input(datalist) 칸 — 값을 넣고 목록 검사로 오류 표시 (2026-08-21).
     붙여넣기·CSV·수정폼이 모두 이 함수를 거치므로 여기 한 곳이면 된다 */
  if (sel.tagName === 'INPUT') {
    sel.value = v;
    시술_기준값검사(sel);
    return;
  }

  // 기존 임시 옵션 제거
  Array.prototype.slice.call(sel.querySelectorAll('option[data-목록없음]'))
    .forEach(function(o) { o.remove(); });

  sel.classList.remove('시술오류칸');

  if (v === '') {
    sel.value = '';
    return;
  }

  sel.value = v;

  if (sel.value !== v) {
    // 목록에 없는 값 — 지우지 않고 보이게 남긴 뒤 저장 차단
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v + ' (목록없음)';
    o.dataset.목록없음 = '1';
    sel.appendChild(o);
    sel.value = v;
    sel.classList.add('시술오류칸');
  }
}


/* 패키지여부 select 값 설정 — 붙여넣기 값은 정규화해서 넣는다 */
function 시술_패키지값설정(sel, v) {

  const s = String(v === null || v === undefined ? '' : v).trim().toUpperCase();

  sel.value = (s === 'Y' || s === 'O' || s === 'TRUE' || s === '예' || s === '패키지' || s === '1')
    ? 'Y' : '';
}


/* 입력표 셀(입력칸/셀렉트)에 값 설정 */
function 시술_셀값설정(el, 열, v) {

  if (시술_셀형태[열] === '패키지') {
    시술_패키지값설정(el, v);
    return;
  }

  if (시술_셀형태[열]) {
    시술_셀렉트값설정(el, v);
    return;
  }

  const 값 = String(v === null || v === undefined ? '' : v).trim();

  /* 금액칸은 콤마를 찍어 넣는다. 값을 코드로 넣으면 input 이벤트가 나지 않아
     실시간 콤마(§7-4)가 걸리지 않는다 — 붙여넣기·CSV 로 들어온 금액만
     콤마 없이 남아 보였다. 저장은 금액칸_값() 이 콤마를 걷어내므로 무관하다 */
  el.value = el.classList.contains('금액칸') ? 금액칸_표시(값) : 값;
}

      const 구분매출 = 요약.당월구분별매출 || {};

      document.getElementById('시술요약_구분').innerHTML =
        ['일반', '멤버십', '체험단/무료', '다회차'].map(function(g) {

            시술_금액표시(구분매출[g] || 0) + '원';
        }).join('<br>');
    })

    .withFailureHandler(function(error) {
      console.error('시술 요약 조회 실패', error);
    })

    .PROC_getSummary(현재세션.token);
}


/* ================================================================
   메인: 금일 시술 (읽기 전용, 등록 묶음·환자별 1행)
   - 같은 등록묶음ID + 환자번호 = 1행 (한 사람이 받은 여러 시술을 묶음)
   - 시술 내용: "울쎄라 외 2건" 형식, 금액은 합계
   ================================================================ */

function 시술_금일불러오기() {

  const 상태 = document.getElementById('시술금일_상태');
  const tbody = document.getElementById('시술금일본문');
  const 오늘 = 시술_오늘문자열();

  google.script.run

    .withSuccessHandler(function(목록) {

      목록 = 목록 || [];

      if (!tbody) {
        return;
      }

      if (목록.length === 0) {
        if (상태) 상태.textContent = '고객 0명 시술 0건 매출 0원';
        tbody.innerHTML = '<tr><td colspan="6"><div class="시술안내">오늘 등록된 시술이 없습니다.</div></td></tr>';
        return;
      }

      // 등록묶음ID + 환자번호 단위로 묶기
      const 묶음결과 = 시술_묶음만들기(목록);
      const 묶음들 = 묶음결과.묶음들;

      /* 상세 팝업(백로그 ①)이 키로 찾아 쓴다 */
      시술_상세묶음맵 = 묶음결과.맵;

      if (상태) {
        /* 취소 건은 PROC_getList 가 이미 제외한다 (취소포함 미전달 → 기본 제외) */
        let 매출합계 = 0;
        목록.forEach(function(r) { 매출합계 += Number(r.시술금액) || 0; });

        상태.textContent =
          '고객 ' + 묶음들.length + '명 ' +
          '시술 ' + 목록.length + '건 ' +
          '매출 ' + 시술_금액표시(매출합계) + '원';
      }

      tbody.innerHTML = 묶음들.map(function(m) {

        const 첫 = m.행들[0];
        const 개수 = m.행들.length;

        const 내용 = 개수 === 1
          ? 첫.시술명
          : 첫.시술명 + ' 외 ' + (개수 - 1) + '건';

        const 전체목록 = m.행들.map(function(r) { return r.시술명; }).join(', ');

        let 합계 = 0;
        m.행들.forEach(function(r) { 합계 += Number(r.시술금액) || 0; });

        return '<tr class="시술금일행" onclick="시술_금일상세열기(\'' +
            시술_escape(m.키) + '\')" title="클릭하면 개별 시술 목록">' +
          '<td>' + 시술_escape(첫.환자번호) + '</td>' +
          '<td>' + 시술_escape(첫.환자명) + '</td>' +
          '<td>' + 시술_escape(첫.시술구분) + '</td>' +
          '<td title="' + 시술_escape(전체목록) + '">' + 시술_escape(내용) + '</td>' +
          '<td class="우">' + 개수 + '</td>' +
          '<td class="우">' + 시술_금액표시(합계) + '</td>' +
        '</tr>';
      }).join('');
    })

    .withFailureHandler(function(error) {

      if (상태) {
        상태.textContent = '조회 실패';
      }

      console.error('금일 시술 조회 실패', error);
    })

    .PROC_getList(현재세션.token, { 시작일: 오늘, 종료일: 오늘, 최대건수: 500 });
}

function 시술_기간방식전환() {

  const 방식 = document.getElementById('시술검색_기간방식').value;

  document.getElementById('시술검색_월필드').style.display = 방식 === '월별' ? '' : 'none';

  document.getElementById('시술검색_종료필드').style.display = 방식 === '기간' ? '' : 'none';
}


/* 선택된 기간 방식 → 시작일/종료일 환산 */
function 시술_기간계산() {

  const 방식 = document.getElementById('시술검색_기간방식').value;

  if (방식 === '월별') {

    const v = document.getElementById('시술검색_월').value; // 'yyyy-MM'

    if (!v) {
      return { 시작일: '', 종료일: '' };
    }

    const y = parseInt(v.substring(0, 4), 10);
    const m = parseInt(v.substring(5, 7), 10);
    const 말일 = new Date(y, m, 0).getDate(); // 해당 월 마지막 날

    return {
      시작일: v + '-01',
      종료일: v + '-' + ('0' + 말일).slice(-2)
    };
  }

  if (방식 === '일별') {
    const v = document.getElementById('시술검색_일').value;
    return { 시작일: v, 종료일: v };
  }

  if (방식 === '기간') {
    return {
      시작일: document.getElementById('시술검색_시작일').value,
      종료일: document.getElementById('시술검색_종료일').value
    };
  }

  return { 시작일: '', 종료일: '' }; // 전체
}

}

}


function 시술_목록불러오기(조건) {

  const 상태 = document.getElementById('시술목록_상태');

  if (상태) {
    상태.textContent = '불러오는 중...';
  }

  google.script.run

    .withSuccessHandler(function(목록) {

      시술_원본목록 = 목록 || [];
      시술_테이블렌더();

      if (상태) {
        상태.textContent = 시술_원본목록.length + '건';
      }
    })

    .withFailureHandler(function(error) {

      if (상태) {
        상태.textContent = '조회 실패';
      }

      alert('시술 목록을 불러오지 못했습니다.\n' + (error && error.message ? error.message : error));
    })

    .PROC_getList(현재세션.token, 조건 || { 최대건수: 200 });
}


function 시술_검색() {

  시술_목록불러오기(시술_검색조건());
}


function 시술_검색초기화() {

  document.getElementById('시술검색_기간방식').value = '월별';
  document.getElementById('시술검색_월').value = 시술_오늘문자열().substring(0, 7);
  document.getElementById('시술검색_일').value = '';
  document.getElementById('시술검색_시작일').value = '';
  document.getElementById('시술검색_종료일').value = '';
  document.getElementById('시술검색_환자번호').value = '';
  document.getElementById('시술검색_환자명').value = '';
  document.getElementById('시술검색_구분').value = '';
  document.getElementById('시술검색_취소포함').value = 'false';
  시술_기간방식전환();

  시술_목록불러오기(시술_검색조건());
}


/* ================================================================
   정렬
   ================================================================ */

function 시술_정렬(키) {

  if (시술_정렬상태.키 === 키) {
    시술_정렬상태.방향 = -시술_정렬상태.방향;
  } else {
    시술_정렬상태 = { 키: 키, 방향: 1 };
  }

  /* 머리를 다시 그리면 정렬표시(▲▼)도 함께 갱신된다.
     핸들이 사라지므로 리사이즈 재부착이 필요해 전체 렌더를 쓴다 */
  시술_내역표전체렌더();
}


/* ================================================================
   등록묶음 상세 팝업 (백로그 ①②)

   묶음(환자) 단위 1행에서는 개별 시술이 보이지 않는다.
   행을 클릭하면 그 묶음의 시술 목록을 팝업으로 펼친다.
   메인 금일 시술과 내역 환자별 보기가 같은 팝업을 쓴다
   (화면은 한 번에 하나만 렌더되므로 id 가 겹치지 않는다).
   ★ 읽기 전용이다. 수정·취소는 시술 내역의 '시술별' 보기에서만 한다
   ================================================================ */

function 시술_상세팝업HTML() {

  return `
    <div class="시술덮개 숨김" id="시술금일상세덮개" onclick="시술_금일상세덮개클릭(event)">
      <div class="시술상세카드">
        <div class="시술상세머리">
          <div>
            <h3><span id="시술금일상세제목">시술 상세</span></h3>
            <div class="부제" id="시술금일상세부제"></div>
          </div>
          <button class="시술상세닫기" onclick="시술_금일상세닫기()">&times;</button>
        </div>
        <div class="시술상세본문" id="시술금일상세본문"></div>
        <div class="시술상세발">
          <span class="설명" id="시술금일상세합계"></span>
          <button class="버튼 버튼보조" onclick="시술_금일상세닫기()">닫기</button>
        </div>
      </div>
    </div>
  `;
}


function 시술_금일상세열기(키) {

  const 묶음 = 시술_상세묶음맵[키];

  if (!묶음 || !묶음.행들.length) {
    return;
  }

  const 행들 = 묶음.행들;
  const 첫 = 행들[0];

  document.getElementById('시술금일상세제목').textContent =
    첫.환자명 + ' (' + 첫.환자번호 + ')';

  document.getElementById('시술금일상세부제').textContent =
    첫.시술일 + ' · ' + 첫.시술구분 +
    ' · ' + (첫.내원경로 || '-') + ' / ' + (첫.세부 || '-') + ' / ' + (첫.방문유형 || '-');

  let 합계 = 0;
  행들.forEach(function(r) { 합계 += Number(r.시술금액) || 0; });

  document.getElementById('시술금일상세본문').innerHTML =
    '<table class="시술상세표">' +
      '<thead><tr>' +
        '<th>시술명</th><th>용량</th><th>단위</th>' +
        '<th class="우">금액</th><th>담당실장</th><th>담당원장</th>' +
      '</tr></thead>' +
      '<tbody>' +
        행들.map(function(r) {
          return '<tr>' +
            '<td title="' + 시술_escape(r.시술명) + '">' + 시술_escape(r.시술명) + '</td>' +
            '<td>' + 시술_escape(r.용량) + '</td>' +
            '<td>' + 시술_escape(r.단위) + '</td>' +
            '<td class="우">' + 시술_금액표시(r.시술금액) + '</td>' +
            '<td>' + 시술_escape(r.담당실장) + '</td>' +
            '<td>' + 시술_escape(r.담당원장) + '</td>' +
          '</tr>';
        }).join('') +
      '</tbody>' +
    '</table>' +
    (첫.비고 ? '<div class="시술상세비고">비고: ' + 시술_escape(첫.비고) + '</div>' : '');

  document.getElementById('시술금일상세합계').textContent =
    '시술 ' + 행들.length + '건 · 합계 ' + 시술_금액표시(합계) + '원';

  document.getElementById('시술금일상세덮개').classList.remove('숨김');
}


function 시술_금일상세닫기() {

  const 덮개 = document.getElementById('시술금일상세덮개');

  if (덮개) {
    덮개.classList.add('숨김');
  }
}


function 시술_금일상세덮개클릭(e) {

  if (e && e.target && e.target.id === '시술금일상세덮개') {
    시술_금일상세닫기();
  }
}


/* ESC 로 닫기. 문서 전역 리스너를 한 번만 등록한다
   (페이지 이동으로 화면이 다시 그려져도 중복 등록되지 않게) */
if (!window.시술_상세ESC등록) {

  window.시술_상세ESC등록 = true;

  document.addEventListener('keydown', function(e) {

    if (e.key !== 'Escape') {
      return;
    }

    const 덮개 = document.getElementById('시술금일상세덮개');

    if (덮개 && !덮개.classList.contains('숨김')) {
      시술_금일상세닫기();
    }
  });
}


/* ================================================================
   내역 표 머리 + 컬럼 표시/숨김 (백로그 ④⑤)

   머리(colgroup + thead)를 시술_컬럼 정의에서 만든다.
   ★ 리사이즈 핸들은 넣지 않는다 — script_공통.html 의 표_자동리사이즈적용()이
     주입한다 (3-3). 여기서 넣으면 "전용 구현" 으로 오인돼 자동 적용이 건너뛴다.
   ================================================================ */

/* 현재 보기 방식의 컬럼 목록 */
function 시술_현재컬럼() {

  return 시술_보기방식 === '환자별'
    ? 시술_환자별컬럼
    : 시술_보이는컬럼();
}


function 시술_내역머리렌더() {

  const colgroup = document.getElementById('시술표컬럼');
  const tr = document.getElementById('시술표머리');

  if (!colgroup || !tr) {
    return;
  }

  const 컬럼들 = 시술_현재컬럼();

  colgroup.innerHTML = 컬럼들.map(function(c) {
    return '<col data-key="' + 시술_escape(c.키) + '" style="width:' + c.너비 + 'px">';
  }).join('');

  tr.innerHTML = 컬럼들.map(function(c) {

    const 정렬표시 = 시술_정렬상태.키 === c.키
      ? (시술_정렬상태.방향 === 1 ? ' ▲' : ' ▼')
      : '';

    const 라벨 = c.정렬
      ? '<span class="th_텍스트" onclick="시술_정렬(\'' + 시술_escape(c.키) + '\')">' +
          시술_escape(c.이름) +
          '<span class="정렬표시' + (정렬표시 ? ' 활성' : '') + '" id="시술정렬_' +
          시술_escape(c.키) + '">' + 정렬표시 + '</span></span>'
      : '<span class="th_텍스트">' + 시술_escape(c.이름) + '</span>';

    return '<th>' + 라벨 + '</th>';
  }).join('');
}


function 시술_컬럼설정렌더() {

  const box = document.getElementById('시술컬럼설정');

  if (!box) {
    return;
  }

  const 안내 = document.getElementById('시술내역안내');

  if (안내) {
    안내.style.display = 시술_보기방식 === '환자별' ? '' : 'none';
  }

  /* 환자별 보기는 컬럼 구성이 고정이라 표시/숨김 칩을 감춘다 */
  if (시술_보기방식 === '환자별') {
    box.innerHTML = '';
    box.style.display = 'none';
    return;
  }

  box.style.display = '';

  const 숨김수 = 시술_숨김컬럼.length;

  box.innerHTML =
    '<span class="시술컬럼설정라벨">컬럼 표시' +
      (숨김수 ? ' <span class="시술컬럼숨김수">' + 숨김수 + '개 숨김</span>' : '') +
    '</span>' +
    시술_컬럼.filter(function(c) { return !c.고정; }).map(function(c) {
      const 체크 = 시술_숨김컬럼.indexOf(c.키) === -1 ? ' checked' : '';
      return '<label class="시술컬럼칩">' +
        '<input type="checkbox"' + 체크 +
        ' onchange="시술_컬럼토글(\'' + 시술_escape(c.키) + '\')">' +
        시술_escape(c.이름) + '</label>';
    }).join('') +
    '<span class="시술링크 시술컬럼전체" onclick="시술_컬럼전체표시()">전체 표시</span>';
}


function 시술_컬럼토글(키) {

  const i = 시술_숨김컬럼.indexOf(키);

  if (i === -1) {
    /* 마지막 하나까지 숨기면 표가 사라진다 — 최소 1개는 남긴다 */
    if (시술_보이는컬럼().length <= 1) {
      alert('컬럼을 모두 숨길 수는 없습니다.');
      시술_컬럼설정렌더();
      return;
    }
    시술_숨김컬럼.push(키);
  } else {
    시술_숨김컬럼.splice(i, 1);
  }

  시술_숨김저장();
  시술_내역표전체렌더();
}


function 시술_컬럼전체표시() {

  시술_숨김컬럼 = [];
  시술_숨김저장();
  시술_내역표전체렌더();
}


/* 보기 방식 전환 (백로그 ②) — 시술별 ↔ 환자별 */
function 시술_보기방식전환() {

  const sel = document.getElementById('시술검색_보기방식');

  시술_보기방식 = sel && sel.value === '환자별' ? '환자별' : '시술별';

  try {
    localStorage.setItem(시술_보기저장키, 시술_보기방식);
  } catch (e) { /* 프라이빗 모드 등 — 조용히 무시 */ }

  /* 정렬은 시술별 기준 키라 환자별에서는 의미가 없다. 전환 시 해제 */
  시술_정렬상태 = { 키: '', 방향: 1 };

  시술_내역표전체렌더();
}


function 시술_보기방식불러오기() {

  let v = '시술별';

  try {
    v = localStorage.getItem(시술_보기저장키) || '시술별';
  } catch (e) { /* 무시 */ }

  시술_보기방식 = v === '환자별' ? '환자별' : '시술별';

  const sel = document.getElementById('시술검색_보기방식');

  if (sel) {
    sel.value = 시술_보기방식;
  }
}


/* 머리·본문·설정칩을 다시 그리고 리사이즈를 재부착한다.
   thead 를 교체하면 주입됐던 핸들이 사라지므로 반드시 다시 붙여야 한다 */
function 시술_내역표전체렌더() {

  시술_컬럼설정렌더();
  시술_내역머리렌더();
  시술_테이블렌더();

  if (typeof 표_자동리사이즈적용 === 'function') {
    표_자동리사이즈적용('procedure_history');
  }
}


/* ================================================================
   테이블 렌더 (내역 화면)
   ================================================================ */

/* 환자별 보기 셀 (묶음 집계). 묶음 안에서 값이 갈리면 "첫값 외" 로 표시 */
function 시술_환자별셀(c, 행들) {

  const 첫 = 행들[0];

  if (c.키 === '시술내용') {
    return 시술_escape(행들.length === 1
      ? 첫.시술명
      : 첫.시술명 + ' 외 ' + (행들.length - 1) + '건');
  }

  if (c.키 === '시술수') {
    return String(행들.length);
  }

  if (c.키 === '금액합계') {
    let 합계 = 0;
    행들.forEach(function(r) { 합계 += Number(r.시술금액) || 0; });
    return 시술_금액표시(합계);
  }

  if (c.키 === '상태') {
    const 취소수 = 행들.filter(function(r) { return r.상태 === '취소'; }).length;
    if (취소수 === 0) return 시술_escape(첫.상태);
    if (취소수 === 행들.length) return '<span class="시술취소텍스트">취소</span>';
    return '<span class="시술취소텍스트">일부취소 ' + 취소수 + '</span>';
  }

  return 시술_escape(시술_묶음값(행들, c.키));
}


/* 컬럼 하나의 셀 내용 (시술_컬럼 정의 기준) */
function 시술_셀HTML(c, r, 취소됨) {

  if (c.키 === '시술금액') {
    return 시술_금액표시(r.시술금액);
  }

  if (c.키 === '패키지여부') {
    return r.패키지여부 === 'Y' ? 'Y' : '';
  }

  if (c.키 === '상태') {
    return 취소됨
      ? '<span class="시술취소텍스트">취소</span>'
      : 시술_escape(r.상태);
  }

  if (c.키 === '관리') {
    return '<span class="시술링크" onclick="시술_수정폼열기(\'' + 시술_escape(r.시술ID) + '\')">수정</span>' +
      (취소됨
        ? '<span class="시술링크" onclick="시술_취소처리(\'' + 시술_escape(r.시술ID) + '\', false)">취소해제</span>'
        : '<span class="시술링크" onclick="시술_취소처리(\'' + 시술_escape(r.시술ID) + '\', true)">취소</span>');
  }

  return 시술_escape(r[c.키]);
}


function 시술_테이블렌더() {

  const tbody = document.getElementById('시술표본문');

  if (!tbody) {
    return;
  }

  let 목록 = 시술_원본목록.slice();

  if (시술_정렬상태.키) {

    const 키 = 시술_정렬상태.키;
    const 방향 = 시술_정렬상태.방향;

    목록.sort(function(a, b) {

      const va = 키 === '시술금액' ? Number(a[키]) : String(a[키] || '');
      const vb = 키 === '시술금액' ? Number(b[키]) : String(b[키] || '');

      if (va < vb) return -방향;
      if (va > vb) return 방향;
      return 0;
    });
  }

  const 컬럼들 = 시술_현재컬럼();

  if (목록.length === 0) {
    tbody.innerHTML = '<tr><td colspan="' + 컬럼들.length +
      '"><div class="시술안내">조회된 시술이 없습니다.</div></td></tr>';
    return;
  }

  /* 환자별 보기 — 등록묶음 1건 = 1행 (백로그 ②) */
  if (시술_보기방식 === '환자별') {

    const 묶음결과 = 시술_묶음만들기(목록);

    시술_상세묶음맵 = 묶음결과.맵;

    tbody.innerHTML = 묶음결과.묶음들.map(function(m) {

      return '<tr class="시술금일행" onclick="시술_금일상세열기(\'' +
          시술_escape(m.키) + '\')" title="클릭하면 개별 시술 목록">' +
        컬럼들.map(function(c) {
          const 값 = 시술_환자별셀(c, m.행들);
          return '<td' + (c.우 ? ' class="우"' : '') +
            ' title="' + 시술_escape(값.replace(/<[^>]*>/g, '')) + '">' + 값 + '</td>';
        }).join('') +
      '</tr>';
    }).join('');

    return;
  }

  tbody.innerHTML = 목록.map(function(r) {

    const 취소됨 = r.상태 === '취소';

    return '<tr>' + 컬럼들.map(function(c) {

      const 내용 = 시술_셀HTML(c, r, 취소됨);

      /* 잘릴 수 있는 텍스트 컬럼은 title 로 전체값을 보여준다 */
      const title = (c.키 === '세부' || c.키 === '시술명' || c.키 === '분류')
        ? ' title="' + 시술_escape(r[c.키]) + '"'
        : '';

      return '<td' + (c.우 ? ' class="우"' : '') + title + '>' + 내용 + '</td>';
    }).join('') + '</tr>';
  }).join('');
}

function 시술_수정폼열기(시술ID) {

  const r = 시술_원본목록.find(function(x) { return x.시술ID === 시술ID; });

  if (!r) {
    return;
  }

  document.getElementById('시술수정_시술ID').value = r.시술ID;
  document.getElementById('시술수정_ID표시').textContent =
    r.시술ID + ' (' + r.등록묶음ID + ' / ' + r.시술구분 + ')';
  document.getElementById('시술수정_환자번호').value = r.환자번호;
  document.getElementById('시술수정_환자명').value = r.환자명;
  document.getElementById('시술수정_시술일').value = r.시술일;
  document.getElementById('시술수정_용량').value = r.용량;
  document.getElementById('시술수정_단위').value = r.단위;
  document.getElementById('시술수정_시술금액').value = 금액칸_표시(r.시술금액);

  /* ★ 다회차는 회차 금액을 서버가 정한다 (마지막 회차 나머지 보정 때문).
     PROC_update 가 프론트 금액을 무시하고 기존 금액을 유지하므로,
     열어두면 고쳐도 조용히 반영되지 않아 사용자가 오해한다 → 잠근다 */
  const 금액el = document.getElementById('시술수정_시술금액');
  const 금액안내 = document.getElementById('시술수정_금액안내');
  const 다회차임 = (r.시술구분 === '다회차');

  금액el.readOnly = 다회차임;
  금액el.classList.toggle('읽기전용', 다회차임);
  금액안내.classList.toggle('숨김', !다회차임);
  document.getElementById('시술수정_패키지여부').value = r.패키지여부 === 'Y' ? 'Y' : '';
  document.getElementById('시술수정_비고').value = r.비고;

  // 드롭다운: 기존 값이 목록에 없으면 "(목록없음)"으로 표시 (저장 시 차단)
  시술_셀렉트값설정(document.getElementById('시술수정_시술명'), r.시술명);
  시술_셀렉트값설정(document.getElementById('시술수정_담당실장'), r.담당실장);
  시술_셀렉트값설정(document.getElementById('시술수정_담당원장'), r.담당원장);

  // 내원 정보: 내원경로에 맞춰 세부 옵션을 필터링한 뒤 값 설정
  // (마이그레이션 전 기존 행은 공란 — 수정 저장 시 반드시 선택해야 한다)
  시술_셀렉트값설정(document.getElementById('시술수정_내원경로'), r.내원경로);
  document.getElementById('시술수정_세부').innerHTML = 시술_세부옵션HTML(r.내원경로 || '');
  시술_셀렉트값설정(document.getElementById('시술수정_세부'), r.세부);
  시술_셀렉트값설정(document.getElementById('시술수정_방문유형'), r.방문유형);

  // 분류는 서버 자동 기록값 표시 (기록이 없으면 매핑으로 미리보기)
  const 메타 = 시술_시술명메타[r.시술명];
  document.getElementById('시술수정_분류').value =
    r.분류 || (메타 ? 메타.분류 : '');

  const 폼 = document.getElementById('시술수정폼');
  폼.classList.add('열림');
  폼.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function 시술_수정저장() {

  // 목록없음 값 차단
  const 검사대상 = [
    ['시술명', document.getElementById('시술수정_시술명')],
    ['담당실장', document.getElementById('시술수정_담당실장')],
    ['담당원장', document.getElementById('시술수정_담당원장')],
    ['내원경로', document.getElementById('시술수정_내원경로')],
    ['세부', document.getElementById('시술수정_세부')],
    ['방문유형', document.getElementById('시술수정_방문유형')]
  ];

  for (let i = 0; i < 검사대상.length; i++) {
    const sel = 검사대상[i][1];
    if (시술_목록없음값(sel)) {
      alert(검사대상[i][0] + ' "' + sel.value + '"은(는) 기준정보 목록에 없습니다.\n관리 > 시술/실장/원장 관리에서 먼저 등록하거나 목록에서 선택해주세요.');
      return;
    }
  }

  const data = {
    시술ID: document.getElementById('시술수정_시술ID').value,
    환자번호: document.getElementById('시술수정_환자번호').value.trim(),
    환자명: document.getElementById('시술수정_환자명').value.trim(),
    시술일: document.getElementById('시술수정_시술일').value,
    시술명: document.getElementById('시술수정_시술명').value,
    용량: document.getElementById('시술수정_용량').value.trim(),
    단위: document.getElementById('시술수정_단위').value.trim(),
    시술금액: 금액칸_값(document.getElementById('시술수정_시술금액')),
    패키지여부: document.getElementById('시술수정_패키지여부').value,
    담당원장: document.getElementById('시술수정_담당원장').value,
    담당실장: document.getElementById('시술수정_담당실장').value,
    내원경로: document.getElementById('시술수정_내원경로').value,
    세부: document.getElementById('시술수정_세부').value,
    방문유형: document.getElementById('시술수정_방문유형').value,
    비고: document.getElementById('시술수정_비고').value.trim()
  };

  if (!data.환자번호 || !data.시술명) {
    alert('환자번호와 시술명은 모두 입력해야 합니다.');
    return;
  }

  const 단위오류 = 시술_단위오류(data.시술명, data.단위);

  if (단위오류) {
    alert(단위오류);
    document.getElementById('시술수정_단위').focus();
    return;
  }

  if (!data.내원경로 || !data.세부 || !data.방문유형) {
    alert('내원경로·세부·방문유형은 모두 선택해야 합니다.');
    return;
  }

  if (!data.시술일) {
    alert('시술일을 입력해주세요.');
    return;
  }

  google.script.run

    .withSuccessHandler(function() {

      시술_수정폼닫기();
      시술_목록불러오기(시술_검색조건());
    })

    .withFailureHandler(function(error) {
      alert('수정에 실패했습니다.\n' + (error && error.message ? error.message : error));
    })

    .PROC_update(현재세션.token, data);
}

function 시술_취소처리(시술ID, 취소여부) {

  const 문구 = 취소여부
    ? '이 시술을 취소 처리할까요?\n(기록은 유지되며 목록·집계에서 제외됩니다)'
    : '취소를 해제하고 완료 상태로 되돌릴까요?';

  if (!confirm(문구)) {
    return;
  }

  google.script.run

    .withSuccessHandler(function() {

      시술_목록불러오기(시술_검색조건());
    })

    .withFailureHandler(function(error) {
      alert('처리에 실패했습니다.\n' + (error && error.message ? error.message : error));
    })

    .PROC_취소(현재세션.token, 시술ID, !취소여부 ? false : true);
}

  번호칸.className = '번호칸';
  tr.appendChild(번호칸);

  for (let c = 0; c < 시술_입력열.length; c++) {

    const td = document.createElement('td');
    let el;

    if (시술_셀형태[c] === '패키지') {

      el = document.createElement('select');
      el.innerHTML = '<option value="">해당없음</option><option value="Y">패키지</option>';

    } else if (시술_셀형태[c] === '차감권') {

      /* 차감권(13)은 기준정보가 아니라 15_멤버십 / 16_다회차에서 온다.
         환자번호를 입력해야 목록이 채워지므로 처음에는 안내만 둔다.
         ★ 여기 비교값은 반드시 시술_셀형태[13] 과 같아야 한다.
           안 맞으면 아래 기준정보 분기로 떨어져 시술_기준목록['차감권'] 이
           undefined 라 .map() 에서 터지고 행 추가가 통째로 죽는다 */
      el = document.createElement('select');

      const 구분el0 = document.getElementById('시술등록_구분');
      const 구분0 = 구분el0 ? 구분el0.value : '';

      el.innerHTML = 시술_차감권옵션HTML(구분0, '', '');
      el.disabled = (구분0 !== '멤버십' && 구분0 !== '다회차');

    } else if (c === 4) {

      /* 시술명(4)은 input + datalist — 타이핑 검색 (2026-08-21 사용자 요청).
         목록 강제는 그대로다: change·저장 시 시술_기준값검사 / 시술_목록없음값이
         거르고 서버가 재검증한다. 붙여넣기 값은 시술_셀렉트값설정의 INPUT 분기가 받는다 */
      el = document.createElement('input');
      el.type = 'text';
      el.autocomplete = 'off';
      el.dataset.구분 = '시술명';
      el.setAttribute('list', 시술_시술명목록확보());
      el.addEventListener('paste', 시술_붙여넣기처리);

      el.addEventListener('change', function() {
        시술_기준값검사(this);

        // 시술명 선택 → 단위 자동 반영 (원가표 단위매핑과 동일, 이후 수정 가능)
        const 메타 = 시술_시술명메타[this.value];
        if (메타) {
          시술_행셀들(this.closest('tr'))[6].value = 메타.단위;
        }

        // 다회차 차감권은 시술명 종속 — 시술명이 바뀌면 항상 다시 거른다
        시술_행차감권갱신(this.closest('tr'));
        시술_건수갱신();
      });

    } else if (시술_셀형태[c]) {

      el = document.createElement('select');

      // 세부(11)는 내원경로 종속 — 초기에는 전체 목록
      el.innerHTML = c === 11
        ? 시술_세부옵션HTML('')
        : 시술_옵션HTML(시술_셀형태[c], '선택');

      el.addEventListener('change', function() {
        // 목록에 있는 값으로 바꾸면 오류 표시 제거
        const opt = this.options[this.selectedIndex];
        if (!opt || !opt.dataset.목록없음) {
          this.classList.remove('시술오류칸');
          Array.prototype.slice.call(this.querySelectorAll('option[data-목록없음]'))
            .forEach(function(o) { o.remove(); });
        }

        // 시술명 선택 → 단위 자동 반영 (원가표 단위매핑과 동일, 이후 수정 가능)
        if (Number(this.dataset.col) === 4) {
          const 메타 = 시술_시술명메타[this.value];
          if (메타) {
            const 행셀 = 시술_행셀들(this.closest('tr'));
            행셀[6].value = 메타.단위;
            시술_행차감권갱신(this.closest("tr"));
          }
        }

        // 내원경로 선택 → 같은 행 세부 옵션 필터링
        if (Number(this.dataset.col) === 10) {
          const 행셀 = 시술_행셀들(this.closest('tr'));
          시술_세부필터적용(행셀[11], this.value);
        }

        시술_건수갱신();
      });

    } else {

      el = document.createElement('input');
      el.type = 'text';
      el.addEventListener('paste', 시술_붙여넣기처리);
      el.addEventListener('input', 시술_건수갱신);

      // 시술금액(7)은 입력하는 동안 콤마가 찍히게 한다 (2026-08-21)
      if (c === 7) {
        el.className = '금액칸';
        if (typeof 금액칸_붙이기 === 'function') {
          금액칸_붙이기(el);
        }
      }

      // 환자번호(0)가 바뀌면 그 행의 멤버십 목록을 다시 채운다
      if (c === 0) {
        el.addEventListener('change', function() {
          시술_행차감권갱신(this.closest('tr'));
        });
      }
    }

    el.dataset.col = c;
    td.appendChild(el);
    tr.appendChild(td);
  }

  const 삭제칸 = document.createElement('td');
  const 삭제 = document.createElement('span');

  삭제.className = '행삭제';
  삭제.textContent = '삭제';
  삭제.onclick = function() {
    tr.remove();
    시술_행번호매기기();
    시술_건수갱신();
  };

  삭제칸.appendChild(삭제);
  tr.appendChild(삭제칸);

  tbody.appendChild(tr);
  시술_행번호매기기();

  return tr;
}


function 시술_행번호매기기() {

  document.querySelectorAll('#시술입력표본문 tr').forEach(function(tr, i) {
    tr.querySelector('.번호칸').textContent = i + 1;
  });
}


function 시술_입력표비우기() {

  document.getElementById('시술입력표본문').innerHTML = '';

  for (let i = 0; i < 5; i++) {
    시술_행추가();
  }

  시술_건수갱신();
}


/* 행의 셀 요소들 (입력칸 + 셀렉트, 열 순서대로) */
function 시술_행셀들(tr) {

  return tr.querySelectorAll('input, select');
}


function 시술_건수갱신() {

  let count = 0;

  document.querySelectorAll('#시술입력표본문 tr').forEach(function(tr) {

    const 셀 = 시술_행셀들(tr);

    // 환자번호(0), 시술명(4)이 모두 있는 행만 집계
    if (셀[0].value.trim() && 셀[4].value.trim()) {
      count++;
    }
  });

  const el = document.getElementById('시술등록_건수');

  if (el) {
    el.textContent = '총 ' + count + '건 입력됨 (환자번호·시술명이 모두 있는 행 기준)';
  }
}


/* ================================================================
   붙여넣기 셀 매핑 (원가표 열 구조 자동 인식)

   입력표 열(10): 환자번호 환자명 담당실장 담당원장 시술명 용량 단위 시술금액 비고 패키지여부
   원가표 전체(15): 시술월 시술일 환자번호 환자명 담당실장 담당의 시술명 용량 단위
                    매출금액 매출원가 원가율 비고 패키지여부 분류
   원가표 부분(12~13): 환자번호부터 (매출원가/원가율/분류 포함)

   1번째 칸(환자번호)에 붙여넣을 때만 자동 인식한다.
   ================================================================ */

function 시술_붙여넣기셀매핑(cells, 시작열) {

  if (시작열 !== 0) {
    return cells;
  }

  // 원가표 전체 행 (시술월/시술일 포함, 15열 이상)
  if (cells.length >= 15) {
    return [2, 3, 4, 5, 6, 7, 8, 9, 12, 13].map(function(i) {
      return cells[i] === undefined ? '' : cells[i];
    });
  }

  // 원가표 환자번호부터 (매출원가/원가율 포함, 12~13열)
  if (cells.length >= 12) {
    return [0, 1, 2, 3, 4, 5, 6, 7, 10, 11].map(function(i) {
      return cells[i] === undefined ? '' : cells[i];
    });
  }

  return cells;
}


/* ================================================================
   엑셀 붙여넣기 (Ctrl+V)
   ================================================================ */

function 시술_붙여넣기처리(e) {

  const text = (e.clipboardData || window.clipboardData).getData('text/plain');

  // 탭/줄바꿈 없는 단일 값은 기본 붙여넣기 동작 유지
  if (!text || (text.indexOf('\t') === -1 && text.indexOf('\n') === -1)) {
    return;
  }

  e.preventDefault();

  const 시작행 = e.target.closest('tr');
  const 시작열 = parseInt(e.target.dataset.col, 10);

  let 행들 = text
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n')
    .split('\n');

  if (행들.length && 행들[행들.length - 1] === '') {
    행들.pop();
  }

  // 헤더 행 제외 (입력표 순서 또는 원가표 순서)
  if (행들.length) {
    const 첫칸 = 행들[0].split('\t')[0].trim();
    if (첫칸 === '환자번호' || 첫칸 === '시술월') {
      행들.shift();
    }
  }

  const tbody = document.getElementById('시술입력표본문');
  const 시작인덱스 = Array.prototype.indexOf.call(tbody.querySelectorAll('tr'), 시작행);

  행들.forEach(function(line, r) {

    let 대상행 = tbody.querySelectorAll('tr')[시작인덱스 + r];

    if (!대상행) {
      대상행 = 시술_행추가();
    }

    const 셀 = 시술_행셀들(대상행);
    const cells = 시술_붙여넣기셀매핑(line.split('\t'), 시작열);

    cells.forEach(function(v, c) {

      const 열 = 시작열 + c;

      if (열 < 시술_입력열.length) {
        시술_셀값설정(셀[열], 열, v);
      }
    });
  });

  시술_건수갱신();
}


/* ================================================================
   CSV 업로드
   ================================================================ */

function 시술_CSV선택(fileInput) {

  const file = fileInput.files[0];

  if (!file) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function(ev) {

    const buf = ev.target.result;

    let text = new TextDecoder('utf-8').decode(buf);

    // 깨진 문자가 있으면 엑셀 CP949 저장으로 보고 재디코딩
    if (text.indexOf('�') !== -1) {
      try {
        text = new TextDecoder('euc-kr').decode(buf);
      } catch (e) { /* euc-kr 미지원 환경이면 utf-8 결과 유지 */ }
    }

    // BOM(U+FEFF) 제거 — 남겨두면 첫 컬럼 값이 오염돼 환자번호 매칭이 깨진다
    if (text.charCodeAt(0) === 0xFEFF) {
      text = text.slice(1);
    }

    시술_CSV채우기(text);
    fileInput.value = '';
  };

  reader.readAsArrayBuffer(file);
}


function 시술_CSV파싱(text) {

  const rows = [];
  let row = [];
  let cur = '';
  let inQ = false;

  for (let i = 0; i < text.length; i++) {

    const ch = text[i];

    if (inQ) {

      if (ch === '"') {
        if (text[i + 1] === '"') {
          cur += '"';
          i++;
        } else {
          inQ = false;
        }
      } else {
        cur += ch;
      }

    } else {

      if (ch === '"') {
        inQ = true;
      } else if (ch === ',') {
        row.push(cur);
        cur = '';
      } else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') {
          i++;
        }
        row.push(cur);
        rows.push(row);
        row = [];
        cur = '';
      } else {
        cur += ch;
      }
    }
  }

  if (cur !== '' || row.length) {
    row.push(cur);
    rows.push(row);
  }

  return rows.filter(function(r) {
    return r.some(function(v) { return String(v).trim() !== ''; });
  });
}


function 시술_CSV채우기(text) {

  let rows = 시술_CSV파싱(text);

  if (!rows.length) {
    alert('CSV에서 데이터를 찾지 못했습니다.');
    return;
  }

  /* CSV 첫 줄은 무조건 버린다 (2026-08-20 확정).
     기존 헤더 감지(첫칸 === '환자번호' | '시술월')는 EMR 내보내기처럼 헤더가 다르면
     첫 줄이 데이터로 섞여 들어갔다. 예: picker_encounter_*.csv 는
     '기간,환자번호,환자명,...' 으로 시작한다 */
  rows.shift();

  if (!rows.length) {
    alert('CSV에 데이터 행이 없습니다. (첫 줄은 헤더로 보고 항상 제외합니다)');
    return;
  }

  if (!confirm('현재 입력표 내용을 CSV 데이터 ' + rows.length + '행으로 대체합니다. 진행할까요?')) {
    return;
  }

  const tbody = document.getElementById('시술입력표본문');
  tbody.innerHTML = '';

  rows.forEach(function(r) {

    const tr = 시술_행추가();
    const 셀 = 시술_행셀들(tr);
    const cells = 시술_붙여넣기셀매핑(r, 0);

    for (let c = 0; c < 시술_입력열.length; c++) {
      시술_셀값설정(셀[c], c, cells[c] === undefined ? '' : cells[c]);
    }
  });

  시술_건수갱신();
}


/* ================================================================
   저장 (일괄)
   ================================================================ */

function 시술_저장() {

  const 상태 = document.getElementById('시술등록_상태');
  상태.className = '시술상태';
  상태.textContent = '';

  const 시술일 = document.getElementById('시술등록_시술일').value;
  const 시술구분 = document.getElementById('시술등록_구분').value;

  if (!시술일) {
    상태.className = '시술상태 오류';
    상태.textContent = '시술일을 입력해주세요.';
    return;
  }

  if (시술_구분목록.indexOf(시술구분) === -1) {
    상태.className = '시술상태 오류';
    상태.textContent = '시술구분을 선택해주세요.';
    return;
  }

  const 행목록 = [];
  const 오류들 = [];

  document.querySelectorAll('#시술입력표본문 tr').forEach(function(tr, i) {

    const 셀 = 시술_행셀들(tr);
    const 환자번호 = 셀[0].value.trim();
    const 시술명 = 셀[4].value.trim();

    if (!환자번호 && !시술명) {
      return; // 빈 행
    }

    if (!환자번호 || !시술명) {
      오류들.push((i + 1) + '번 행: 환자번호와 시술명은 모두 입력해야 합니다.');
      return;
    }

    // 목록없음 값 차단 (드롭다운 칸)
    let 목록오류 = false;

    [2, 3, 4, 10, 11, 12].forEach(function(c) {
      const sel = 셀[c];
      if (시술_목록없음값(sel)) {
        오류들.push((i + 1) + '번 행: ' + 시술_입력열[c] + ' "' + sel.value +
          '"은(는) 기준정보 목록에 없습니다. 관리 > 시술/실장/원장 관리에서 먼저 등록해주세요.');
        목록오류 = true;
      }
    });

    if (목록오류) {
      return;
    }

    // 내원경로/세부/방문유형 필수 (서버도 재검증한다)
    if (!셀[10].value || !셀[11].value || !셀[12].value) {
      오류들.push((i + 1) + '번 행: 내원경로·세부·방문유형은 모두 선택해야 합니다.');
      return;
    }

    // 단위는 기준정보와 일치해야 한다 (서버도 재검증한다).
    // 기준정보에 단위 메타가 없는 시술명은 자유 입력 허용
    const 단위오류 = 시술_단위오류(시술명, 셀[6].value);

    if (단위오류) {
      셀[6].classList.add('시술오류칸');
      오류들.push((i + 1) + '번 행: ' + 단위오류);
      return;
    }

    셀[6].classList.remove('시술오류칸');

    /* 구분이 멤버십·다회차면 차감권 선택 필수 (서버도 재검증한다) */
    if ((시술구분 === '멤버십' || 시술구분 === '다회차') && !셀[13].value) {
      셀[13].classList.add('시술오류칸');
      오류들.push((i + 1) + '번 행: 시술구분이 ' + 시술구분 +
        '이면 사용할 ' + 시술구분 + '을(를) 선택해야 합니다. ' +
        (시술구분 === '다회차'
          ? '환자번호와 시술명을 모두 입력해야 목록에 뜹니다 (다회차는 시술 전용).'
          : '환자번호를 입력하면 그 환자의 멤버십이 목록에 뜹니다.'));
      return;
    }

    셀[13].classList.remove('시술오류칸');

    행목록.push({
      환자번호: 환자번호,
      환자명: 셀[1].value.trim(),
      멤버십ID: 시술구분 === '멤버십' ? 셀[13].value : '',
      다회차ID: 시술구분 === '다회차' ? 셀[13].value : '',
      담당실장: 셀[2].value,
      담당원장: 셀[3].value,
      시술명: 시술명,
      용량: 셀[5].value.trim(),
      단위: 셀[6].value.trim(),
      시술금액: 금액칸_값(셀[7]),
      비고: 셀[8].value.trim(),
      패키지여부: 셀[9].value,
      내원경로: 셀[10].value,
      세부: 셀[11].value,
      방문유형: 셀[12].value
    });
  });

  if (오류들.length) {
    상태.className = '시술상태 오류';
    상태.textContent = 오류들.join('\n');
    return;
  }

  if (!행목록.length) {
    상태.className = '시술상태 오류';
    상태.textContent = '저장할 시술 내역이 없습니다.';
    return;
  }

  const 버튼 = document.getElementById('시술등록_저장버튼');
  버튼.disabled = true;
  상태.className = '시술상태 성공';
  상태.textContent = '저장 중...';

  google.script.run

    .withSuccessHandler(function(결과) {

      버튼.disabled = false;
      상태.className = '시술상태 성공';
      상태.textContent =
        결과.저장건수 + '건이 저장되었습니다. (' + 시술구분 + ') 등록묶음ID: ' + 결과.등록묶음ID;

      시술_입력표비우기();
    })

    .withFailureHandler(function(error) {

      버튼.disabled = false;
      상태.className = '시술상태 오류';
      상태.textContent = '저장 실패: ' + (error && error.message ? error.message : error);
    })

    .PROC_saveBatch(
      현재세션.token,
      { 시술일: 시술일, 시술구분: 시술구분 },
      행목록
    );
}
</script>
