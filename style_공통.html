<style>
    /* ================================================================
       기본
       ================================================================ */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    body {
      background: #f7f5fc;
      color: #332b52;
    }

    button,
    input,
    select {
      font-family: inherit;
    }


    /* ================================================================
       로그인 화면
       ================================================================ */

    .인증화면 {
      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f5f2ff;
    }

    .인증카드 {
      width: 420px;

      padding: 42px;

      background: white;

      border: 1px solid #e4dcfb;
      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(60, 45, 100, 0.12);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-main {
      font-size: 25px;
      font-weight: 800;
      color: #332b52;
    }

    .brand-sub {
      margin-top: 6px;

      font-size: 25px;
      font-weight: 800;

      color: #8064d8;
    }

    .인증안내 {
      margin-bottom: 25px;

      text-align: center;

      font-size: 14px;
      line-height: 1.6;

      color: #777;
    }

    .인증필드 {
      margin-bottom: 18px;
    }

    .인증필드 label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }

    .인증필드 select,
    .인증필드 input {

      width: 100%;
      height: 46px;

      padding: 0 13px;

      border: 1px solid #ddd7ee;
      border-radius: 9px;

      background: white;

      font-size: 14px;

      outline: none;
    }

    .인증필드 select:focus,
    .인증필드 input:focus {

      border-color: #8064d8;

      box-shadow:
        0 0 0 3px rgba(128, 100, 216, 0.10);
    }

    .인증로그인버튼 {

      width: 100%;
      height: 48px;

      margin-top: 8px;

      border: 0;
      border-radius: 9px;

      background: #8064d8;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    .인증로그인버튼:hover {
      background: #7053ca;
    }

    .인증로그인버튼:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .오류메시지 {

      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      font-size: 13px;

      color: #d93025;
    }


    /* ================================================================
       앱 전체
       ================================================================ */

    .앱화면 {

      display: none;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: #f7f5fc;
    }



    /* ================================================================
       메인 영역
       ================================================================ */

    .메인영역 {

      flex: 1;

      min-width: 0;
      height: 100vh;

      overflow-y: auto;
    }


    /* ================================================================
       상단바
       ================================================================ */

    .상단바 {

      height: 72px;

      padding: 0 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: white;

      border-bottom: 1px solid #eeeaf5;
    }

    .페이지제목 {

      font-size: 20px;
      font-weight: 800;

      color: #332b52;
    }

    .페이지설명 {

      margin-top: 3px;

      font-size: 12px;

      color: #8b849d;
    }

    .상단사용자 {

      display: flex;
      align-items: center;

      gap: 10px;
    }

    .상단병원 {

      padding: 7px 11px;

      border-radius: 7px;

      background: #f3efff;

      color: #7053ca;

      font-size: 12px;
      font-weight: 700;
    }

    .상단이름 {

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }


    /* ================================================================
       콘텐츠
       ================================================================ */

    .콘텐츠 {

      padding: 30px;
    }


    /* ================================================================
       대시보드 카드
       ================================================================ */

    .카드그리드 {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 16px;

      margin-bottom: 24px;
    }

    .카드 {

      padding: 20px;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 13px;

      box-shadow:
        0 4px 15px rgba(60, 45, 100, 0.04);
    }

    .카드라벨 {

      font-size: 12px;

      color: #8b849d;
    }

    .카드숫자 {

      margin-top: 9px;

      font-size: 26px;
      font-weight: 800;

      color: #40385f;
    }

    .카드설명 {

      margin-top: 6px;

      font-size: 11px;

      color: #a19bad;
    }


    /* ================================================================
       준비 화면
       ================================================================ */

    .준비화면 {

      min-height: 420px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 14px;
    }

    .준비제목 {

      font-size: 20px;
      font-weight: 800;

      color: #40385f;
    }

    .준비설명 {

      margin-top: 8px;

      font-size: 13px;

      color: #8b849d;

      text-align: center;
      line-height: 1.6;
    }



    /* ================================================================
       반응형
       ================================================================ */

    @media (max-width: 1100px) {

      .카드그리드 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 700px) {

      .사이드바 {
        width: 190px;
      }

      .콘텐츠 {
        padding: 20px;
      }

      .상단바 {
        padding: 0 20px;
      }

      .카드그리드 {
        grid-template-columns: 1fr;
      }

    }


    /* ================================================================
       목록 표 공통 — 컬럼 경계선

       표마다 세로선 유무·색이 제각각이었다(거래처·기준정보는 아예 없었다).
       또 헤더(#8b849d)와 본문(#ece6f7)의 색이 달라 같은 컬럼 경계선인데도
       위아래가 끊겨 보였다 (2026-08-20 사용자 지적).

       → 헤더·본문 모두 같은 중간 톤 1px 한 줄로 통일한다.
         컬럼 너비를 잡는 위치가 위에서 아래까지 하나로 이어져 보인다.

       ★ table.목록표 로 특정도를 0-1-3 으로 올린 이유:
         style_시술/관리/품목의 `.시술표 thead th` 등이 0-1-2 이고
         index.html 에서 style_공통 이 먼저 include 되므로, 클래스 하나만으로는
         (같은 0-1-2) 나중에 오는 개별 표 규칙에 덮인다.
       ================================================================ */

    table.목록표 thead th,
    table.목록표 tbody td {
      border-right: 1px solid #ddd7ee;
    }

    table.목록표 thead th:last-child,
    table.목록표 tbody td:last-child {
      border-right: none;
    }


    /* ================================================================
       목록 표 공통 — 헤더 고정 (sticky thead)

       ★ 선택자를 `table.목록표` (0-1-3) 로 쓴 이유:
         각 표의 `.품목표 thead th` 등이 리사이즈 핸들용으로
         `position: relative` 를 지정하는데 그게 0-1-2 라, 클래스 하나만으로는
         (같은 0-1-2) 뒤에 오는 개별 표 규칙에 덮여 sticky 가 죽는다.
         2026-08-20 금일 시술 헤더가 고정되지 않던 원인이 정확히 이것이었다.

       ★ sticky 는 "가장 가까운 스크롤 조상" 기준으로 붙는다.
         표 영역이 스크롤 박스가 아니면(높이 제한이 없으면) 아무 일도 일어나지 않는다.
         그래서 아래에서 표 영역마다 max-height 를 준다.

       th 배경(#f6f2fe)은 각 표 스타일이 이미 불투명하게 지정하고 있어
       스크롤된 본문이 비쳐 보이지 않는다.
       ================================================================ */

    table.목록표 thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      /* 스크롤된 본문과의 경계선. border 대신 inset shadow 라 열 너비에 영향 없음 */
      box-shadow: inset 0 -1px 0 #ddd7ee;
    }


    /* 표 영역을 스크롤 박스로 만든다 (헤더 고정의 전제 조건).

       높이 = 화면 높이에서 상단바·검색바·카드 여백 등을 뺀 값.
       화면이 작을 때 표가 너무 납작해지지 않게 최소 320px 을 보장한다.
       ※ 화면마다 표 위에 오는 요소 높이가 달라 완벽히 딱 맞지는 않는다.
         특정 화면이 어색하면 그 표 영역만 max-height 를 따로 주면 된다.

       제외:
         .시술금일영역  — 380px 로 이미 지정 (메인 카드 안에서 짧게 스크롤)
         .거래처표영역  — calc(100vh - 340px) 로 이미 지정

       ★ 선택자 앞에 `.콘텐츠` 를 붙여 0-2-0 으로 올린 이유:
         index.html 이 style_공통 을 가장 먼저 include 하므로, 클래스 하나(0-1-0)로 쓰면
         나중에 오는 style_품목 / style_관리 의 `.품목표영역 { overflow: hidden }`
         (같은 0-1-0) 이 이겨서 스크롤 박스가 되지 않는다 → 헤더 고정도 죽는다
    */
    .콘텐츠 .품목표영역,
    .콘텐츠 .사용자표영역,
    .콘텐츠 .기준정보표영역,
    .콘텐츠 .시술표영역,
    .콘텐츠 .시술입력표영역 {
      overflow: auto;
      max-height: max(320px, calc(100vh - 300px));
    }

</style>
