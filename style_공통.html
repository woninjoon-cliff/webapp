<style>
    /* ================================================================
       기본
       ================================================================ */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    body {
      background: #f7f5fc;
      color: #332b52;
    }

    button,
    input,
    select {
      font-family: inherit;
    }


    /* ================================================================

       ================================================================ */

    .인증화면 {
      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f5f2ff;
    }

    .인증카드 {
      width: 420px;

      padding: 42px;

      background: white;

      border: 1px solid #e4dcfb;
      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(60, 45, 100, 0.12);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-main {
      font-size: 25px;
      font-weight: 800;
      color: #332b52;
    }

    .brand-sub {
      margin-top: 6px;

      font-size: 25px;
      font-weight: 800;

      color: #8064d8;
    }

    .인증안내 {
      margin-bottom: 25px;

      text-align: center;

      font-size: 14px;
      line-height: 1.6;

      color: #777;
    }

      margin-bottom: 18px;
    }

    .인증필드 label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }

    .인증필드 select,
    .인증필드 input {

      width: 100%;
      height: 46px;

      padding: 0 13px;

      border: 1px solid #ddd7ee;
      border-radius: 9px;

      background: white;

      font-size: 14px;

      outline: none;
    }

    .인증필드 select:focus,
    .인증필드 input:focus {

      border-color: #8064d8;

      box-shadow:
        0 0 0 3px rgba(128, 100, 216, 0.10);
    }

    .인증로그인버튼 {

      width: 100%;
      height: 48px;

      margin-top: 8px;

      border: 0;
      border-radius: 9px;

      background: #8064d8;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    .인증로그인버튼:hover {
      background: #7053ca;
    }

    .인증로그인버튼:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .오류메시지 {

      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      font-size: 13px;

      color: #d93025;
    }

       앱 전체
       ================================================================ */

    .앱화면 {

      display: none;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: #f7f5fc;
    }

       메인 영역
       ================================================================ */

    .메인영역 {

      flex: 1;

      min-width: 0;
      height: 100vh;

      overflow-y: auto;
    }

       상단바

    .상단바 {

      height: 72px;

      display: flex;

      border-bottom: 1px solid #eeeaf5;

      align-items: center;

      color: #7053ca;

      font-size: 12px;
      font-weight: 700;

      font-weight: 700;

      color: #40385f;
    }

      padding: 30px;
    }

       ================================================================ */

    .카드그리드 {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 16px;

      margin-bottom: 24px;
    }

    .카드 {

      padding: 20px;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 13px;

      box-shadow:
        0 4px 15px rgba(60, 45, 100, 0.04);

      font-size: 12px;

      color: #8b849d;
    }

      margin-top: 9px;

      font-size: 26px;
      font-weight: 800;

      color: #40385f;
    }

    .카드설명 {

      margin-top: 6px;

      font-size: 11px;

      color: #a19bad;
    }


    /* ================================================================
       준비 화면
       ================================================================ */

    .준비화면 {

      min-height: 420px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 14px;
    }

    .준비제목 {

      font-size: 20px;
      font-weight: 800;

      color: #40385f;
    }

    .준비설명 {

      margin-top: 8px;

      font-size: 13px;

      color: #8b849d;

      text-align: center;
      line-height: 1.6;
    }



    /* ================================================================
       반응형
       ================================================================ */

    @media (max-width: 1100px) {

      .카드그리드 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 700px) {

      .사이드바 {
        width: 190px;
      }

      .콘텐츠 {
        padding: 20px;
      }

      .상단바 {
        padding: 0 20px;
      }

      .카드그리드 {
        grid-template-columns: 1fr;
      }

    }

</style>
