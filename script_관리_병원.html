<script>

/* ================================================================
   관리 > 병원 관리 — 전역 상태

   주의: script_공통.html에 이미 병원목록불러오기 / 병원명표시 가
   전역으로 존재하므로, 이 파일은 '병원정보_' 접두사를 사용한다.
   ================================================================ */

let 병원정보_현재 = null;


/* ================================================================
   화면
   ================================================================ */

function 병원관리화면() {

  return `

    <div id="병원상태" class="병원상태"></div>


    <div class="병원레이아웃">

    <div class="병원카드">

      <div class="병원카드머리">

        <div class="병원카드제목">병원 정보</div>

        <div class="병원카드버튼">

          <span id="병원보기버튼들">

            <button
              class="버튼 버튼주요 버튼작음"
              onclick="병원정보_수정모드(true)"
            >
              수정
            </button>

            <button
              class="버튼 버튼보조 버튼작음"
              onclick="병원정보_불러오기()"
            >
              새로고침
            </button>

          </span>

          <span id="병원편집버튼들" class="숨김">

            <button
              id="병원저장버튼"
              class="버튼 버튼주요 버튼작음"
              onclick="병원정보_저장()"
            >
              저장
            </button>

            <button
              class="버튼 버튼보조 버튼작음"
              onclick="병원정보_수정모드(false)"
            >
              취소
            </button>

          </span>

        </div>

      </div>


      <div class="병원카드본문">

        <div class="정보줄">
          <div class="정보라벨">병원ID</div>
          <div class="정보값 고정" id="병원_병원ID">-</div>
        </div>

        <div class="정보줄">
          <div class="정보라벨">사용여부</div>
          <div class="정보값 고정">
            <span id="병원_사용여부">-</span>
            <span class="보조문구">변경 불가</span>
          </div>
        </div>

        <div class="정보줄">
          <div class="정보라벨">
            병원명<span class="필수 숨김" id="병원_필수_병원명">*</span>
          </div>
          <div class="정보값">
            <span id="병원보기_병원명">-</span>
            <span id="병원편집_병원명" class="숨김">
              <input
                id="병원입력_병원명"
                type="text"
                maxlength="50"
                autocomplete="off"
              >
            </span>
          </div>
        </div>

        <div class="정보줄">
          <div class="정보라벨">
            병원코드<span class="필수 숨김" id="병원_필수_병원코드">*</span>
          </div>
          <div class="정보값">
            <span id="병원보기_병원코드">-</span>
            <span id="병원편집_병원코드" class="숨김">
              <input
                id="병원입력_병원코드"
                type="text"
                maxlength="10"
                autocomplete="off"
                oninput="병원정보_코드대문자화()"
              >
              <div class="필드안내">
                영문 대문자와 숫자 2~10자. 전체 병원에서 중복될 수 없습니다.
              </div>
            </span>
          </div>
        </div>

        <div class="정보줄">
          <div class="정보라벨">등록일시</div>
          <div class="정보값 고정" id="병원_등록일시">-</div>
        </div>

        <div class="정보줄">
          <div class="정보라벨">수정일시</div>
          <div class="정보값 고정" id="병원_수정일시">-</div>
        </div>

      </div>


      <div class="병원카드꼬리">
        로그인한 병원의 정보만 표시됩니다.
        병원명을 변경하면 로그인 화면의 병원 선택 목록과
        사이드바 병원명도 함께 바뀝니다.
        사용여부와 신규 병원 추가는 스프레드시트에서 관리합니다.
      </div>

    </div>


      <div class="현황열">

        <div class="현황카드">
          <div class="현황라벨">사용자</div>
          <div class="현황숫자" id="현황_사용자">-</div>
          <div class="현황보조" id="현황_사용자_보조">사용 중 기준</div>
        </div>

        <div class="현황카드">
          <div class="현황라벨">금일 매출</div>
          <div class="현황숫자 미연결" id="현황_금일매출">미연결</div>
          <div class="현황보조">시술 기능 구현 후 연결</div>
        </div>

        <div class="현황카드">
          <div class="현황라벨">월 매출</div>
          <div class="현황숫자 미연결" id="현황_월매출">미연결</div>
          <div class="현황보조">시술 기능 구현 후 연결</div>
        </div>

      </div>

    </div>

  `;
}


/* ================================================================
   조회
   ================================================================ */

function 병원정보_불러오기() {

  병원정보_상태표시('', '');

  병원정보_수정모드(false);

  google.script.run

    .withSuccessHandler(function(info) {

      병원정보_현재 = info || null;

      병원정보_화면반영();

    })

    .withFailureHandler(function(error) {

      병원정보_상태표시(
        (error && error.message) || '병원 정보를 불러오지 못했습니다.',
        '오류'
      );

    })

    .HOSPITAL_get(현재세션 ? 현재세션.token : '');

  병원정보_현황불러오기();
}


/* ================================================================
   병원 현황 조회

   실패해도 병원 정보 화면 자체에는 영향을 주지 않는다.
   ================================================================ */

function 병원정보_현황불러오기() {

  google.script.run

    .withSuccessHandler(function(현황) {

      if (!현황) {
        return;
      }

      const set = function(id, 값) {
        const el = document.getElementById(id);
        if (el) { el.textContent = 값; }
      };

      set('현황_사용자', String(현황.사용자_사용중) + '명');
      set('현황_사용자_보조', '전체 ' + 현황.사용자_전체 + '명');

      // 매출은 서버가 산출 근거를 갖게 되면 값을 채운다.
      if (현황.매출연결여부) {

        const 금액 = function(값) {
          const n = Number(값 || 0);
          return (isNaN(n) ? 0 : n).toLocaleString('ko-KR') + '원';
        };

        ['현황_금일매출', '현황_월매출'].forEach(function(id) {
          const el = document.getElementById(id);
          if (el) { el.classList.remove('미연결'); }
        });

        set('현황_금일매출', 금액(현황.금일매출));
        set('현황_월매출', 금액(현황.월매출));
      }

    })

    .withFailureHandler(function() {

      const el = document.getElementById('현황_사용자');
      if (el) { el.textContent = '-'; }

    })

    .HOSPITAL_현황(현재세션 ? 현재세션.token : '');
}


/* ================================================================
   화면 반영
   ================================================================ */

function 병원정보_화면반영() {

  const info = 병원정보_현재;

  if (!info) {
    return;
  }

  const set = function(id, 값) {
    const el = document.getElementById(id);
    if (el) { el.textContent = 값; }
  };

  set('병원_병원ID', String(info.병원ID || '-'));
  set('병원보기_병원명', String(info.병원명 || '-'));
  set('병원보기_병원코드', String(info.병원코드 || '-'));
  set('병원_등록일시', String(info.등록일시 || '-'));
  set('병원_수정일시', String(info.수정일시 || '-'));

  const 사용 = 병원정보_불린(info.사용여부);

  const 사용el = document.getElementById('병원_사용여부');

  if (사용el) {
    사용el.innerHTML = 사용
      ? '사용'
      : '<span class="미사용텍스트">미사용</span>';
  }

  const 병원명입력 = document.getElementById('병원입력_병원명');
  if (병원명입력) { 병원명입력.value = String(info.병원명 || ''); }

  const 코드입력 = document.getElementById('병원입력_병원코드');
  if (코드입력) { 코드입력.value = String(info.병원코드 || ''); }
}


/* ================================================================
   보기 / 편집 전환
   ================================================================ */

function 병원정보_수정모드(켜기) {

  const 토글 = function(id, 숨김) {
    const el = document.getElementById(id);
    if (el) { el.classList.toggle('숨김', 숨김); }
  };

  토글('병원보기_병원명', 켜기);
  토글('병원보기_병원코드', 켜기);

  토글('병원편집_병원명', !켜기);
  토글('병원편집_병원코드', !켜기);
  토글('병원_필수_병원명', !켜기);
  토글('병원_필수_병원코드', !켜기);

  토글('병원보기버튼들', 켜기);
  토글('병원편집버튼들', !켜기);

  if (켜기) {

    // 편집 시작 시 현재 값으로 되돌린다
    if (병원정보_현재) {

      const 병원명입력 = document.getElementById('병원입력_병원명');
      if (병원명입력) {
        병원명입력.value = String(병원정보_현재.병원명 || '');
      }

      const 코드입력 = document.getElementById('병원입력_병원코드');
      if (코드입력) {
        코드입력.value = String(병원정보_현재.병원코드 || '');
      }
    }

    병원정보_상태표시('', '');

    const focusEl = document.getElementById('병원입력_병원명');
    if (focusEl) { focusEl.focus(); }
  }
}


/* ================================================================
   병원코드 입력 자동 대문자화
   ================================================================ */

function 병원정보_코드대문자화() {

  const el = document.getElementById('병원입력_병원코드');

  if (!el) {
    return;
  }

  const 시작 = el.selectionStart;
  const 끝 = el.selectionEnd;

  el.value = el.value.toUpperCase();

  try {
    el.setSelectionRange(시작, 끝);
  } catch (e) {
    // 일부 브라우저에서 실패해도 기능에 영향 없음
  }
}


/* ================================================================
   저장
   ================================================================ */

function 병원정보_저장() {

  const 병원명 =
    (document.getElementById('병원입력_병원명') || {}).value || '';

  const 병원코드 =
    (document.getElementById('병원입력_병원코드') || {}).value || '';

  const 이름 = 병원명.trim();
  const 코드 = 병원코드.trim().toUpperCase();

  if (!이름) {
    병원정보_상태표시('병원명을 입력해주세요.', '오류');
    document.getElementById('병원입력_병원명').focus();
    return;
  }

  if (!코드) {
    병원정보_상태표시('병원코드를 입력해주세요.', '오류');
    document.getElementById('병원입력_병원코드').focus();
    return;
  }

  if (!/^[A-Z0-9]{2,10}$/.test(코드)) {
    병원정보_상태표시(
      '병원코드는 영문 대문자와 숫자 2~10자로 입력해주세요.',
      '오류'
    );
    document.getElementById('병원입력_병원코드').focus();
    return;
  }

  const 저장버튼 = document.getElementById('병원저장버튼');

  저장버튼.disabled = true;
  저장버튼.textContent = '저장 중...';

  google.script.run

    .withSuccessHandler(function(message) {

      저장버튼.disabled = false;
      저장버튼.textContent = '저장';

      병원정보_수정모드(false);

      병원정보_상태표시(
        String(message || '저장되었습니다.'),
        '성공'
      );

      병원정보_저장후갱신();

    })

    .withFailureHandler(function(error) {

      저장버튼.disabled = false;
      저장버튼.textContent = '저장';

      병원정보_상태표시(
        (error && error.message) || '저장에 실패했습니다.',
        '오류'
      );

    })

    .HOSPITAL_save(
      현재세션 ? 현재세션.token : '',
      { 병원명: 이름, 병원코드: 코드 }
    );
}


/* ================================================================
   저장 후 갱신 (사이드바 병원명도 함께 반영)
   ================================================================ */

function 병원정보_저장후갱신() {

  google.script.run

    .withSuccessHandler(function(info) {

      병원정보_현재 = info || null;

      병원정보_화면반영();

      // 사이드바 / 상단바 병원명 갱신
      if (병원정보_현재 && 병원정보_현재.병원명) {

        ['사이드바병원명', '상단병원명'].forEach(function(id) {

          const el = document.getElementById(id);

          if (el) {
            el.textContent = String(병원정보_현재.병원명);
          }
        });
      }

    })

    .withFailureHandler(function(error) {

      병원정보_상태표시(
        (error && error.message) || '갱신에 실패했습니다.',
        '오류'
      );

    })

    .HOSPITAL_get(현재세션 ? 현재세션.token : '');
}


/* ================================================================
   유틸
   ================================================================ */

function 병원정보_상태표시(message, type) {

  const el = document.getElementById('병원상태');

  if (!el) {
    return;
  }

  el.textContent = message || '';

  el.className = '병원상태';

  if (type === '성공') {
    el.classList.add('성공');
  } else if (type === '오류') {
    el.classList.add('오류');
  }
}


function 병원정보_불린(값) {

  if (값 === true) {
    return true;
  }

  if (값 === false) {
    return false;
  }

  const s = String(값 == null ? '' : 값).trim().toLowerCase();

  if (s === 'false' || s === '' || s === '0' || s === '미사용') {
    return false;
  }

  return true;
}

</script>
