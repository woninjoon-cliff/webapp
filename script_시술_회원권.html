<script>
/* =====================================================================
   script_시술_회원권.html — 회원권 잔여 관리 프론트
   대상 페이지: procedure_multi (시술 > 다회차 관리)
   서버: Membership.gs (MEMB_*)  /  15_회원권

   - 판매 1건 = 1행. 잔액은 서버가 05_시술에서 계산해 내려준다(저장하지 않음)
   - 물리 삭제 없음: 상태 '사용중' / '종료'
   - 행 클릭 → 이 회원권으로 차감된 시술 목록 팝업
   - 표 컬럼 너비 조절은 표_자동리사이즈적용()이 자동으로 붙인다 (핸들 넣지 말 것)
   ===================================================================== */


let 회원권_원본목록 = [];

let 회원권_수정중ID = null;


function 회원권_escape(value) {

  return String(value === null || value === undefined ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}


function 회원권_금액(n) {

  return (Number(n) || 0).toLocaleString('ko-KR');
}


/* ================================================================
   화면
   ================================================================ */

function 회원권_화면() {

  return `
    <div class="회원권폼카드">

      <div class="카드제목" id="회원권폼제목">회원권 등록</div>
      <div class="카드설명">
        회원권을 판매하면 여기에 등록합니다. 시술 등록에서 구분을 <strong>회원권</strong>으로
        선택하면 이 목록에서 골라 금액만큼 차감됩니다.
        잔액은 시술 내역에서 자동 계산되므로 따로 관리하지 않아도 됩니다.
      </div>

      <input type="hidden" id="회원권_수정ID">

      <div class="회원권폼줄">

        <div class="필드">
          <label>환자번호 <span class="필수">*</span></label>
          <input type="text" id="회원권_환자번호" style="width:120px">
        </div>

        <div class="필드">
          <label>환자명</label>
          <input type="text" id="회원권_환자명" style="width:110px">
        </div>

        <div class="필드">
          <label>상품명 <span class="필수">*</span></label>
          <input type="text" id="회원권_상품명" placeholder="예: 리쥬란 5회권" style="width:200px">
        </div>

        <div class="필드">
          <label>판매일 <span class="필수">*</span></label>
          <input type="date" id="회원권_판매일">
        </div>

        <div class="필드">
          <label>총액 <span class="필수">*</span></label>
          <input type="text" id="회원권_총액" placeholder="예: 3000000" style="width:120px">
        </div>

        <div class="필드">
          <label>유효기간</label>
          <input type="date" id="회원권_유효기간">
        </div>

        <div class="필드" style="flex:1; min-width:160px">
          <label>비고</label>
          <input type="text" id="회원권_비고">
        </div>

      </div>

      <div class="회원권폼하단">
        <div class="시술상태" id="회원권_상태"></div>
        <div class="버튼들">
          <button class="버튼 버튼보조 숨김" id="회원권_취소버튼" onclick="회원권_폼초기화()">수정 취소</button>
          <button class="버튼 버튼주요" id="회원권_저장버튼" onclick="회원권_저장()">등록</button>
        </div>
      </div>

    </div>


    <div class="시술표카드">

      <div class="시술표카드헤더">
        <div class="제목">회원권 목록</div>
        <div class="우측">
          <label class="회원권종료포함">
            <input type="checkbox" id="회원권_종료포함" onchange="회원권_불러오기()">
            종료 포함
          </label>
          <span id="회원권_요약"></span>
        </div>
      </div>

      <div class="시술표영역">
        <table class="회원권표 목록표" id="회원권표">
          <colgroup>
            <col data-key="회원권ID" style="width:95px">
            <col data-key="환자번호" style="width:95px">
            <col data-key="환자명" style="width:100px">
            <col data-key="상품명">
            <col data-key="판매일" style="width:100px">
            <col data-key="총액" style="width:110px">
            <col data-key="사용액" style="width:110px">
            <col data-key="잔액" style="width:110px">
            <col data-key="유효기간" style="width:100px">
            <col data-key="상태" style="width:80px">
            <col data-key="관리" style="width:120px">
          </colgroup>
          <thead>
            <tr>
              <th>회원권ID</th><th>환자번호</th><th>환자명</th><th>상품명</th>
              <th>판매일</th><th>총액</th><th>사용액</th><th>잔액</th>
              <th>유효기간</th><th>상태</th><th>관리</th>
            </tr>
          </thead>
          <tbody id="회원권표본문">
            <tr><td colspan="11"><div class="시술안내">불러오는 중...</div></td></tr>
          </tbody>
        </table>
      </div>

      <div class="시술도구안내" style="margin-top:10px; margin-bottom:0;">
        행을 클릭하면 이 회원권으로 차감된 시술 목록을 볼 수 있습니다.
        잔액은 시술 취소 시 자동으로 복구됩니다.
      </div>

    </div>

    ` + 시술_상세팝업HTML() + `
  `;
}


/* ================================================================
   초기화 / 조회
   ================================================================ */

function 회원권_초기화() {

  회원권_수정중ID = null;
  document.getElementById('회원권_판매일').value = 시술_오늘문자열();
  회원권_불러오기();
}


function 회원권_불러오기() {

  const tbody = document.getElementById('회원권표본문');

  if (!tbody) {
    return;
  }

  const 종료포함 =
    (document.getElementById('회원권_종료포함') || {}).checked === true;

  google.script.run

    .withSuccessHandler(function(목록) {

      회원권_원본목록 = 목록 || [];
      회원권_표렌더();
    })

    .withFailureHandler(function(error) {

      tbody.innerHTML =
        '<tr><td colspan="11"><div class="시술안내">조회 실패</div></td></tr>';

      console.error('회원권 조회 실패', error);
      회원권_상태표시('불러오지 못했습니다: ' +
        (error && error.message ? error.message : error), true);
    })

    .MEMB_getList(현재세션.token, { 종료포함: 종료포함 });
}


function 회원권_표렌더() {

  const tbody = document.getElementById('회원권표본문');

  if (!tbody) {
    return;
  }

  const 요약 = document.getElementById('회원권_요약');

  if (요약) {

    let 총 = 0, 잔 = 0;

    회원권_원본목록.forEach(function(m) {
      총 += m.총액;
      잔 += m.잔액;
    });

    요약.textContent =
      회원권_원본목록.length + '건 · 총액 ' + 회원권_금액(총) +
      '원 · 잔액 ' + 회원권_금액(잔) + '원';
  }

  if (회원권_원본목록.length === 0) {
    tbody.innerHTML =
      '<tr><td colspan="11"><div class="시술안내">등록된 회원권이 없습니다.</div></td></tr>';
    return;
  }

  tbody.innerHTML = 회원권_원본목록.map(function(m) {

    /* 상태 표시: 종료 > 만료 > 소진 > 사용중 순으로 판단 */
    let 상태칸;

    if (m.상태 === '종료') {
      상태칸 = '<span class="회원권종료">종료</span>';
    } else if (m.만료됨) {
      상태칸 = '<span class="회원권만료">만료</span>';
    } else if (m.잔액 <= 0) {
      상태칸 = '<span class="회원권소진">소진</span>';
    } else {
      상태칸 = '사용중';
    }

    const 잔액클래스 = m.잔액 <= 0 ? ' 회원권잔액없음' : '';

    return '<tr class="회원권행" onclick="회원권_상세열기(\'' +
        회원권_escape(m.회원권ID) + '\')" title="클릭하면 사용 내역">' +
      '<td>' + 회원권_escape(m.회원권ID) + '</td>' +
      '<td>' + 회원권_escape(m.환자번호) + '</td>' +
      '<td>' + 회원권_escape(m.환자명) + '</td>' +
      '<td title="' + 회원권_escape(m.상품명) + '">' + 회원권_escape(m.상품명) + '</td>' +
      '<td>' + 회원권_escape(m.판매일) + '</td>' +
      '<td class="우">' + 회원권_금액(m.총액) + '</td>' +
      '<td class="우">' + 회원권_금액(m.사용액) + '</td>' +
      '<td class="우' + 잔액클래스 + '">' + 회원권_금액(m.잔액) + '</td>' +
      '<td>' + 회원권_escape(m.유효기간) + '</td>' +
      '<td>' + 상태칸 + '</td>' +
      /* 관리 칸은 행 클릭(상세)과 겹치지 않게 이벤트 전파를 막는다 */
      '<td onclick="event.stopPropagation()">' +
        '<span class="시술링크" onclick="회원권_수정폼열기(\'' +
          회원권_escape(m.회원권ID) + '\')">수정</span>' +
        (m.상태 === '종료'
          ? '<span class="시술링크" onclick="회원권_상태변경(\'' +
              회원권_escape(m.회원권ID) + '\', \'사용중\')">사용재개</span>'
          : '<span class="시술링크" onclick="회원권_상태변경(\'' +
              회원권_escape(m.회원권ID) + '\', \'종료\')">종료</span>') +
      '</td>' +
    '</tr>';
  }).join('');
}


function 회원권_상태표시(문구, 오류) {

  const el = document.getElementById('회원권_상태');

  if (!el) {
    return;
  }

  el.className = '시술상태 ' + (오류 ? '오류' : '성공');
  el.textContent = 문구;
}


/* ================================================================
   등록 / 수정
   ================================================================ */

function 회원권_폼초기화() {

  회원권_수정중ID = null;

  document.getElementById('회원권_수정ID').value = '';
  document.getElementById('회원권_환자번호').value = '';
  document.getElementById('회원권_환자명').value = '';
  document.getElementById('회원권_상품명').value = '';
  document.getElementById('회원권_판매일').value = 시술_오늘문자열();
  document.getElementById('회원권_총액').value = '';
  document.getElementById('회원권_유효기간').value = '';
  document.getElementById('회원권_비고').value = '';

  document.getElementById('회원권폼제목').textContent = '회원권 등록';
  document.getElementById('회원권_저장버튼').textContent = '등록';
  document.getElementById('회원권_취소버튼').classList.add('숨김');

  회원권_상태표시('');
}


function 회원권_수정폼열기(회원권ID) {

  const m = 회원권_원본목록.filter(function(x) {
    return x.회원권ID === 회원권ID;
  })[0];

  if (!m) {
    return;
  }

  회원권_수정중ID = 회원권ID;

  document.getElementById('회원권_수정ID').value = 회원권ID;
  document.getElementById('회원권_환자번호').value = m.환자번호;
  document.getElementById('회원권_환자명').value = m.환자명;
  document.getElementById('회원권_상품명').value = m.상품명;
  document.getElementById('회원권_판매일').value = m.판매일;
  document.getElementById('회원권_총액').value = m.총액;
  document.getElementById('회원권_유효기간').value = m.유효기간;
  document.getElementById('회원권_비고').value = m.비고;

  document.getElementById('회원권폼제목').textContent =
    '회원권 수정 — ' + 회원권ID;
  document.getElementById('회원권_저장버튼').textContent = '저장';
  document.getElementById('회원권_취소버튼').classList.remove('숨김');

  회원권_상태표시(
    '이미 ' + 회원권_금액(m.사용액) + '원 사용했습니다. 총액을 그보다 작게 줄일 수 없습니다.'
  );

  document.querySelector('.회원권폼카드')
    .scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}


function 회원권_저장() {

  const data = {
    환자번호: document.getElementById('회원권_환자번호').value.trim(),
    환자명: document.getElementById('회원권_환자명').value.trim(),
    상품명: document.getElementById('회원권_상품명').value.trim(),
    판매일: document.getElementById('회원권_판매일').value,
    총액: document.getElementById('회원권_총액').value,
    유효기간: document.getElementById('회원권_유효기간').value,
    비고: document.getElementById('회원권_비고').value.trim()
  };

  if (!data.환자번호 || !data.상품명 || !data.판매일 || !data.총액) {
    회원권_상태표시('환자번호·상품명·판매일·총액은 모두 입력해야 합니다.', true);
    return;
  }

  const 수정 = !!회원권_수정중ID;

  if (수정) {
    data.회원권ID = 회원권_수정중ID;
  }

  const 성공 = function() {
    회원권_폼초기화();
    회원권_상태표시(수정 ? '수정되었습니다.' : '등록되었습니다.');
    회원권_불러오기();
  };

  const 실패 = function(error) {
    회원권_상태표시(
      (수정 ? '수정 실패: ' : '등록 실패: ') +
      (error && error.message ? error.message : error), true);
  };

  if (수정) {
    google.script.run.withSuccessHandler(성공).withFailureHandler(실패)
      .MEMB_update(현재세션.token, data);
  } else {
    google.script.run.withSuccessHandler(성공).withFailureHandler(실패)
      .MEMB_add(현재세션.token, data);
  }
}


function 회원권_상태변경(회원권ID, 상태) {

  const 문구 = 상태 === '종료'
    ? '이 회원권을 종료할까요?\n목록에서 빠지고 시술 등록에서 선택할 수 없게 됩니다.\n과거 사용 기록은 그대로 유지됩니다.'
    : '이 회원권을 다시 사용할까요?';

  if (!confirm(문구)) {
    return;
  }

  google.script.run

    .withSuccessHandler(function() {
      회원권_상태표시(상태 === '종료' ? '종료되었습니다.' : '사용재개되었습니다.');
      회원권_불러오기();
    })

    .withFailureHandler(function(error) {
      회원권_상태표시('처리 실패: ' +
        (error && error.message ? error.message : error), true);
    })

    .MEMB_상태변경(현재세션.token, 회원권ID, 상태);
}


/* ================================================================
   사용 내역 팝업 (시술 상세 팝업 재사용)
   ================================================================ */

function 회원권_상세열기(회원권ID) {

  const m = 회원권_원본목록.filter(function(x) {
    return x.회원권ID === 회원권ID;
  })[0];

  if (!m) {
    return;
  }

  document.getElementById('시술금일상세제목').textContent =
    m.환자명 + ' (' + m.환자번호 + ') — ' + m.상품명;

  document.getElementById('시술금일상세부제').textContent =
    '판매 ' + m.판매일 +
    (m.유효기간 ? ' · 유효기간 ' + m.유효기간 : '') +
    ' · 총액 ' + 회원권_금액(m.총액) + '원';

  document.getElementById('시술금일상세합계').textContent =
    '사용 ' + 회원권_금액(m.사용액) + '원 · 잔액 ' + 회원권_금액(m.잔액) + '원';

  const 본문 = document.getElementById('시술금일상세본문');
  본문.innerHTML = '<div class="시술안내">불러오는 중...</div>';

  document.getElementById('시술금일상세덮개').classList.remove('숨김');

  google.script.run

    .withSuccessHandler(function(내역) {

      내역 = 내역 || [];

      if (내역.length === 0) {
        본문.innerHTML =
          '<div class="시술안내">아직 이 회원권으로 차감된 시술이 없습니다.</div>';
        return;
      }

      본문.innerHTML =
        '<table class="시술상세표">' +
          '<thead><tr>' +
            '<th>시술일</th><th>시술명</th><th>용량</th><th>단위</th>' +
            '<th class="우">차감액</th><th>상태</th>' +
          '</tr></thead>' +
          '<tbody>' +
            내역.map(function(r) {

              const 취소됨 = r.상태 === '취소';

              return '<tr' + (취소됨 ? ' class="회원권취소행"' : '') + '>' +
                '<td>' + 회원권_escape(r.시술일) + '</td>' +
                '<td title="' + 회원권_escape(r.시술명) + '">' +
                  회원권_escape(r.시술명) + '</td>' +
                '<td>' + 회원권_escape(r.용량) + '</td>' +
                '<td>' + 회원권_escape(r.단위) + '</td>' +
                /* 취소 건은 차감에서 빠지므로 0으로 보이게 표시한다 */
                '<td class="우">' +
                  (취소됨
                    ? '<span class="시술취소텍스트">차감 없음</span>'
                    : 회원권_금액(r.시술금액)) +
                '</td>' +
                '<td>' + (취소됨
                  ? '<span class="시술취소텍스트">취소</span>'
                  : 회원권_escape(r.상태)) + '</td>' +
              '</tr>';
            }).join('') +
          '</tbody>' +
        '</table>';
    })

    .withFailureHandler(function(error) {
      본문.innerHTML = '<div class="시술안내">사용 내역을 불러오지 못했습니다.</div>';
      console.error('회원권 사용내역 조회 실패', error);
    })

    .MEMB_사용내역(현재세션.token, 회원권ID);
}
</script>
