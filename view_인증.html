<!-- ================================================================
       로그인
       ================================================================ -->

  <div
    id="인증화면"
    class="인증화면"
  >

    <div class="인증카드">

      <div class="brand">

        <div class="brand-main">
          VIVICELLLAB
        </div>

        <div class="brand-sub">
          ERP
        </div>

      </div>


      <div class="인증안내">

        사용할 병원을 선택한 후<br>
        아이디와 비밀번호로 로그인해주세요.

      </div>


      <div class="인증필드">

        <label>
          병원
        </label>

        <select id="로그인병원">

          <option value="">
            병원 목록을 불러오는 중...
          </option>

        </select>

      </div>


      <div class="인증필드">

        <label>
          아이디
        </label>

        <input
          id="로그인아이디"
          type="text"
          autocomplete="username"
          placeholder="아이디를 입력하세요"
        >

      </div>


      <div class="인증필드">

        <label>
          비밀번호
        </label>

        <input
          id="로그인비밀번호"
          type="password"
          autocomplete="current-password"
          placeholder="비밀번호를 입력하세요"
        >

      </div>


      <button
        id="로그인버튼"
        class="인증로그인버튼"
        onclick="로그인()"
      >
        로그인
      </button>


      <div
        id="오류메시지"
        class="오류메시지"
      ></div>

    </div>

  </div>
