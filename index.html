<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <title>VIVICELL LAB</title>

  <style>

    /* ================================================================
       기본
       ================================================================ */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    body {
      background: #f7f5fc;
      color: #332b52;
    }

    button,
    input,
    select {
      font-family: inherit;
    }


    /* ================================================================
       로그인 화면
       ================================================================ */

    .인증화면 {
      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f5f2ff;
    }

    .인증카드 {
      width: 420px;

      padding: 42px;

      background: white;

      border: 1px solid #e4dcfb;
      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(60, 45, 100, 0.12);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-main {
      font-size: 25px;
      font-weight: 800;
      color: #332b52;
    }

    .brand-sub {
      margin-top: 6px;

      font-size: 25px;
      font-weight: 800;

      color: #8064d8;
    }

    .인증안내 {
      margin-bottom: 25px;

      text-align: center;

      font-size: 14px;
      line-height: 1.6;

      color: #777;
    }

    .인증필드 {
      margin-bottom: 18px;
    }

    .인증필드 label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }

    .인증필드 select,
    .인증필드 input {

      width: 100%;
      height: 46px;

      padding: 0 13px;

      border: 1px solid #ddd7ee;
      border-radius: 9px;

      background: white;

      font-size: 14px;

      outline: none;
    }

    .인증필드 select:focus,
    .인증필드 input:focus {

      border-color: #8064d8;

      box-shadow:
        0 0 0 3px rgba(128, 100, 216, 0.10);
    }

    .인증로그인버튼 {

      width: 100%;
      height: 48px;

      margin-top: 8px;

      border: 0;
      border-radius: 9px;

      background: #8064d8;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    .인증로그인버튼:hover {
      background: #7053ca;
    }

    .인증로그인버튼:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .오류메시지 {

      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      font-size: 13px;

      color: #d93025;
    }


    /* ================================================================
       앱 전체
       ================================================================ */

    .앱화면 {

      display: none;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: #f7f5fc;
    }


    /* ================================================================
       사이드바
       ================================================================ */

    .사이드바 {

      width: 230px;
      height: 100vh;

      flex-shrink: 0;

      display: flex;
      flex-direction: column;

      background: #f3efff;

      border-right: 1px solid #e4dcfb;
    }

    .사이드바브랜드 {

      padding: 24px 20px 20px;

      border-bottom: 1px solid #e4dcfb;
    }

    .사이드바브랜드 .main {

      font-size: 20px;
      font-weight: 800;

      color: #332b52;
    }

    .사이드바브랜드 .sub {

      margin-top: 4px;

      font-size: 12px;
      font-weight: 600;

      color: #8064d8;
    }


    /* ================================================================
       병원 정보
       ================================================================ */

    .사이드바병원 {

      margin: 16px 14px;

      padding: 12px 13px;

      border-radius: 10px;

      background: rgba(128, 100, 216, 0.08);
    }

    .사이드바병원 .label {

      margin-bottom: 5px;

      font-size: 11px;

      color: #8b849d;
    }

    .사이드바병원 .name {

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }


    /* ================================================================
       메뉴
       ================================================================ */

    .메뉴영역 {

      flex: 1;

      padding: 4px 10px;

      overflow-y: auto;
    }

    .메뉴버튼 {

      width: 100%;

      height: 44px;

      margin-bottom: 4px;

      padding: 0 16px;

      display: flex;
      align-items: center;

      border: 0;
      border-radius: 9px;

      background: transparent;

      color: #5d5673;

      font-size: 14px;
      font-weight: 600;

      text-align: left;

      cursor: pointer;
    }

    .메뉴버튼:hover {

      background: #e9e2fb;

      color: #40385f;
    }

    .메뉴버튼.active {

      background: #8064d8;

      color: white;

      box-shadow:
        0 5px 12px rgba(128, 100, 216, 0.20);
    }


    /* ================================================================
       사이드바 하단
       ================================================================ */

    .사이드바하단 {

      padding: 14px;

      border-top: 1px solid #e4dcfb;
    }

    .사용자정보 {

      margin-bottom: 10px;

      padding: 10px 11px;

      border-radius: 9px;

      background: white;
    }

    .사용자정보 .name {

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }

    .사용자정보 .role {

      margin-top: 3px;

      font-size: 11px;

      color: #8b849d;
    }

    .로그아웃버튼 {

      width: 100%;
      height: 38px;

      border: 1px solid #ddd7ee;
      border-radius: 8px;

      background: white;

      color: #665f78;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;
    }

    .로그아웃버튼:hover {

      background: #f8f6fc;

      border-color: #cfc5e8;
    }


    /* ================================================================
       메인 영역
       ================================================================ */

    .메인영역 {

      flex: 1;

      min-width: 0;
      height: 100vh;

      overflow-y: auto;
    }


    /* ================================================================
       상단바
       ================================================================ */

    .상단바 {

      height: 72px;

      padding: 0 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: white;

      border-bottom: 1px solid #eeeaf5;
    }

    .페이지제목 {

      font-size: 20px;
      font-weight: 800;

      color: #332b52;
    }

    .페이지설명 {

      margin-top: 3px;

      font-size: 12px;

      color: #8b849d;
    }

    .상단사용자 {

      display: flex;
      align-items: center;

      gap: 10px;
    }

    .상단병원 {

      padding: 7px 11px;

      border-radius: 7px;

      background: #f3efff;

      color: #7053ca;

      font-size: 12px;
      font-weight: 700;
    }

    .상단이름 {

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }


    /* ================================================================
       콘텐츠
       ================================================================ */

    .콘텐츠 {

      padding: 30px;
    }


    /* ================================================================
       대시보드 카드
       ================================================================ */

    .카드그리드 {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 16px;

      margin-bottom: 24px;
    }

    .카드 {

      padding: 20px;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 13px;

      box-shadow:
        0 4px 15px rgba(60, 45, 100, 0.04);
    }

    .카드라벨 {

      font-size: 12px;

      color: #8b849d;
    }

    .카드숫자 {

      margin-top: 9px;

      font-size: 26px;
      font-weight: 800;

      color: #40385f;
    }

    .카드설명 {

      margin-top: 6px;

      font-size: 11px;

      color: #a19bad;
    }


    /* ================================================================
       준비 화면
       ================================================================ */

    .준비화면 {

      min-height: 420px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 14px;
    }

    .준비제목 {

      font-size: 20px;
      font-weight: 800;

      color: #40385f;
    }

    .준비설명 {

      margin-top: 8px;

      font-size: 13px;

      color: #8b849d;

      text-align: center;
      line-height: 1.6;
    }


    /* ================================================================
       품목 관리
       ================================================================ */

    .품목상단바 {

      display: flex;
      justify-content: flex-end;

      gap: 10px;

      margin-bottom: 14px;
    }

    .품목툴바 {

      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 18px;

      padding: 16px 18px;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 13px;
    }

    .품목툴바 .필드 {

      display: flex;
      flex-direction: column;

      gap: 5px;
    }

    .품목툴바 .필드 label {

      font-size: 11px;
      font-weight: 700;

      color: #8b849d;
    }

    .품목툴바 input,
    .품목툴바 select {

      height: 40px;

      padding: 0 11px;

      border: 1px solid #ddd7ee;
      border-radius: 8px;

      background: white;

      font-size: 13px;

      outline: none;
    }

    .품목툴바 input:focus,
    .품목툴바 select:focus {

      border-color: #8064d8;
    }

    .품목툴바 .툴바여백 {
      flex: 1;
    }

    .버튼 {

      height: 40px;

      padding: 0 16px;

      border: 0;
      border-radius: 8px;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }

    .버튼주요 {
      background: #8064d8;
      color: white;
    }

    .버튼주요:hover {
      background: #7053ca;
    }

    .버튼보조 {
      background: #f0ecfa;
      color: #6a5fa0;
    }

    .버튼보조:hover {
      background: #e6dffa;
    }

    .버튼삭제 {
      background: #fbe8e8;
      color: #c23b3b;
    }

    .버튼삭제:hover {
      background: #f7dada;
    }

    .버튼작음 {

      height: 32px;

      padding: 0 12px;

      font-size: 12px;

      border-radius: 7px;
    }


    /* ================================================================
       품목 등록/수정 폼
       ================================================================ */

    .품목폼 {

      display: none;

      margin-bottom: 18px;

      padding: 20px;

      background: white;

      border: 1px solid #e4dcfb;
      border-radius: 13px;
    }

    .품목폼.열림 {
      display: block;
    }

    .품목폼제목 {

      margin-bottom: 16px;

      font-size: 15px;
      font-weight: 800;

      color: #40385f;
    }

    .품목폼그리드 {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 14px;
    }

    @media (max-width: 900px) {
      .품목폼그리드 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .품목폼그리드 {
        grid-template-columns: 1fr;
      }
    }

    .품목폼필드 {

      display: flex;
      flex-direction: column;

      gap: 6px;
    }

    .품목폼필드 label {

      font-size: 12px;
      font-weight: 700;

      color: #40385f;
    }

    .품목폼필드 label .필수 {
      color: #d93025;
    }

    .품목폼필드 input {

      height: 42px;

      padding: 0 12px;

      border: 1px solid #ddd7ee;
      border-radius: 8px;

      font-size: 13px;

      outline: none;
    }

    .품목폼필드 input:focus {
      border-color: #8064d8;
    }

    .품목폼체크 {

      display: flex;
      align-items: center;

      gap: 8px;

      height: 42px;
    }

    .품목폼체크 input {

      width: 18px;
      height: 18px;
    }

    .품목폼하단 {

      display: flex;

      gap: 10px;

      margin-top: 18px;
    }


    /* ================================================================
       품목 테이블
       ================================================================ */

    .품목표영역 {

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 13px;

      overflow: hidden;
    }

    .품목표 {

      width: 100%;

      border-collapse: collapse;

      font-size: 13px;
    }

    .품목표 thead th {

      padding: 13px 14px;

      background: #f6f2fe;

      color: #5b5480;

      font-size: 12px;
      font-weight: 800;

      text-align: left;

      border-bottom: 1px solid #eeeaf5;

      white-space: nowrap;
    }

    .품목표 tbody td {

      padding: 12px 14px;

      border-bottom: 1px solid #f4f1fb;

      color: #40385f;

      vertical-align: middle;
    }

    .품목표 tbody tr:last-child td {
      border-bottom: 0;
    }

    .품목표 tbody tr:hover {
      background: #faf8fe;
    }

    .품목표 .우 {
      text-align: right;
    }

    .품목표 .가운데 {
      text-align: center;
    }

    .사용뱃지 {

      display: inline-block;

      padding: 3px 10px;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 800;
    }

    .사용뱃지.사용 {
      background: #e5f4ec;
      color: #1f8a54;
    }

    .사용뱃지.미사용 {
      background: #f0eef3;
      color: #9a93a8;
    }

    .품목행버튼 {

      display: inline-flex;
      gap: 6px;
    }

    .품목안내 {

      padding: 50px 20px;

      text-align: center;

      color: #a19bad;

      font-size: 13px;
    }

    .품목상태 {

      min-height: 20px;

      margin-bottom: 12px;

      font-size: 13px;
      font-weight: 600;
    }

    .품목상태.성공 {
      color: #1f8a54;
    }

    .품목상태.오류 {
      color: #d93025;
    }


    /* ================================================================
       반응형
       ================================================================ */

    @media (max-width: 1100px) {

      .카드그리드 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 700px) {

      .사이드바 {
        width: 190px;
      }

      .콘텐츠 {
        padding: 20px;
      }

      .상단바 {
        padding: 0 20px;
      }

      .카드그리드 {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>


  <!-- ================================================================
       로그인
       ================================================================ -->

  <div
    id="인증화면"
    class="인증화면"
  >

    <div class="인증카드">

      <div class="brand">

        <div class="brand-main">
          VIVICELLLAB
        </div>

        <div class="brand-sub">
          ERP
        </div>

      </div>


      <div class="인증안내">

        사용할 병원을 선택한 후<br>
        아이디와 비밀번호로 로그인해주세요.

      </div>


      <div class="인증필드">

        <label>
          병원
        </label>

        <select id="로그인병원">

          <option value="">
            병원 목록을 불러오는 중...
          </option>

        </select>

      </div>


      <div class="인증필드">

        <label>
          아이디
        </label>

        <input
          id="로그인아이디"
          type="text"
          autocomplete="username"
          placeholder="아이디를 입력하세요"
        >

      </div>


      <div class="인증필드">

        <label>
          비밀번호
        </label>

        <input
          id="로그인비밀번호"
          type="password"
          autocomplete="current-password"
          placeholder="비밀번호를 입력하세요"
        >

      </div>


      <button
        id="로그인버튼"
        class="인증로그인버튼"
        onclick="로그인()"
      >
        로그인
      </button>


      <div
        id="오류메시지"
        class="오류메시지"
      ></div>

    </div>

  </div>



  <!-- ================================================================
       실제 앱
       ================================================================ -->

  <div
    id="앱화면"
    class="앱화면"
  >


    <!-- ==============================================================
         사이드바
         ============================================================== -->

    <aside class="사이드바">


      <div class="사이드바브랜드">

        <div class="main">
          VIVICELLLAB
        </div>

        <div class="sub">
          ERP
        </div>

      </div>


      <div class="사이드바병원">

        <div class="label">
          현재 병원
        </div>

        <div
          id="사이드바병원명"
          class="name"
        >
          -
        </div>

      </div>


      <div class="메뉴영역">


        <button
          class="메뉴버튼 active"
          data-page="dashboard"
          onclick="페이지이동('dashboard')"
        >
          대시보드
        </button>


        <button
          class="메뉴버튼"
          data-page="procedure"
          onclick="페이지이동('procedure')"
        >
          시술 관리
        </button>


        <button
          class="메뉴버튼"
          data-page="purchase"
          onclick="페이지이동('purchase')"
        >
          구매 관리
        </button>


        <button
          class="메뉴버튼"
          data-page="inventory"
          onclick="페이지이동('inventory')"
        >
          재고 관리
        </button>


        <button
          class="메뉴버튼"
          data-page="item"
          onclick="페이지이동('item')"
        >
          품목 관리
        </button>


        <button
          class="메뉴버튼"
          data-page="statistics"
          onclick="페이지이동('statistics')"
        >
          통계
        </button>


        <button
          class="메뉴버튼"
          data-page="settings"
          onclick="페이지이동('settings')"
        >
          설정
        </button>


      </div>


      <div class="사이드바하단">


        <div class="사용자정보">

          <div
            id="사이드바사용자명"
            class="name"
          >
            -
          </div>

          <div
            id="사이드바사용자권한"
            class="role"
          >
            -
          </div>

        </div>


        <button
          class="로그아웃버튼"
          onclick="로그아웃()"
        >
          로그아웃
        </button>


      </div>


    </aside>



    <!-- ==============================================================
         메인
         ============================================================== -->

    <main class="메인영역">


      <header class="상단바">


        <div>

          <div
            id="페이지제목"
            class="페이지제목"
          >
            대시보드
          </div>

          <div
            id="페이지설명"
            class="페이지설명"
          >
            통합관리 시스템 현황
          </div>

        </div>


        <div class="상단사용자">

          <div
            id="상단병원명"
            class="상단병원"
          >
            -
          </div>

          <div
            id="상단사용자명"
            class="상단이름"
          >
            -

<script>

  /* ================================================================

  /* ================================================================

    google.script.run

        function(hospitals) {

          const select =
            document.getElementById('로그인병원');

          select.innerHTML =
            '<option value="">병원을 선택해주세요</option>';


          hospitals.forEach(
            function(hospital) {

              const option =
                document.createElement('option');

              option.value =
                hospital.병원ID;

              option.textContent =
                hospital.병원명;

              select.appendChild(option);

            }
          );

        }
      )

      .withFailureHandler(
        function(error) {

          오류표시(
            '병원 목록을 불러오지 못했습니다.'
          );

          console.error(error);

        }
      )

      .AUTH_getHospitals();

  }


  /* ================================================================
     로그인
     ================================================================ */

  function 로그인() {

    const hospitalId =
      document.getElementById(
        '로그인병원'
      ).value;


    const username =
      document.getElementById(
        '로그인아이디'
      ).value.trim();


    const password =
      document.getElementById(
        '로그인비밀번호'
      ).value;


    오류표시('');


    if (!hospitalId) {

      오류표시(
        '병원을 선택해주세요.'
      );

      return;

    }


    if (!username) {

      오류표시(
        '아이디를 입력해주세요.'
      );

      return;

    }


    if (!password) {

      오류표시(
        '비밀번호를 입력해주세요.'
      );

      return;

    }


    const button =
      document.getElementById(
        '로그인버튼'
      );


    button.disabled = true;
    button.textContent = '로그인 중...';


    google.script.run

      .withSuccessHandler(
        function(result) {

          현재세션 = result;


          sessionStorage.setItem(
            'vivicell_session',
            result.token
          );


          sessionStorage.setItem(
            'vivicell_user',
            JSON.stringify(result.user)
          );


          앱화면표시();

        }
      )

      .withFailureHandler(
        function(error) {

          button.disabled = false;
          button.textContent = '로그인';

          오류표시(
            error.message ||
            '로그인에 실패했습니다.'
          );

        }
      )

      .AUTH_login(
        hospitalId,
        username,
        password
      );

  }


  /* ================================================================

     ================================================================ */

  function 앱화면표시() {

    document.getElementById(
      '인증화면'
    ).style.display = 'none';


    document.getElementById(
      '앱화면'
    ).style.display = 'flex';


    const user =
      현재세션.user;


    document.getElementById(
      '사이드바병원명'
    ).textContent =
      병원명표시(user.병원ID);


    document.getElementById(
      '상단병원명'
    ).textContent =
      병원명표시(user.병원ID);


    document.getElementById(
      '사이드바사용자명'
    ).textContent =
      user.이름;


    document.getElementById(
      '사이드바사용자권한'
    ).textContent =
      권한명표시(user.권한);


    document.getElementById(
      '상단사용자명'
    ).textContent =
      user.이름;


    페이지이동('dashboard');

  }


  /* ================================================================
     병원명
     ================================================================ */

  function 병원명표시(병원ID) {

    const select =
      document.getElementById(
        '로그인병원'
      );


    for (
      let i = 0;
      i < select.options.length;
      i++
    ) {

      if (
        select.options[i].value === 병원ID
      ) {

        return select.options[i].textContent;

      }

    }


    return 병원ID || '-';

  }


  /* ================================================================
     권한명
     ================================================================ */

  function 권한명표시(권한) {

    const map = {

      ADMIN: '관리자',

      MANAGER: '매니저',

      USER: '사용자'

    };


    return map[권한] || 권한 || '-';

  }


  /* ================================================================
     페이지 이동
     ================================================================ */

  function 페이지이동(page) {

    현재페이지 = page;


    document
      .querySelectorAll('.메뉴버튼')
      .forEach(
        function(button) {

          button.classList.toggle(
            'active',
            button.dataset.page === page

    const pageInfo = {

      dashboard: {
        title: '대시보드',
        description: '통합관리 시스템 현황'

      procedure: {
        title: '시술 관리',
        description: '시술 및 사용품목 관리'
      },

      purchase: {
        title: '구매 관리',
        description: '발주 및 입고 관리'
      },

      inventory: {
        title: '재고 관리',
        description: '재고 및 LOT 관리'

        description: '품목 등록 및 조회'

      },

      settings: {
        title: '설정',
        description: '시스템 설정 및 사용자 관리'

    const info =

    document.getElementById(

      info.title;


    document.getElementById(
      '페이지설명'

      info.description;


    페이지렌더링(page);

  /* ================================================================
     페이지 렌더링
     ================================================================ */

  function 페이지렌더링(page) {

    const content =
      document.getElementById(

    if (page === 'dashboard') {

      content.innerHTML =
        대시보드화면();

      return;

    }


    if (page === 'procedure') {

      content.innerHTML =
        준비화면(
          '시술 관리',
          '시술 등록 및 사용품목 관리를 준비하고 있습니다.'
        );

      return;

    }


    if (page === 'purchase') {

      content.innerHTML =
        준비화면(
          '구매 관리',
          '발주 및 입고 관리를 준비하고 있습니다.'
        );

      return;

    }


    if (page === 'inventory') {

      content.innerHTML =
        준비화면(
          '재고 관리',
          '재고 및 LOT 관리를 준비하고 있습니다.'

    if (page === 'item') {

      content.innerHTML =
        품목관리화면();

      품목_목록불러오기();

      return;

        준비화면(
          '통계',
          '통계 화면을 준비하고 있습니다.'

    }


    if (page === 'settings') {

      content.innerHTML =
        준비화면(
          '설정',
          '사용자 및 시스템 설정을 준비하고 있습니다.'

  /* ================================================================
     품목 관리 - 목록 조회
     ================================================================ */

  function 품목_목록불러오기() {

    품목_상태표시('', '');

    const tbody =
      document.getElementById('품목표본문');

    if (tbody) {
      tbody.innerHTML =
        '<tr><td colspan="9"><div class="품목안내">불러오는 중입니다...</div></td></tr>';
    }


    google.script.run

      .withSuccessHandler(
        function(list) {

          품목_원본목록 =
            Array.isArray(list) ? list : [];

          품목_테이블렌더(품목_원본목록);

        }
      )

      .withFailureHandler(
        function(error) {

          품목_상태표시(
            (error && error.message) ||
            '품목 목록을 불러오지 못했습니다.',
            '오류'
          );

          const tb =
            document.getElementById('품목표본문');

          if (tb) {
            tb.innerHTML =
              '<tr><td colspan="9"><div class="품목안내">불러오기에 실패했습니다.</div></td></tr>';
          }

        }
      )

      .ITEM_getList();

  }


  /* ================================================================
     품목 관리 - 검색(클라이언트 필터)
     ================================================================ */

  function 품목_검색() {

    const 이름값 =
      (document.getElementById('품목검색_품목명') || {}).value || '';

    const 분류값 =
      (document.getElementById('품목검색_분류') || {}).value || '';

    const 사용값 =
      (document.getElementById('품목검색_사용여부') || {}).value || 'all';


    const 이름 = 이름값.trim().toLowerCase();
    const 분류 = 분류값.trim().toLowerCase();


    const 결과 =
      품목_원본목록.filter(function(item) {

        const 품목명 =
          String(item.품목명 || '').toLowerCase();

        const 품목분류 =
          String(item.분류 || '').toLowerCase();

        const 사용 =
          품목_사용여부불린(item.사용여부);


        if (이름 && 품목명.indexOf(이름) === -1) {
          return false;
        }

        if (분류 && 품목분류.indexOf(분류) === -1) {
          return false;
        }

        if (사용값 === 'use' && !사용) {
          return false;
        }

        if (사용값 === 'unuse' && 사용) {
          return false;
        }

        return true;

      });


    품목_테이블렌더(결과);

  }


  /* ================================================================
     품목 관리 - 검색(엔터) / 초기화
     ================================================================ */

  function 품목_검색_엔터(event) {

    if (event && event.key === 'Enter') {
      품목_검색();
    }

  }


  function 품목_검색초기화() {

    const 이름 =
      document.getElementById('품목검색_품목명');
    if (이름) { 이름.value = ''; }

    const 분류 =
      document.getElementById('품목검색_분류');
    if (분류) { 분류.value = ''; }

    const 사용 =
      document.getElementById('품목검색_사용여부');
    if (사용) { 사용.value = 'all'; }

    품목_테이블렌더(품목_원본목록);

  }


  /* ================================================================
     품목 관리 - 테이블 렌더
     ================================================================ */

  function 품목_테이블렌더(list) {

    const tbody =
      document.getElementById('품목표본문');

    if (!tbody) {
      return;
    }


    if (!list || list.length === 0) {

      tbody.innerHTML =
        '<tr><td colspan="9"><div class="품목안내">표시할 품목이 없습니다.</div></td></tr>';

      return;

    }


    tbody.innerHTML =
      list.map(function(item) {

        const 사용 =
          품목_사용여부불린(item.사용여부);

        const 품목ID =
          String(item.품목ID || '');


        return `
          <tr>
            <td>${품목_escape(품목ID)}</td>
            <td>${품목_escape(item.품목명)}</td>
            <td>${품목_escape(item.분류)}</td>
            <td>${품목_escape(item.규격)}</td>
            <td>${품목_escape(item.단위)}</td>
            <td class="우">${품목_숫자콤마(item.기본단가)}</td>
            <td>${품목_escape(item.관리단위)}</td>
            <td class="가운데">
              <span class="사용뱃지 ${사용 ? '사용' : '미사용'}">
                ${사용 ? '사용' : '미사용'}
              </span>
            </td>
            <td class="가운데">
              <span class="품목행버튼">
                <button
                  class="버튼 버튼보조 버튼작음"
                  onclick="품목_수정폼열기('${품목_escapeAttr(품목ID)}')"
                >수정</button>
                <button
                  class="버튼 버튼삭제 버튼작음"
                  onclick="품목_삭제('${품목_escapeAttr(품목ID)}')"
                >삭제</button>
              </span>
            </td>
          </tr>
        `;

      }).join('');

  }


  /* ================================================================
     품목 관리 - 등록 폼 열기
     ================================================================ */

  function 품목_등록폼열기() {

    document.getElementById('품목폼제목').textContent = '품목 등록';

    document.getElementById('품목_품목ID').value = '';
    document.getElementById('품목_품목명').value = '';
    document.getElementById('품목_분류').value = '';
    document.getElementById('품목_규격').value = '';
    document.getElementById('품목_단위').value = '';
    document.getElementById('품목_기본단가').value = '';
    document.getElementById('품목_관리단위').value = '';
    document.getElementById('품목_사용여부').checked = true;

    품목_상태표시('', '');

    document.getElementById('품목폼').classList.add('열림');

    document.getElementById('품목_품목명').focus();

  }


  /* ================================================================
     품목 관리 - 수정 폼 열기
     ================================================================ */

  function 품목_수정폼열기(품목ID) {

    const item =
      품목_원본목록.filter(function(x) {
        return String(x.품목ID) === String(품목ID);
      })[0];


    if (!item) {
      품목_상태표시('수정할 품목을 찾을 수 없습니다.', '오류');
      return;
    }


    document.getElementById('품목폼제목').textContent = '품목 수정';

    document.getElementById('품목_품목ID').value = String(item.품목ID || '');
    document.getElementById('품목_품목명').value = String(item.품목명 || '');
    document.getElementById('품목_분류').value = String(item.분류 || '');
    document.getElementById('품목_규격').value = String(item.규격 || '');
    document.getElementById('품목_단위').value = String(item.단위 || '');
    document.getElementById('품목_기본단가').value =
      (item.기본단가 === '' || item.기본단가 == null) ? '' : item.기본단가;
    document.getElementById('품목_관리단위').value = String(item.관리단위 || '');
    document.getElementById('품목_사용여부').checked =
      품목_사용여부불린(item.사용여부);

    품목_상태표시('', '');

    document.getElementById('품목폼').classList.add('열림');

    document.getElementById('품목_품목명').focus();

  }


  /* ================================================================
     품목 관리 - 폼 닫기
     ================================================================ */

  function 품목_폼닫기() {

    document.getElementById('품목폼').classList.remove('열림');

  }


  /* ================================================================
     품목 관리 - 저장(등록/수정)
     ================================================================ */

  function 품목_저장() {

    const 품목ID =
      document.getElementById('품목_품목ID').value.trim();

    const 품목명 =
      document.getElementById('품목_품목명').value.trim();

    const 분류 =
      document.getElementById('품목_분류').value.trim();

    const 규격 =
      document.getElementById('품목_규격').value.trim();

    const 단위 =
      document.getElementById('품목_단위').value.trim();

    const 기본단가값 =
      document.getElementById('품목_기본단가').value;

    const 관리단위 =
      document.getElementById('품목_관리단위').value.trim();

    const 사용여부 =
      document.getElementById('품목_사용여부').checked;


    if (!품목명) {
      품목_상태표시('품목명을 입력해주세요.', '오류');
      document.getElementById('품목_품목명').focus();
      return;
    }


    const 기본단가 =
      기본단가값 === '' ? 0 : Number(기본단가값);


    if (isNaN(기본단가) || 기본단가 < 0) {
      품목_상태표시('기본단가는 0 이상의 숫자로 입력해주세요.', '오류');
      document.getElementById('품목_기본단가').focus();
      return;
    }


    const data = {
      품목명: 품목명,
      분류: 분류,
      규격: 규격,
      단위: 단위,
      기본단가: 기본단가,
      관리단위: 관리단위,
      사용여부: 사용여부
    };

    if (품목ID) {
      data.품목ID = 품목ID;
    }


    const 저장버튼 =
      document.getElementById('품목저장버튼');

    저장버튼.disabled = true;
    저장버튼.textContent = '저장 중...';


    google.script.run

      .withSuccessHandler(
        function(message) {

          저장버튼.disabled = false;
          저장버튼.textContent = '저장';

          품목_폼닫기();

          품목_상태표시(
            String(message || '저장되었습니다.'),
            '성공'
          );

          품목_목록불러오기();

        }
      )

      .withFailureHandler(
        function(error) {

          저장버튼.disabled = false;
          저장버튼.textContent = '저장';

          품목_상태표시(
            (error && error.message) || '저장에 실패했습니다.',
            '오류'
          );

        }
      )

      .ITEM_save(data);

  }


  /* ================================================================
     품목 관리 - 삭제
     ================================================================ */

  function 품목_삭제(품목ID) {

    const id = String(품목ID || '').trim();

    if (!id) {
      return;
    }


    const item =
      품목_원본목록.filter(function(x) {
        return String(x.품목ID) === id;
      })[0];

    const 이름 =
      item ? String(item.품목명 || '') : '';


    const 확인 =
      window.confirm(
        '다음 품목을 삭제하시겠습니까?\n\n' +
        id + (이름 ? ' / ' + 이름 : '')
      );

    if (!확인) {
      return;
    }


    google.script.run

      .withSuccessHandler(
        function(message) {

          품목_상태표시(
            String(message || '삭제되었습니다.'),
            '성공'
          );

          품목_목록불러오기();

        }
      )

      .withFailureHandler(
        function(error) {

          품목_상태표시(
            (error && error.message) || '삭제에 실패했습니다.',
            '오류'
          );

        }
      )

      .ITEM_delete(id);

  }


  /* ================================================================
     품목 관리 - 유틸
     ================================================================ */

  function 품목_상태표시(message, type) {

    const el =
      document.getElementById('품목상태');

    if (!el) {
      return;
    }

    el.textContent = message || '';

    el.className = '품목상태';

    if (type === '성공') {
      el.classList.add('성공');
    } else if (type === '오류') {
      el.classList.add('오류');
    }

  }


  function 품목_사용여부불린(값) {

    if (값 === true) {
      return true;
    }

    if (값 === false) {
      return false;
    }

    const s =
      String(값 == null ? '' : 값).trim().toLowerCase();

    if (s === 'false' || s === '' || s === '0' || s === '미사용') {
      return false;
    }

    return true;

  }


  function 품목_숫자콤마(값) {

    if (값 === '' || 값 == null) {
      return '';
    }

    const n = Number(값);

    if (isNaN(n)) {
      return 품목_escape(값);
    }

    return n.toLocaleString('ko-KR');

  }


  function 품목_escape(값) {

    return String(값 == null ? '' : 값)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

  }


  function 품목_escapeAttr(값) {

    return String(값 == null ? '' : 값)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '&quot;');

  }


  /* ================================================================
     로그아웃
     ================================================================ */

  function 로그아웃() {

    if (!현재세션) {
      로그인화면으로돌아가기();
      return;
    }


    google.script.run

      .withSuccessHandler(
        function() {

          로그인화면으로돌아가기();

        }
      )

      .withFailureHandler(
        function() {

          로그인화면으로돌아가기();

        }
      )

      .AUTH_logout(
        현재세션.token
      );

  }


  /* ================================================================
     로그인 화면으로
     ================================================================ */

  function 로그인화면으로돌아가기() {

    현재세션 = null;


    sessionStorage.removeItem(
      'vivicell_session'
    );

    sessionStorage.removeItem(
      'vivicell_user'
    );


    document.getElementById(
      '앱화면'
    ).style.display = 'none';


    document.getElementById(
      '인증화면'
    ).style.display = 'flex';


    document.getElementById(
      '로그인비밀번호'
    ).value = '';


    document.getElementById(
      '로그인버튼'
    ).disabled = false;


    document.getElementById(
      '로그인버튼'
    ).textContent = '로그인';

  }


  /* ================================================================
     오류
     ================================================================ */

  function 오류표시(message) {

    document.getElementById(
      '오류메시지'
    ).textContent =
      message || '';

  }


  /* ================================================================
     Enter 로그인
     ================================================================ */

  document.addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter' &&
        document.getElementById('인증화면').style.display !== 'none'
      ) {

        로그인();

      }

    }
  );

</script>
