<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <title>VIVICELL LAB</title>

  <style>

    /* ================================================================
       기본
       ================================================================ */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    body {
      background: #f7f5fc;
      color: #332b52;
    }

    button,
    input,
    select {
      font-family: inherit;
    }


    /* ================================================================
       로그인 화면
       ================================================================ */

    .인증화면 {
      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f5f2ff;
    }

    .인증카드 {
      width: 420px;

      padding: 42px;

      background: white;

      border: 1px solid #e4dcfb;
      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(60, 45, 100, 0.12);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-main {
      font-size: 25px;
      font-weight: 800;
      color: #332b52;
    }

    .brand-sub {
      margin-top: 6px;

      font-size: 14px;
      font-weight: 600;

      color: #8064d8;
    }

    .인증안내 {
      margin-bottom: 25px;

      text-align: center;

      font-size: 14px;
      line-height: 1.6;

      color: #777;
    }

    .인증필드 {
      margin-bottom: 18px;
    }

    .인증필드 label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }

    .인증필드 select,
    .인증필드 input {

      width: 100%;
      height: 46px;

      padding: 0 13px;

      border: 1px solid #ddd7ee;
      border-radius: 9px;

      background: white;

      font-size: 14px;

      outline: none;
    }

    .인증필드 select:focus,
    .인증필드 input:focus {

      border-color: #8064d8;

      box-shadow:
        0 0 0 3px rgba(128, 100, 216, 0.10);
    }

    .인증로그인버튼 {

      width: 100%;
      height: 48px;

      margin-top: 8px;

      border: 0;
      border-radius: 9px;

      background: #8064d8;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    .인증로그인버튼:hover {
      background: #7053ca;
    }

    .인증로그인버튼:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .오류메시지 {

      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      font-size: 13px;

      color: #d93025;
    }


    /* ================================================================
       앱 전체
       ================================================================ */

    .앱화면 {

      display: none;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: #f7f5fc;
    }


    /* ================================================================
       사이드바
       ================================================================ */

    .사이드바 {

      width: 230px;
      height: 100vh;

      flex-shrink: 0;

      display: flex;
      flex-direction: column;

      background: #f3efff;

      border-right: 1px solid #e4dcfb;
    }

    .사이드바브랜드 {

      padding: 24px 20px 20px;

      border-bottom: 1px solid #e4dcfb;
    }

    .사이드바브랜드 .main {

      font-size: 20px;
      font-weight: 800;

      color: #332b52;
    }

    .사이드바브랜드 .sub {

      margin-top: 4px;

      font-size: 12px;
      font-weight: 600;

      color: #8064d8;
    }


    /* ================================================================
       병원 정보
       ================================================================ */

    .사이드바병원 {

      margin: 16px 14px;

      padding: 12px 13px;

      border-radius: 10px;

      background: rgba(128, 100, 216, 0.08);
    }

    .사이드바병원 .label {

      margin-bottom: 5px;

      font-size: 11px;

      color: #8b849d;
    }

    .사이드바병원 .name {

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }


    /* ================================================================
       메뉴
       ================================================================ */

    .메뉴영역 {

      flex: 1;

      padding: 4px 10px;

      overflow-y: auto;
    }

    .메뉴버튼 {

      width: 100%;

      height: 44px;

      margin-bottom: 4px;

      padding: 0 14px;

      display: flex;
      align-items: center;

      border: 0;
      border-radius: 9px;

      background: transparent;

      color: #5d5673;

      font-size: 14px;
      font-weight: 600;

      text-align: left;

      cursor: pointer;
    }

    .메뉴버튼:hover {

      background: #e9e2fb;

      color: #40385f;
    }

    .메뉴버튼.active {

      background: #8064d8;

      color: white;

      box-shadow:
        0 5px 12px rgba(128, 100, 216, 0.20);
    }

    .메뉴아이콘 {

      width: 28px;

      font-size: 16px;

      text-align: center;
    }


    /* ================================================================
       사이드바 하단
       ================================================================ */

    .사이드바하단 {

      padding: 14px;

      border-top: 1px solid #e4dcfb;
    }

    .사용자정보 {

      margin-bottom: 10px;

      padding: 10px 11px;

      border-radius: 9px;

      background: white;
    }

    .사용자정보 .name {

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }

    .사용자정보 .role {

      margin-top: 3px;

      font-size: 11px;

      color: #8b849d;
    }

    .로그아웃버튼 {

      width: 100%;
      height: 38px;

      border: 1px solid #ddd7ee;
      border-radius: 8px;

      background: white;

      color: #665f78;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;
    }

    .로그아웃버튼:hover {

      background: #f8f6fc;

      border-color: #cfc5e8;
    }


    /* ================================================================
       메인 영역
       ================================================================ */

    .메인영역 {

      flex: 1;

      min-width: 0;
      height: 100vh;

      overflow-y: auto;
    }


    /* ================================================================
       상단바
       ================================================================ */

    .상단바 {

      height: 72px;

      padding: 0 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: white;

      border-bottom: 1px solid #eeeaf5;
    }

    .페이지제목 {

      font-size: 20px;
      font-weight: 800;

      color: #332b52;
    }

    .페이지설명 {

      margin-top: 3px;

      font-size: 12px;

      color: #8b849d;
    }

    .상단사용자 {

      display: flex;
      align-items: center;

      gap: 10px;
    }

    .상단병원 {

      padding: 7px 11px;

      border-radius: 7px;

      background: #f3efff;

      color: #7053ca;

      font-size: 12px;
      font-weight: 700;
    }

    .상단이름 {

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }


    /* ================================================================
       콘텐츠
       ================================================================ */

    .콘텐츠 {

      padding: 30px;
    }


    /* ================================================================
       대시보드 카드
       ================================================================ */

    .카드그리드 {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 16px;

      margin-bottom: 24px;
    }

    .카드 {

      padding: 20px;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 13px;

      box-shadow:
        0 4px 15px rgba(60, 45, 100, 0.04);
    }

    .카드라벨 {

      font-size: 12px;

      color: #8b849d;
    }

    .카드숫자 {

      margin-top: 9px;

      font-size: 26px;
      font-weight: 800;

      color: #40385f;
    }

    .카드설명 {

      margin-top: 6px;

      font-size: 11px;

      color: #a19bad;
    }


    /* ================================================================
       준비 화면
       ================================================================ */

    .준비화면 {

      min-height: 420px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 14px;
    }

    .준비아이콘 {

      width: 64px;
      height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #f3efff;

      font-size: 28px;
    }

    .준비제목 {

      margin-top: 20px;

      font-size: 20px;
      font-weight: 800;

      color: #40385f;
    }

    .준비설명 {

      margin-top: 8px;

      font-size: 13px;

      color: #8b849d;

      text-align: center;
      line-height: 1.6;
    }


    /* ================================================================
       반응형
       ================================================================ */

    @media (max-width: 1100px) {

      .카드그리드 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 700px) {

      .사이드바 {
        width: 190px;
      }

      .콘텐츠 {
        padding: 20px;
      }

      .상단바 {
        padding: 0 20px;
      }

      .카드그리드 {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>


  <!-- ================================================================
       로그인
       ================================================================ -->

  <div
    id="인증화면"
    class="인증화면"
  >

    <div class="인증카드">

      <div class="brand">

        <div class="brand-main">
          VIVICELL LAB
        </div>

        <div class="brand-sub">
          통합관리 시스템
        </div>

      </div>


      <div class="인증안내">

        사용할 병원을 선택한 후<br>
        아이디와 비밀번호로 로그인해주세요.

      </div>


      <div class="인증필드">

        <label>
          병원
        </label>

        <select id="로그인병원">

          <option value="">
            병원 목록을 불러오는 중...
          </option>

        </select>

      </div>


      <div class="인증필드">

        <label>
          아이디
        </label>

        <input
          id="로그인아이디"
          type="text"
          autocomplete="username"
          placeholder="아이디를 입력하세요"
        >

      </div>


      <div class="인증필드">

        <label>
          비밀번호
        </label>

        <input
          id="로그인비밀번호"
          type="password"
          autocomplete="current-password"
          placeholder="비밀번호를 입력하세요"
        >

      </div>


      <button
        id="로그인버튼"
        class="인증로그인버튼"
        onclick="로그인()"
      >
        로그인
      </button>


      <div
        id="오류메시지"
        class="오류메시지"
      ></div>

    </div>

  </div>



  <!-- ================================================================
       실제 앱
       ================================================================ -->

  <div
    id="앱화면"
    class="앱화면"
  >


    <!-- ==============================================================
         사이드바
         ============================================================== -->

    <aside class="사이드바">


      <div class="사이드바브랜드">

        <div class="main">
          VIVICELL LAB
        </div>

        <div class="sub">
          통합관리 시스템
        </div>

      </div>


      <div class="사이드바병원">

        <div class="label">
          현재 병원
        </div>

        <div
          id="사이드바병원명"
          class="name"
        >
          -
        </div>

      </div>


      <div class="메뉴영역">


        <button
          class="메뉴버튼 active"
          data-page="dashboard"
          onclick="페이지이동('dashboard')"
        >

          <span class="메뉴아이콘">
            🏠
          </span>

          대시보드

        </button>


        <button
          class="메뉴버튼"
          data-page="procedure"
          onclick="페이지이동('procedure')"
        >

          <span class="메뉴아이콘">
            🩺
          </span>

          시술 관리

        </button>


        <button
          class="메뉴버튼"
          data-page="purchase"
          onclick="페이지이동('purchase')"
        >

          <span class="메뉴아이콘">
            🛒
          </span>

          구매 관리

        </button>


        <button
          class="메뉴버튼"
          data-page="inventory"
          onclick="페이지이동('inventory')"
        >

          <span class="메뉴아이콘">
            📦
          </span>

          재고 관리

        </button>


        <button
          class="메뉴버튼"
          data-page="statistics"
          onclick="페이지이동('statistics')"
        >

          <span class="메뉴아이콘">
            📊
          </span>

          통계

        </button>


        <button
          class="메뉴버튼"
          data-page="settings"
          onclick="페이지이동('settings')"
        >

          <span class="메뉴아이콘">
            ⚙️
          </span>

          설정

        </button>


      </div>


      <div class="사이드바하단">


        <div class="사용자정보">

          <div
            id="사이드바사용자명"
            class="name"
          >
            -
          </div>

          <div
            id="사이드바사용자권한"
            class="role"
          >
            -
          </div>

        </div>


        <button
          class="로그아웃버튼"
          onclick="로그아웃()"
        >
          로그아웃
        </button>


      </div>


    </aside>



    <!-- ==============================================================
         메인
         ============================================================== -->

    <main class="메인영역">


      <header class="상단바">


        <div>

          <div
            id="페이지제목"
            class="페이지제목"
          >
            대시보드
          </div>

          <div
            id="페이지설명"
            class="페이지설명"
          >
            통합관리 시스템 현황
          </div>

        </div>


        <div class="상단사용자">

          <div
            id="상단병원명"
            class="상단병원"
          >
            -
          </div>

          <div
            id="상단사용자명"
            class="상단이름"
          >
            -
          </div>

        </div>


      </header>


      <section
        id="콘텐츠"
        class="콘텐츠"
      >

        <!-- JavaScript에서 페이지를 출력 -->

      </section>


    </main>


  </div>



<script>

  /* ================================================================
     전역 상태
     ================================================================ */

  let 현재세션 = null;
  let 현재페이지 = 'dashboard';


  /* ================================================================
     페이지 시작
     ================================================================ */

  document.addEventListener(
    'DOMContentLoaded',
    function() {

      병원목록불러오기();

    }
  );


  /* ================================================================
     병원 목록
     ================================================================ */

  function 병원목록불러오기() {

    google.script.run

      .withSuccessHandler(
        function(hospitals) {

          const select =
            document.getElementById('로그인병원');

          select.innerHTML =
            '<option value="">병원을 선택해주세요</option>';


          hospitals.forEach(
            function(hospital) {

              const option =
                document.createElement('option');

              option.value =
                hospital.병원ID;

              option.textContent =
                hospital.병원명;

              select.appendChild(option);

            }
          );

        }
      )

      .withFailureHandler(
        function(error) {

          오류표시(
            '병원 목록을 불러오지 못했습니다.'
          );

          console.error(error);

        }
      )

      .AUTH_getHospitals();

  }


  /* ================================================================
     로그인
     ================================================================ */

  function 로그인() {

    const hospitalId =
      document.getElementById(
        '로그인병원'
      ).value;


    const username =
      document.getElementById(
        '로그인아이디'
      ).value.trim();


    const password =
      document.getElementById(
        '로그인비밀번호'
      ).value;


    오류표시('');


    if (!hospitalId) {

      오류표시(
        '병원을 선택해주세요.'
      );

      return;

    }


    if (!username) {

      오류표시(
        '아이디를 입력해주세요.'
      );

      return;

    }


    if (!password) {

      오류표시(
        '비밀번호를 입력해주세요.'
      );

      return;

    }


    const button =
      document.getElementById(
        '로그인버튼'
      );


    button.disabled = true;
    button.textContent = '로그인 중...';


    google.script.run

      .withSuccessHandler(
        function(result) {

          현재세션 = result;


          sessionStorage.setItem(
            'vivicell_session',
            result.token
          );


          sessionStorage.setItem(
            'vivicell_user',
            JSON.stringify(result.user)
          );


          앱화면표시();

        }
      )

      .withFailureHandler(
        function(error) {

          button.disabled = false;
          button.textContent = '로그인';

          오류표시(
            error.message ||
            '로그인에 실패했습니다.'
          );

        }
      )

      .AUTH_login(
        hospitalId,
        username,
        password
      );

  }


  /* ================================================================
     앱 화면 표시
     ================================================================ */

  function 앱화면표시() {

    document.getElementById(
      '인증화면'
    ).style.display = 'none';


    document.getElementById(
      '앱화면'
    ).style.display = 'flex';


    const user =
      현재세션.user;


    document.getElementById(
      '사이드바병원명'
    ).textContent =
      병원명표시(user.병원ID);


    document.getElementById(
      '상단병원명'
    ).textContent =
      병원명표시(user.병원ID);


    document.getElementById(
      '사이드바사용자명'
    ).textContent =
      user.이름;


    document.getElementById(
      '사이드바사용자권한'
    ).textContent =
      권한명표시(user.권한);


    document.getElementById(
      '상단사용자명'
    ).textContent =
      user.이름;


    페이지이동('dashboard');

  }


  /* ================================================================
     병원명
     ================================================================ */

  function 병원명표시(병원ID) {

    const select =
      document.getElementById(
        '로그인병원'
      );


    for (
      let i = 0;
      i < select.options.length;
      i++
    ) {

      if (
        select.options[i].value === 병원ID
      ) {

        return select.options[i].textContent;

      }

    }


    return 병원ID || '-';

  }


  /* ================================================================
     권한명
     ================================================================ */

  function 권한명표시(권한) {

    const map = {

      ADMIN: '관리자',

      MANAGER: '매니저',

      USER: '사용자'

    };


    return map[권한] || 권한 || '-';

  }


  /* ================================================================
     페이지 이동
     ================================================================ */

  function 페이지이동(page) {

    현재페이지 = page;


    document
      .querySelectorAll('.메뉴버튼')
      .forEach(
        function(button) {

          button.classList.toggle(
            'active',
            button.dataset.page === page
          );

        }
      );


    const pageInfo = {

      dashboard: {
        title: '대시보드',
        description: '통합관리 시스템 현황'
      },

      procedure: {
        title: '시술 관리',
        description: '시술 및 사용품목 관리'
      },

      purchase: {
        title: '구매 관리',
        description: '발주 및 입고 관리'
      },

      inventory: {
        title: '재고 관리',
        description: '재고 및 LOT 관리'
      },

      statistics: {
        title: '통계',
        description: '재고 및 운영 통계'
      },

      settings: {
        title: '설정',
        description: '시스템 설정 및 사용자 관리'
      }

    };


    const info =
      pageInfo[page];


    document.getElementById(
      '페이지제목'
    ).textContent =
      info.title;


    document.getElementById(
      '페이지설명'
    ).textContent =
      info.description;


    페이지렌더링(page);

  }


  /* ================================================================
     페이지 렌더링
     ================================================================ */

  function 페이지렌더링(page) {

    const content =
      document.getElementById(
        '콘텐츠'
      );


    if (page === 'dashboard') {

      content.innerHTML =
        대시보드화면();

      return;

    }


    if (page === 'procedure') {

      content.innerHTML =
        준비화면(
          '🩺',
          '시술 관리',
          '시술 등록 및 사용품목 관리를 준비하고 있습니다.'
        );

      return;

    }


    if (page === 'purchase') {

      content.innerHTML =
        준비화면(
          '🛒',
          '구매 관리',
          '발주 및 입고 관리를 준비하고 있습니다.'
        );

      return;

    }


    if (page === 'inventory') {

      content.innerHTML =
        준비화면(
          '📦',
          '재고 관리',
          '재고 및 LOT 관리를 준비하고 있습니다.'
        );

      return;

    }


    if (page === 'statistics') {

      content.innerHTML =
        준비화면(
          '📊',
          '통계',
          '통계 화면을 준비하고 있습니다.'
        );

      return;

    }


    if (page === 'settings') {

      content.innerHTML =
        준비화면(
          '⚙️',
          '설정',
          '사용자 및 시스템 설정을 준비하고 있습니다.'
        );

      return;

    }

  }

  /* ================================================================
     준비 화면
     ================================================================ */

  function 준비화면(
    icon,
    title,
    description
  ) {

    return `

      <div class="준비화면">

        <div class="준비아이콘">
          ${icon}
        </div>

        <div class="준비제목">
          ${title}
        </div>

        <div class="준비설명">
          ${description}
        </div>

      </div>

    `;

  }


  /* ================================================================
     로그아웃
     ================================================================ */

  function 로그아웃() {

    if (!현재세션) {
      로그인화면으로돌아가기();
      return;
    }


    google.script.run

      .withSuccessHandler(
        function() {

          로그인화면으로돌아가기();

        }
      )

      .withFailureHandler(
        function() {

          로그인화면으로돌아가기();

        }
      )

      .AUTH_logout(
        현재세션.token
      );

  }


  /* ================================================================
     로그인 화면으로
     ================================================================ */

  function 로그인화면으로돌아가기() {

    현재세션 = null;


    sessionStorage.removeItem(
      'vivicell_session'
    );

    sessionStorage.removeItem(
      'vivicell_user'
    );


    document.getElementById(
      '앱화면'
    ).style.display = 'none';


    document.getElementById(
      '인증화면'
    ).style.display = 'flex';


    document.getElementById(
      '로그인비밀번호'
    ).value = '';


    document.getElementById(
      '로그인버튼'
    ).disabled = false;


    document.getElementById(
      '로그인버튼'
    ).textContent = '로그인';

  }


  /* ================================================================
     오류
     ================================================================ */

  function 오류표시(message) {

    document.getElementById(
      '오류메시지'
    ).textContent =
      message || '';

  }


  /* ================================================================
     Enter 로그인
     ================================================================ */

  document.addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter' &&
        document.getElementById('인증화면').style.display !== 'none'
      ) {

        로그인();

      }

    }
  );

</script>
