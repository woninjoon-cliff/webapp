<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <title>VIVICELL LAB</title>

  <style>

    /* ================================================================
       기본
       ================================================================ */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    body {
      background: #f7f5fc;
      color: #332b52;
    }

    button,
    input,
    select {
      font-family: inherit;
    }


    /* ================================================================
       로그인 화면
       ================================================================ */

    .인증화면 {
      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f5f2ff;
    }

    .인증카드 {
      width: 420px;

      padding: 42px;

      background: white;

      border: 1px solid #e4dcfb;
      border-radius: 18px;

      box-shadow:
        0 15px 45px rgba(60, 45, 100, 0.12);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-main {
      font-size: 25px;
      font-weight: 800;
      color: #332b52;
    }

    .brand-sub {
      margin-top: 6px;

      font-size: 25px;
      font-weight: 800;

      color: #8064d8;
    }

    .인증안내 {
      margin-bottom: 25px;

      text-align: center;

      font-size: 14px;
      line-height: 1.6;

      color: #777;
    }

    .인증필드 {
      margin-bottom: 18px;
    }

    .인증필드 label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }

    .인증필드 select,
    .인증필드 input {

      width: 100%;
      height: 46px;

      padding: 0 13px;

      border: 1px solid #ddd7ee;
      border-radius: 9px;

      background: white;

      font-size: 14px;

      outline: none;
    }

    .인증필드 select:focus,
    .인증필드 input:focus {

      border-color: #8064d8;

      box-shadow:
        0 0 0 3px rgba(128, 100, 216, 0.10);
    }

    .인증로그인버튼 {

      width: 100%;
      height: 48px;

      margin-top: 8px;

      border: 0;
      border-radius: 9px;

      background: #8064d8;
      color: white;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }

    .인증로그인버튼:hover {
      background: #7053ca;
    }

    .인증로그인버튼:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .오류메시지 {

      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      font-size: 13px;

      color: #d93025;
    }


    /* ================================================================
       앱 전체
       ================================================================ */

    .앱화면 {

      display: none;

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: #f7f5fc;
    }


    /* ================================================================
       사이드바
       ================================================================ */

    .사이드바 {

      width: 230px;
      height: 100vh;

      flex-shrink: 0;

      display: flex;
      flex-direction: column;

      background: #f3efff;

      border-right: 1px solid #e4dcfb;
    }

    .사이드바브랜드 {

      padding: 24px 20px 20px;

      border-bottom: 1px solid #e4dcfb;
    }

    .사이드바브랜드 .main {

      font-size: 20px;
      font-weight: 800;

      color: #332b52;
    }

    .사이드바브랜드 .sub {

      margin-top: 2px;

      font-size: 20px;
      font-weight: 800;

      color: #8064d8;
    }


    /* ================================================================
       병원 정보
       ================================================================ */

    .사이드바병원 {

      margin: 16px 14px;

      padding: 10px 13px;

      border-radius: 10px;

      background: rgba(128, 100, 216, 0.08);
    }

    .사이드바병원 .name {

      font-size: 14px;
      font-weight: 700;

      color: #40385f;

      text-align: center;
    }


    /* ================================================================
       메뉴
       ================================================================ */

    .메뉴영역 {

      flex: 1;

      padding: 4px 10px;

      overflow-y: auto;
    }

    .메뉴버튼 {

      width: 100%;

      height: 44px;

      margin-bottom: 4px;

      padding: 0 16px;

      display: flex;
      align-items: center;

      border: 0;
      border-radius: 9px;

      background: transparent;

      color: #5d5673;

      font-size: 14px;
      font-weight: 600;

      text-align: left;

      cursor: pointer;
    }

    .메뉴버튼:hover {

      background: #e9e2fb;

      color: #40385f;
    }

    .메뉴버튼.active {

      background: #8064d8;

      color: white;

      box-shadow:
        0 5px 12px rgba(128, 100, 216, 0.20);
    }


    /* ================================================================
       사이드바 그룹 (아코디언)
       ================================================================ */

    .메뉴그룹 {
      margin-bottom: 4px;
    }

    .그룹상위 {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .그룹화살표 {
      font-size: 10px;
      color: #8b849d;
      transition: transform 0.15s ease;
    }

    .메뉴그룹.열림 > .그룹상위 .그룹화살표 {
      transform: rotate(90deg);
      color: #40385f;
    }

    .메뉴그룹.열림 > .그룹상위:not(.active) {
      background: #e9e2fb;
      color: #40385f;
    }

    .하위목록 {
      display: none;
      padding: 2px 0 6px 0;
    }

    .메뉴그룹.열림 > .하위목록 {
      display: block;
    }

    .하위버튼 {
      width: 100%;
      height: 36px;
      margin-bottom: 2px;
      padding: 0 14px 0 28px;
      display: flex;
      align-items: center;

      border: 0;
      border-radius: 8px;
      border-left: 3px solid transparent;

      background: transparent;

      color: #665f78;
      font-size: 13px;
      font-weight: 500;

      text-align: left;
      cursor: pointer;
    }

    .하위버튼:hover {
      background: #ede6fb;
      color: #40385f;
    }

    .하위버튼.active {
      background: #e0d5fa;
      color: #40385f;
      font-weight: 700;
      border-left-color: #8064d8;
    }


    /* ================================================================
       사이드바 하단
       ================================================================ */

    .사이드바하단 {

      padding: 14px;

      border-top: 1px solid #e4dcfb;
    }

    .사용자정보 {

      margin-bottom: 10px;

      padding: 10px 11px;

      border-radius: 9px;

      background: white;
    }

    .사용자정보 .name {

      display: inline;

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }

    .사용자정보 .role {

      display: inline;

      margin-left: 6px;

      font-size: 11px;

      color: #8b849d;
    }

    .로그아웃버튼 {

      width: 100%;
      height: 38px;

      border: 1px solid #ddd7ee;
      border-radius: 8px;

      background: white;

      color: #665f78;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;
    }

    .로그아웃버튼:hover {

      background: #f8f6fc;

      border-color: #cfc5e8;
    }


    /* ================================================================
       메인 영역
       ================================================================ */

    .메인영역 {

      flex: 1;

      min-width: 0;
      height: 100vh;

      overflow-y: auto;
    }


    /* ================================================================
       상단바
       ================================================================ */

    .상단바 {

      height: 72px;

      padding: 0 30px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: white;

      border-bottom: 1px solid #eeeaf5;
    }

    .페이지제목 {

      font-size: 20px;
      font-weight: 800;

      color: #332b52;
    }

    .페이지설명 {

      margin-top: 3px;

      font-size: 12px;

      color: #8b849d;
    }

    .상단사용자 {

      display: flex;
      align-items: center;

      gap: 10px;
    }

    .상단병원 {

      padding: 7px 11px;

      border-radius: 7px;

      background: #f3efff;

      color: #7053ca;

      font-size: 12px;
      font-weight: 700;
    }

    .상단이름 {

      font-size: 13px;
      font-weight: 700;

      color: #40385f;
    }


    /* ================================================================
       콘텐츠
       ================================================================ */

    .콘텐츠 {

      padding: 30px;
    }


    /* ================================================================
       대시보드 카드
       ================================================================ */

    .카드그리드 {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 16px;

      margin-bottom: 24px;
    }

    .카드 {

      padding: 20px;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 13px;

      box-shadow:
        0 4px 15px rgba(60, 45, 100, 0.04);
    }

    .카드라벨 {

      font-size: 12px;

      color: #8b849d;
    }

    .카드숫자 {

      margin-top: 9px;

      font-size: 26px;
      font-weight: 800;

      color: #40385f;
    }

    .카드설명 {

      margin-top: 6px;

      font-size: 11px;

      color: #a19bad;
    }


    /* ================================================================
       준비 화면
       ================================================================ */

    .준비화면 {

      min-height: 420px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 14px;
    }

    .준비제목 {

      font-size: 20px;
      font-weight: 800;

      color: #40385f;
    }

    .준비설명 {

      margin-top: 8px;

      font-size: 13px;

      color: #8b849d;

      text-align: center;
      line-height: 1.6;
    }


    /* ================================================================
       품목 관리
       ================================================================ */

    .품목상단바 {

      display: flex;
      justify-content: flex-end;

      gap: 10px;

      margin-bottom: 14px;
    }

    .품목툴바 {

      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 18px;

      padding: 16px 18px;

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 13px;
    }

    .품목툴바 .필드 {

      display: flex;
      flex-direction: column;

      gap: 5px;
    }

    .품목툴바 .필드 label {

      font-size: 11px;
      font-weight: 700;

      color: #8b849d;
    }

    .품목툴바 input,
    .품목툴바 select {

      height: 40px;

      padding: 0 11px;

      border: 1px solid #ddd7ee;
      border-radius: 8px;

      background: white;

      font-size: 13px;

      outline: none;
    }

    .품목툴바 input:focus,
    .품목툴바 select:focus {

      border-color: #8064d8;
    }

    .품목툴바 .툴바여백 {
      flex: 1;
    }

    .버튼 {

      height: 40px;

      padding: 0 16px;

      border: 0;
      border-radius: 8px;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }

    .버튼주요 {
      background: #8064d8;
      color: white;
    }

    .버튼주요:hover {
      background: #7053ca;
    }

    .버튼보조 {
      background: #f0ecfa;
      color: #6a5fa0;
    }

    .버튼보조:hover {
      background: #e6dffa;
    }

    .버튼삭제 {
      background: #fbe8e8;
      color: #c23b3b;
    }

    .버튼삭제:hover {
      background: #f7dada;
    }

    .버튼작음 {

      height: 32px;

      padding: 0 12px;

      font-size: 12px;

      border-radius: 7px;
    }


    /* ================================================================
       품목 등록/수정 폼
       ================================================================ */

    .품목폼 {

      display: none;

      margin-bottom: 18px;

      padding: 20px;

      background: white;

      border: 1px solid #e4dcfb;
      border-radius: 13px;
    }

    .품목폼.열림 {
      display: block;
    }

    .품목폼제목 {

      margin-bottom: 16px;

      font-size: 15px;
      font-weight: 800;

      color: #40385f;
    }

    .품목폼그리드 {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 14px;
    }

    @media (max-width: 900px) {
      .품목폼그리드 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .품목폼그리드 {
        grid-template-columns: 1fr;
      }
    }

    .품목폼필드 {

      display: flex;
      flex-direction: column;

      gap: 6px;
    }

    .품목폼필드 label {

      font-size: 12px;
      font-weight: 700;

      color: #40385f;
    }

    .품목폼필드 label .필수 {
      color: #d93025;
    }

    .품목폼필드 input {

      height: 42px;

      padding: 0 12px;

      border: 1px solid #ddd7ee;
      border-radius: 8px;

      font-size: 13px;

      outline: none;
    }

    .품목폼필드 input:focus {
      border-color: #8064d8;
    }

    .품목폼체크 {

      display: flex;
      align-items: center;

      gap: 8px;

      height: 42px;
    }

    .품목폼체크 input {

      width: 18px;
      height: 18px;
    }

    .품목폼하단 {

      display: flex;

      gap: 10px;

      margin-top: 18px;
    }


    /* ================================================================
       품목 테이블
       ================================================================ */

    .품목표영역 {

      background: white;

      border: 1px solid #eeeaf5;
      border-radius: 13px;

      overflow: hidden;
    }

    .품목표 {

      width: 100%;

      border-collapse: collapse;

      font-size: 13px;

      table-layout: fixed;
    }

    .품목표 thead th {

      padding: 13px 14px;

      background: #f6f2fe;

      color: #5b5480;

      font-size: 12px;
      font-weight: 800;

      text-align: left;

      border-bottom: 1px solid #eeeaf5;

      white-space: nowrap;

      position: relative;

      /* 리사이즈 핸들이 경계선을 넘어 좌우로 걸쳐지도록 overflow:visible */
      overflow: visible;
    }

    /* 헤더 텍스트 자체는 안쪽 span에서 말줄임 처리
       + 정렬 클릭 대상. 리사이즈 핸들과 별도라 상호간섭 없음. */
    .품목표 thead th > .th_텍스트 {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .품목표 thead th > .th_텍스트:hover {
      color: #8064d8;
    }

    /* 정렬 방향 표시
       - 기본(비활성): 회색 옅은 ⇅ 아이콘 (항상 표시, 정렬 가능 힌트)
       - 활성 오름차순: 진한 보라 ▲
       - 활성 내림차순: 진한 보라 ▼ */
    .정렬표시 {
      display: inline-block;
      margin-left: 4px;
      font-size: 10px;
      vertical-align: middle;
      color: #b8b0cc;
    }

    .정렬표시.활성 {
      color: #8064d8;
      font-weight: 700;
    }

    /* 컬럼 구분 실선 (항상 보이는 세로선, 열 경계에 위치) */
    .품목표 thead th:not(:last-child) {
      border-right: 1px solid #8b849d;
    }

    .품목표 tbody td:not(:last-child) {
      border-right: 1px solid #ece6f7;
    }

    .품목표 tbody td {

      padding: 12px 14px;

      border-bottom: 1px solid #f4f1fb;

      color: #40385f;

      vertical-align: middle;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 컬럼 리사이즈 핸들
       - 열 경계선(border-right) 정중앙에 위치
       - 폭 14px, 경계선 기준 좌우 7px씩 걸침
       - 배경 완전 투명, cursor만 col-resize
       - 검은 세로선은 th의 border-right가 그대로 표시 */
    .리사이즈핸들 {
      position: absolute;
      top: 0;
      right: -7px;
      width: 14px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      z-index: 3;
      background: transparent;
    }

    body.리사이즈중 {
      cursor: col-resize !important;
      user-select: none;
    }
    body.리사이즈중 * {
      cursor: col-resize !important;
      user-select: none !important;
    }

    .품목표 tbody tr:last-child td {
      border-bottom: 0;
    }

    .품목표 tbody tr:hover {
      background: #faf8fe;
    }

    .품목표 .우 {
      text-align: right;
    }

    .품목표 .가운데 {
      text-align: center;
    }

    .품목링크 {
      cursor: pointer;
      color: #2563eb;
      margin: 0 6px;
    }

    .품목링크:hover {
      color: #1d4ed8;
    }

    .미사용텍스트 {
      color: #d92d20;
      font-weight: 700;
    }

    .사용뱃지 {

      display: inline-block;

      padding: 3px 10px;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 800;
    }

    .사용뱃지.사용 {
      background: #e5f4ec;
      color: #1f8a54;
    }

    .사용뱃지.미사용 {
      background: #f0eef3;
      color: #9a93a8;
    }

    .품목행버튼 {

      display: inline-flex;
      gap: 6px;
    }

    .품목안내 {

      padding: 50px 20px;

      text-align: center;

      color: #a19bad;

      font-size: 13px;
    }

    .품목상태 {

      min-height: 20px;

      margin-bottom: 12px;

      font-size: 13px;
      font-weight: 600;
    }

    .품목상태.성공 {
      color: #1f8a54;
    }

    .품목상태.오류 {
      color: #d93025;
    }


    /* ================================================================
       반응형
       ================================================================ */

    @media (max-width: 1100px) {

      .카드그리드 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }

    @media (max-width: 700px) {

      .사이드바 {
        width: 190px;
      }

      .콘텐츠 {
        padding: 20px;
      }

      .상단바 {
        padding: 0 20px;
      }

      .카드그리드 {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>


  <!-- ================================================================
       로그인
       ================================================================ -->

  <div
    id="인증화면"
    class="인증화면"
  >

    <div class="인증카드">

      <div class="brand">

        <div class="brand-main">
          VIVICELLLAB
        </div>

        <div class="brand-sub">
          ERP
        </div>

      </div>


      <div class="인증안내">

        사용할 병원을 선택한 후<br>

<script>

  let 품목_원본목록 = [];
  let 품목_현재표시목록 = [];   // 검색 필터 적용 후 목록 (정렬 재적용용)
  let 품목_정렬 = { 필드: null, 방향: null };   // 방향: 'asc' | 'desc'


  /* ================================================================

     ================================================================ */

  document.addEventListener(
    'DOMContentLoaded',
    function() {

      병원목록불러오기();

    }
  );


  /* ================================================================
     병원 목록
     ================================================================ */

  function 병원목록불러오기() {

    google.script.run

      .withSuccessHandler(
        function(hospitals) {

          const select =
            document.getElementById('로그인병원');

          select.innerHTML =
            '<option value="" disabled selected hidden>병원을 선택해주세요</option>';


          hospitals.forEach(
            function(hospital) {

              const option =
                document.createElement('option');

              option.value =
                hospital.병원ID;

              option.textContent =
                hospital.병원명;

              select.appendChild(option);

            }
          );

        }
      )

      .withFailureHandler(
        function(error) {

          오류표시(
            '병원 목록을 불러오지 못했습니다.'
          );

          console.error(error);

        }
      )

      .AUTH_getHospitals();

  }


  /* ================================================================
     로그인
     ================================================================ */

  function 로그인() {

    const hospitalId =
      document.getElementById(
        '로그인병원'
      ).value;


    const username =
      document.getElementById(
        '로그인아이디'
      ).value.trim();


    const password =
      document.getElementById(
        '로그인비밀번호'
      ).value;


    오류표시('');


    if (!hospitalId) {

      오류표시(
        '병원을 선택해주세요.'
      );

      return;

    }


    if (!username) {

      오류표시(
        '아이디를 입력해주세요.'
      );

      return;

    }


    if (!password) {

      오류표시(
        '비밀번호를 입력해주세요.'
      );

      return;

    }


    const button =
      document.getElementById(
        '로그인버튼'
      );


    button.disabled = true;
    button.textContent = '로그인 중...';


    google.script.run

      .withSuccessHandler(
        function(result) {

          현재세션 = result;


          sessionStorage.setItem(
            'vivicell_session',
            result.token
          );


          sessionStorage.setItem(
            'vivicell_user',
            JSON.stringify(result.user)
          );


          앱화면표시();

        }
      )

      .withFailureHandler(
        function(error) {

          button.disabled = false;
          button.textContent = '로그인';

          오류표시(
            error.message ||
            '로그인에 실패했습니다.'
          );

        }
      )

      .AUTH_login(
        hospitalId,
        username,
        password
      );

  }


  /* ================================================================

     ================================================================ */

  function 앱화면표시() {

    document.getElementById(
      '인증화면'
    ).style.display = 'none';


    document.getElementById(
      '앱화면'
    ).style.display = 'flex';


    const user =
      현재세션.user;


    document.getElementById(
      '사이드바병원명'
    ).textContent =
      병원명표시(user.병원ID);


    document.getElementById(
      '상단병원명'
    ).textContent =
      병원명표시(user.병원ID);


    document.getElementById(
      '사이드바사용자명'
    ).textContent =
      user.이름;


    document.getElementById(
      '사이드바사용자권한'
    ).textContent =
      권한명표시(user.권한);


    document.getElementById(
      '상단사용자명'
    ).textContent =
      user.이름;


    페이지이동('dashboard');

  }


  /* ================================================================
     병원명
     ================================================================ */

  function 병원명표시(병원ID) {

    const select =
      document.getElementById(
        '로그인병원'
      );


    for (
      let i = 0;
      i < select.options.length;
      i++
    ) {

      if (
        select.options[i].value === 병원ID
      ) {

        return select.options[i].textContent;

      }

    }


    return 병원ID || '-';

  }

    const map = {

      USER: '사용자'

    };


    return map[권한] || 권한 || '-';

  /* 그룹 아코디언 토글 (한 번에 한 그룹만 열림, 열 때 첫 하위 페이지 이동) */
  function 그룹토글(그룹키) {
    const 그룹요소 =
      document.querySelector(
        '.메뉴그룹[data-group="' + 그룹키 + '"]'
      );

    if (!그룹요소) return;

    const 이미열림 =
      그룹요소.classList.contains('열림');

    /* 모든 그룹 닫기 */
    document
      .querySelectorAll('.메뉴그룹')
      .forEach(function(g) {
        g.classList.remove('열림');
      });

    if (!이미열림) {
      그룹요소.classList.add('열림');

      const 첫하위 =
        그룹요소.querySelector('.하위버튼');

      if (첫하위 && 첫하위.dataset.page) {
        페이지이동(첫하위.dataset.page);
      }
    }
  }


  function 페이지이동(page) {

    현재페이지 = page;


    /* 모든 최상위/하위 버튼 active 초기화 후 해당 페이지만 active */
    document
      .querySelectorAll('.메뉴버튼, .하위버튼')
      .forEach(function(button) {
        button.classList.toggle(
          'active',
          button.dataset.page === page
        );
      });


    /* 소속 그룹만 열고 나머지 그룹 닫기 */
    const 소속그룹 = 페이지_그룹[page];

    document
      .querySelectorAll('.메뉴그룹')
      .forEach(function(g) {
        g.classList.toggle(
          '열림',
          g.dataset.group === 소속그룹
        );
      });


    const info =
      페이지정보[page] || { title: page, description: '' };


    document.getElementById(
      '페이지제목'
    ).textContent =
      info.title;


    document.getElementById(
      '페이지설명'
    ).textContent =
      info.description;


    페이지렌더링(page);

  }

    const content =
      document.getElementById(
        '콘텐츠'
      );


    if (page === 'dashboard') {

      content.innerHTML =
        대시보드화면();

      return;

    if (page === 'item') {

      content.innerHTML =
        품목관리화면();

      품목표_컬럼리사이즈초기화();

      품목_목록불러오기();

      return;

    }


    /* 하위 페이지는 모두 준비화면 (기능 구현 순서대로 하나씩 교체) */
    const info =
      페이지정보[page] || { title: page, description: '' };

    content.innerHTML =
      준비화면(
        info.title,
        info.description + ' 화면을 준비하고 있습니다.'
      );

  }

    google.script.run

      .withSuccessHandler(
        function(list) {

            Array.isArray(list) ? list : [];

          품목_테이블렌더(품목_원본목록);

        }
      )

      .withFailureHandler(
        function(error) {

          품목_상태표시(
            (error && error.message) ||
            '품목 목록을 불러오지 못했습니다.',
            '오류'
          );

          const tb =
            document.getElementById('품목표본문');

          if (tb) {
            tb.innerHTML =
              '<tr><td colspan="7"><div class="품목안내">불러오기에 실패했습니다.</div></td></tr>';
          }

      )

      .ITEM_getList(
        현재세션 ? 현재세션.token : ''
      );

  /* ================================================================
     품목 관리 - 검색(클라이언트 필터)
     ================================================================ */

  function 품목_검색() {

    const 이름값 =
      (document.getElementById('품목검색_품목명') || {}).value || '';

    const 분류값 =
      (document.getElementById('품목검색_분류') || {}).value || '';

    const 사용값 =
      (document.getElementById('품목검색_사용여부') || {}).value || 'all';


    const 이름 = 이름값.trim().toLowerCase();
    const 분류 = 분류값.trim().toLowerCase();


    const 결과 =
      품목_원본목록.filter(function(item) {

        const 품목명 =
          String(item.품목명 || '').toLowerCase();

        const 품목분류 =
          String(item.분류 || '').toLowerCase();

        const 사용 =
          품목_사용여부불린(item.사용여부);


        if (이름 && 품목명.indexOf(이름) === -1) {
          return false;
        }

        if (분류 && 품목분류.indexOf(분류) === -1) {
          return false;
        }

        if (사용값 === 'use' && !사용) {
          return false;
        }

        if (사용값 === 'unuse' && 사용) {
          return false;
        }

        return true;

      });


    품목_테이블렌더(결과);

  }


  /* ================================================================
     품목 관리 - 검색(엔터) / 초기화
     ================================================================ */

  function 품목_검색_엔터(event) {

    if (event && event.key === 'Enter') {
      품목_검색();
    }

  function 품목_검색초기화() {

    const 이름 =
      document.getElementById('품목검색_품목명');
    if (이름) { 이름.value = ''; }

    const 분류 =
      document.getElementById('품목검색_분류');
    if (분류) { 분류.value = ''; }

    const 사용 =
      document.getElementById('품목검색_사용여부');
    if (사용) { 사용.value = 'all'; }

    품목_테이블렌더(품목_원본목록);

  }


  /* ================================================================
     품목 관리 - 테이블 렌더
     ================================================================ */

  function 품목_테이블렌더(list) {

    // 검색/필터 결과를 저장해두고, 정렬 상태에 맞게 재렌더 가능하게 함
    품목_현재표시목록 = list || [];

    const tbody =
      document.getElementById('품목표본문');

    if (!tbody) {
      return;
    }


    if (!list || list.length === 0) {

      tbody.innerHTML =
        '<tr><td colspan="7"><div class="품목안내">표시할 품목이 없습니다.</div></td></tr>';

      품목_정렬표시갱신();
      return;

    }


    const 정렬된 = 품목_정렬적용(list);

    tbody.innerHTML =
      정렬된.map(function(item) {

        const 사용 =
          품목_사용여부불린(item.사용여부);

        const 품목ID =
          String(item.품목ID || '');


        return `
          <tr>
            <td>${품목_escape(품목ID)}</td>
            <td>${품목_escape(item.분류)}</td>
            <td>${품목_escape(item.품목명)}</td>
            <td>${품목_escape(item.단위)}</td>
            <td>${품목_escape(item.규격)}</td>
            <td class="가운데">${사용 ? '사용' : '<span class="미사용텍스트">미사용</span>'}</td>
            <td class="가운데">
              <span
                class="품목링크"
                onclick="품목_수정폼열기('${품목_escapeAttr(품목ID)}')"
              >수정</span>
              <span
                class="품목링크"
                onclick="품목_삭제('${품목_escapeAttr(품목ID)}')"
              >삭제</span>
            </td>
          </tr>
        `;

      }).join('');

    품목_정렬표시갱신();

  }


  /* ================================================================
     품목 관리 - 정렬 (오름차순 ↔ 내림차순 토글)
     ================================================================ */

  function 품목_정렬토글(필드) {

    if (품목_정렬.필드 === 필드) {
      // 같은 컬럼: 방향 반전
      품목_정렬.방향 =
        품목_정렬.방향 === 'asc' ? 'desc' : 'asc';
    } else {
      // 다른 컬럼: 오름차순부터
      품목_정렬 = { 필드: 필드, 방향: 'asc' };
    }

    // 현재 표시 중인 목록을 다시 렌더 (정렬만 재적용)
    품목_테이블렌더(품목_현재표시목록);

  }


  function 품목_정렬적용(list) {

    if (!품목_정렬.필드 || !품목_정렬.방향) {
      return list;
    }

    const 필드 = 품목_정렬.필드;
    const 부호 = 품목_정렬.방향 === 'asc' ? 1 : -1;

    return list.slice().sort(function(a, b) {

      const va = a[필드];
      const vb = b[필드];

      // 사용여부는 불린 정렬 (false < true)
      if (필드 === '사용여부') {
        const na = (va === true || String(va).toLowerCase() !== 'false') ? 1 : 0;
        const nb = (vb === true || String(vb).toLowerCase() !== 'false') ? 1 : 0;
        return (na - nb) * 부호;
      }

      // 문자열 정렬 (한글 로케일)
      return String(va == null ? '' : va)
        .localeCompare(
          String(vb == null ? '' : vb),
          'ko'
        ) * 부호;

    });

  }


  function 품목_정렬표시갱신() {

    document
      .querySelectorAll('.정렬표시')
      .forEach(function(el) {

        const key = el.dataset.key;
        const 활성 =
          key === 품목_정렬.필드 && 품목_정렬.방향;

        if (활성) {
          el.textContent =
            품목_정렬.방향 === 'asc' ? '▲' : '▼';
          el.classList.add('활성');
        } else {
          // 기본 상태: 옅은 회색 ⇅ (정렬 가능 힌트)
          el.textContent = '⇅';
          el.classList.remove('활성');
        }

      });

  }


  /* ================================================================
     품목 관리 - 등록 폼 열기
     ================================================================ */

  function 품목_등록폼열기() {

    document.getElementById('품목폼제목').textContent = '품목 등록';

    document.getElementById('품목_품목ID').value = '';
    document.getElementById('품목_분류').value = '';
    document.getElementById('품목_품목명').value = '';
    document.getElementById('품목_단위').value = '';
    document.getElementById('품목_규격').value = '';
    document.getElementById('품목_사용여부').checked = true;

    품목_상태표시('', '');

    document.getElementById('품목폼').classList.add('열림');

    document.getElementById('품목_품목명').focus();

  }


  /* ================================================================
     품목 관리 - 수정 폼 열기
     ================================================================ */

  function 품목_수정폼열기(품목ID) {

    const item =
      품목_원본목록.filter(function(x) {
        return String(x.품목ID) === String(품목ID);
      })[0];


    if (!item) {
      품목_상태표시('수정할 품목을 찾을 수 없습니다.', '오류');
      return;
    }


    document.getElementById('품목폼제목').textContent = '품목 수정';

    document.getElementById('품목_품목ID').value = String(item.품목ID || '');
    document.getElementById('품목_분류').value = String(item.분류 || '');
    document.getElementById('품목_품목명').value = String(item.품목명 || '');
    document.getElementById('품목_단위').value = String(item.단위 || '');
    document.getElementById('품목_규격').value = String(item.규격 || '');
    document.getElementById('품목_사용여부').checked =
      품목_사용여부불린(item.사용여부);

    품목_상태표시('', '');

    document.getElementById('품목폼').classList.add('열림');

    document.getElementById('품목_품목명').focus();

  }


  /* ================================================================
     품목 관리 - 폼 닫기
     ================================================================ */

  function 품목_폼닫기() {

    document.getElementById('품목폼').classList.remove('열림');

  }


  /* ================================================================
     품목 관리 - 저장(등록/수정)
     ================================================================ */

  function 품목_저장() {

    const 품목ID =
      document.getElementById('품목_품목ID').value.trim();

    const 품목명 =
      document.getElementById('품목_품목명').value.trim();

    const 분류 =
      document.getElementById('품목_분류').value.trim();

    const 단위 =
      document.getElementById('품목_단위').value.trim();

    const 규격 =
      document.getElementById('품목_규격').value.trim();

    const 사용여부 =
      document.getElementById('품목_사용여부').checked;


    if (!품목명) {
      품목_상태표시('품목명을 입력해주세요.', '오류');
      document.getElementById('품목_품목명').focus();
      return;
    }


    const data = {
      분류: 분류,
      품목명: 품목명,
      단위: 단위,
      규격: 규격,
      사용여부: 사용여부
    };

    if (품목ID) {
      data.품목ID = 품목ID;
    }


    const 저장버튼 =
      document.getElementById('품목저장버튼');

    저장버튼.disabled = true;
    저장버튼.textContent = '저장 중...';


    google.script.run

      .withSuccessHandler(
        function(message) {

          저장버튼.disabled = false;
          저장버튼.textContent = '저장';

          품목_폼닫기();

          품목_상태표시(
            String(message || '저장되었습니다.'),
            '성공'
          );

          품목_목록불러오기();

        }
      )

      .withFailureHandler(
        function(error) {

          저장버튼.disabled = false;
          저장버튼.textContent = '저장';

          품목_상태표시(
            (error && error.message) || '저장에 실패했습니다.',
            '오류'
          );

        }
      )

      .ITEM_save(
        현재세션 ? 현재세션.token : '',
        data
      );

  }


  /* ================================================================
     품목 관리 - 삭제
     ================================================================ */

  function 품목_삭제(품목ID) {

    const id = String(품목ID || '').trim();

    if (!id) {
      return;
    }


    const item =
      품목_원본목록.filter(function(x) {
        return String(x.품목ID) === id;
      })[0];

    const 이름 =
      item ? String(item.품목명 || '') : '';


    const 확인 =
      window.confirm(
        '다음 품목을 삭제하시겠습니까?\n\n' +
        id + (이름 ? ' / ' + 이름 : '')
      );

    if (!확인) {
      return;
    }


    google.script.run

      .withSuccessHandler(
        function(message) {

          품목_상태표시(
            String(message || '삭제되었습니다.'),
            '성공'
          );

          품목_목록불러오기();

        }
      )

      .withFailureHandler(
        function(error) {

          품목_상태표시(
            (error && error.message) || '삭제에 실패했습니다.',
            '오류'
          );

        }
      )

      .ITEM_delete(
        현재세션 ? 현재세션.token : '',
        id
      );

  }


  /* ================================================================
     품목 관리 - 유틸
     ================================================================ */

  function 품목_상태표시(message, type) {

    const el =
      document.getElementById('품목상태');

    if (!el) {
      return;
    }

    el.textContent = message || '';

    el.className = '품목상태';

    if (type === '성공') {
      el.classList.add('성공');
    } else if (type === '오류') {
      el.classList.add('오류');
    }

  }


  function 품목_사용여부불린(값) {

    if (값 === true) {
      return true;
    }

    if (값 === false) {
      return false;
    }

    const s =
      String(값 == null ? '' : 값).trim().toLowerCase();

    if (s === 'false' || s === '' || s === '0' || s === '미사용') {
      return false;
    }

    return true;

  }


  function 품목_숫자콤마(값) {

    if (값 === '' || 값 == null) {
      return '';
    }

    const n = Number(값);

    if (isNaN(n)) {
      return 품목_escape(값);
    }

    return n.toLocaleString('ko-KR');

  }


  function 품목_escape(값) {

    return String(값 == null ? '' : 값)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');

  }


  function 품목_escapeAttr(값) {

    return String(값 == null ? '' : 값)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '&quot;');

  }


  /* ================================================================
     품목 관리 - 컬럼 너비 조절 (드래그 리사이즈 + localStorage 저장)
     ================================================================ */

  const 품목표_저장키 = '품목표_컬럼너비_v1';


  function 품목표_컬럼너비불러오기() {

    try {

      return JSON.parse(
        localStorage.getItem(품목표_저장키) || '{}'
      );

    } catch (e) {

      return {};

    }

  }


  function 품목표_컬럼너비저장() {

    const table =
      document.querySelector('.품목표');

    if (!table) return;


    const 결과 = {};

    table.querySelectorAll('colgroup col').forEach(
      function(col) {

        const key = col.dataset.key;
        const w = col.style.width;

        if (key && w) {
          결과[key] = w;
        }

      }
    );


    try {

      localStorage.setItem(
        품목표_저장키,
        JSON.stringify(결과)
      );

    } catch (e) {
      /* 저장 실패는 조용히 무시 (프라이빗 모드 등) */
    }

  }


  function 품목표_컬럼리사이즈초기화() {

    const table =
      document.querySelector('.품목표');

    if (!table) return;


    const cols =
      table.querySelectorAll('colgroup col');


    /* 저장된 너비 복원 */
    const 저장 = 품목표_컬럼너비불러오기();

    cols.forEach(
      function(col) {

        const key = col.dataset.key;

        if (key && 저장[key]) {
          col.style.width = 저장[key];
        }

      }
    );


    /* 각 핸들에 드래그 리스너 부착 */
    const handles =
      table.querySelectorAll('.리사이즈핸들');

    handles.forEach(
      function(handle) {

        handle.addEventListener(
          'mousedown',
          function(event) {

            event.preventDefault();
            event.stopPropagation();


            const 컬럼인덱스 =
              parseInt(handle.dataset.col, 10);

            const 대상col = cols[컬럼인덱스];

            if (!대상col) return;


            const 시작X = event.pageX;
            const 시작너비 =
              대상col.getBoundingClientRect().width;


            document.body.classList.add('리사이즈중');
            handle.classList.add('활성');


            function 드래그이동(ev) {

              const 이동량 = ev.pageX - 시작X;
              const 새너비 = Math.max(40, 시작너비 + 이동량);

              대상col.style.width = 새너비 + 'px';

            }


            function 드래그종료() {

              document.removeEventListener('mousemove', 드래그이동);
              document.removeEventListener('mouseup', 드래그종료);

              document.body.classList.remove('리사이즈중');
              handle.classList.remove('활성');

              품목표_컬럼너비저장();

            }


            document.addEventListener('mousemove', 드래그이동);
            document.addEventListener('mouseup', 드래그종료);

          }
        );

      }
    );

  }


  /* ================================================================
     로그아웃
     ================================================================ */

  function 로그아웃() {

    if (!현재세션) {
      로그인화면으로돌아가기();
      return;
    }


    google.script.run

      .withSuccessHandler(
        function() {

          로그인화면으로돌아가기();

        }
      )

      .withFailureHandler(
        function() {

          로그인화면으로돌아가기();

        }
      )

      .AUTH_logout(
        현재세션.token
      );

  }


  /* ================================================================
     로그인 화면으로
     ================================================================ */

  function 로그인화면으로돌아가기() {

    현재세션 = null;


    sessionStorage.removeItem(
      'vivicell_session'
    );

    sessionStorage.removeItem(
      'vivicell_user'
    );


    document.getElementById(
      '앱화면'
    ).style.display = 'none';


    document.getElementById(
      '인증화면'
    ).style.display = 'flex';


    document.getElementById(
      '로그인비밀번호'
    ).value = '';


    document.getElementById(
      '로그인버튼'
    ).disabled = false;


    document.getElementById(
      '로그인버튼'
    ).textContent = '로그인';

  }


  /* ================================================================
     오류
     ================================================================ */

  function 오류표시(message) {

    document.getElementById(
      '오류메시지'
    ).textContent =
      message || '';

  }


  /* ================================================================
     Enter 로그인
     ================================================================ */

  document.addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter' &&
        document.getElementById('인증화면').style.display !== 'none'
      ) {

        로그인();

      }

    }
  );

</script>
